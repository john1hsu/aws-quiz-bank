true_statement: 'The Well-Architected Operational Excellence pillar groups its best practices into four areas: Organization, Prepare, Operate and Evolve.'
false_statement: 'The Well-Architected Operational Excellence pillar groups its best practices into four areas: Organization, Prepare, Operate and Recover.'
