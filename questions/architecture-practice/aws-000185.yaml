id: aws-000185
product_area: architecture-practice
true_statement: Security pillar best practice SEC01-BP01 calls for separating workloads and environments into different AWS accounts organized into OUs.
false_statement: Security pillar best practice SEC01-BP01 calls for separating workloads and environments into different VPCs inside one shared AWS account.
explanation: SEC01-BP01 uses accounts as the isolation boundary, grouped into organizational units whose controls member accounts inherit. Mixing workloads of different data sensitivity in one account is one of its named anti-patterns.
