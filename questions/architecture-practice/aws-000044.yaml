id: aws-000044
product_area: architecture-practice
true_statement: A warm standby that is provisioned for full production load, so failover does not depend on scaling up, is called a hot standby.
false_statement: A warm standby that is provisioned for full production load, so failover does not depend on scaling up, is called a pilot light.
explanation: AWS uses the term hot standby for a fully sized warm standby. Pilot light is the opposite end, where application compute is switched off until recovery.
