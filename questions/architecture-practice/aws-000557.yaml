id: aws-000557
product_area: architecture-practice
true_statement: Synchronous multi-Region replication avoids data loss but typically needs three Regions with a two-of-three quorum, and can raise write latency by an order of magnitude.
false_statement: Synchronous multi-Region replication avoids data loss and typically needs only two Regions with no quorum, while adding no noticeable write latency.
explanation: Synchronous writes must be acknowledged across Regions, so latency rises sharply and a quorum across three Regions is the usual design. Asynchronous replication keeps writes fast but can lose in-flight data on failover.
