id: aws-000335
product_area: architecture-practice
true_statement: The Sustainability Pillar says two hosts at 30% utilization are less efficient than one host at 60%, because every running host draws baseline power.
false_statement: The Sustainability Pillar says two hosts at 30% utilization are more efficient than one host at 60%, because spreading load lowers the power each host draws.
explanation: Each host has a fixed power floor regardless of load, so consolidating work onto fewer, busier hosts wastes less energy. That is why maximizing utilization is a design principle.
