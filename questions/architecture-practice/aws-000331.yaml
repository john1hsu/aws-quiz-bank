id: aws-000331
product_area: architecture-practice
true_statement: The Cost Optimization Pillar estimates that running dev and test environments only during an eight-hour working day saves about 75%, as they run 40 of 168 weekly hours.
false_statement: The Cost Optimization Pillar estimates that running dev and test environments only during an eight-hour working day saves about 25%, as they run 40 of 168 weekly hours.
explanation: Forty hours is roughly a quarter of a 168-hour week, so the saving is about three quarters of the always-on cost. A 25% saving would mean the environments still ran most of the week.
