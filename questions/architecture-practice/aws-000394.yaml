id: aws-000394
product_area: architecture-practice
true_statement: The Reliability Pillar has publishers attach an idempotency token to each message, and consumers record the tokens they have processed so they can skip repeats.
false_statement: The Reliability Pillar has consumers attach an idempotency token to each message, and publishers record the tokens they have sent so they never deliver a message twice.
explanation: At-least-once delivery means duplicates will arrive, so the consumer must recognize them using a token the publisher supplied. Publishers cannot guarantee single delivery on their own.
