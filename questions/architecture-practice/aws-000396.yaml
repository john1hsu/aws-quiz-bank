id: aws-000396
product_area: architecture-practice
true_statement: For latency-sensitive event paths, the Serverless Lens suggests filtering and routing with Amazon SNS and SQS rather than with Amazon EventBridge.
false_statement: For latency-sensitive event paths, the Serverless Lens suggests filtering and routing with Amazon EventBridge rather than with Amazon SNS and SQS.
explanation: EventBridge adds some routing latency, so SNS fan-out with SQS buffering is the lower-latency choice. EventBridge remains the usual router when content-based rules matter more than speed.
