id: aws-000395
product_area: architecture-practice
true_statement: EventBridge rules give an event-driven system choreography with no central controller, while Step Functions orchestrates a multi-step workflow from one place.
false_statement: Step Functions gives an event-driven system choreography with no central controller, while EventBridge rules orchestrate a multi-step workflow from one place.
explanation: On an event bus, producers don't know their consumers and each team subscribes with its own rule. Step Functions is the orchestrator for processes that need end-to-end control of branching, retries and errors.
