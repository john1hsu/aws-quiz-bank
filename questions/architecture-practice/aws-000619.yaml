id: aws-000619
product_area: architecture-practice
true_statement: A workload that launches replacement capacity in another AZ only after a failure is bimodal, while a statically stable one already has that capacity running.
false_statement: A workload that already has replacement capacity running in another AZ is bimodal, while a statically stable one launches that capacity only after a failure.
explanation: Bimodal means acting one way normally and another way in a failure. Static stability avoids that by pre-provisioning, so nothing has to change mode or call a control plane when a zone is lost.
