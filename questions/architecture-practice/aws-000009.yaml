id: aws-000009
product_area: architecture-practice
true_statement: The Well-Architected Framework covers how a single workload is built and run; organization-wide cloud adoption planning is the job of the AWS Cloud Adoption Framework.
false_statement: The Cloud Adoption Framework covers how a single workload is built and run; organization-wide cloud adoption planning is the job of the AWS Well-Architected Framework.
explanation: Well-Architected reviews target individual workloads and their design trade-offs. The Cloud Adoption Framework addresses adopting the cloud across an organization, so the roles are reversed in the false statement.
