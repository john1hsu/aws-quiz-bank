id: aws-000620
product_area: architecture-practice
true_statement: AWS Lambda pre-provisions capacity in every Availability Zone so the healthy zones can absorb an impaired zone's traffic without scaling up.
false_statement: AWS Lambda keeps capacity in one Availability Zone at a time and launches more in a healthy zone after the active zone is impaired.
explanation: 'Lambda is built to be statically stable: spare capacity already sits in each AZ, accepting extra cost so a zone failure needs no scale-out. Launching capacity after the fact is the control plane approach it avoids.'
