id: aws-000554
product_area: architecture-practice
true_statement: Consistent hashing lets a cell-based workload add cells without a full rebalance, whereas hash-modulo mapping reshuffles almost every key when the cell count changes.
false_statement: Hash-modulo mapping lets a cell-based workload add cells without a full rebalance, whereas consistent hashing reshuffles almost every key when the cell count changes.
explanation: Consistent hashing maps keys to many logical buckets and buckets to cells, so a new cell takes over only some buckets. Hash-modulo spreads keys evenly but moves nearly all of them when the divisor changes.
