id: aws-000008
product_area: architecture-practice
true_statement: Under the AWS Well-Architected Framework, security and operational excellence are generally not traded off, while pillars such as reliability and cost can be balanced by business context.
false_statement: Under the AWS Well-Architected Framework, reliability and cost optimization are generally not traded off, while pillars such as security and operational excellence can be balanced by business context.
explanation: AWS accepts trading reliability against cost, for example in cheaper dev environments. Security and operational excellence are the pillars AWS says are generally kept non-negotiable.
