id: aws-000187
product_area: architecture-practice
true_statement: The Security pillar's application security guidance puts threat modeling in the design phase, so flaws are caught while they are still cheap to fix.
false_statement: The Security pillar's application security guidance puts threat modeling after deployment, so flaws are judged against how the application really runs.
explanation: SEC 11 covers security across design, development and deployment, and it places threat modeling early. Finding a design flaw before code is written costs far less than fixing it in production.
