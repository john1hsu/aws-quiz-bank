id: aws-000556
product_area: architecture-practice
true_statement: Because the Route 53 control plane is hosted in us-east-1, AWS advises Regional failover through data-plane mechanisms such as health checks, not DNS record edits.
false_statement: Because the Route 53 control plane is replicated in every Region, AWS advises Regional failover through DNS record edits rather than health checks.
explanation: Changing records is a control-plane action tied to us-east-1, which is risky if that Region is the one impaired. Health checks and ARC routing controls act on the data plane, which stays available.
