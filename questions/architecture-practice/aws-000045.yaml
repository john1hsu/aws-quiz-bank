id: aws-000045
product_area: architecture-practice
true_statement: In AWS's DR guidance, backup and restore has an indicative RTO of 24 hours or less, while pilot light targets tens of minutes.
false_statement: In AWS's DR guidance, pilot light has an indicative RTO of 24 hours or less, while backup and restore targets tens of minutes.
explanation: Backup and restore must redeploy infrastructure and restore data, so its recovery time is the longest. Pilot light already has data and core infrastructure in place, so it recovers in tens of minutes.
