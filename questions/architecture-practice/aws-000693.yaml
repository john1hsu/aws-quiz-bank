id: aws-000693
product_area: architecture-practice
true_statement: Shuffle sharding may be used inside a cell of a cell-based architecture but not across cells, because cells must not share state.
false_statement: Shuffle sharding may be used across the cells of a cell-based architecture but not inside one, because a cell must not share workers.
explanation: Assigning a customer a combination of workers drawn from several cells would couple those cells together. Within a single cell, shuffle sharding can add another layer of isolation.
