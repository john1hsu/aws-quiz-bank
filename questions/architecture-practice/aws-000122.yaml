product_area: architecture-practice
true_statement: In Well-Architected availability math, a 99.99% service with two hard dependencies at 99.99% each lands at about 99.97% availability.
false_statement: In Well-Architected availability math, a 99.99% service with two hard dependencies at 99.99% each lands at about 99.9999% availability.
explanation: Hard dependencies multiply, so each one pulls the total down slightly. Adding nines only applies to independent redundant components, which is where a figure like 99.9999% comes from.
