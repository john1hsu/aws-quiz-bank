true_statement: Recovery point objective is the longest acceptable time since the last recovery point, while recovery time objective is the longest acceptable delay before service is restored.
false_statement: Recovery time objective is the longest acceptable time since the last recovery point, while recovery point objective is the longest acceptable delay before service is restored.
explanation: RPO bounds data loss and RTO bounds downtime; both are set by the business. The false statement attaches each definition to the wrong objective.
