id: aws-000621
product_area: architecture-practice
true_statement: A statically stable client refreshes its configuration on a fixed schedule and, if a refresh fails, keeps using the cached value and raises an alarm.
false_statement: A statically stable client refreshes its configuration on a fixed schedule and, if a refresh fails, discards the cached value and retries until a refresh succeeds.
explanation: Constant-work refreshes avoid a burst of load after a network blip, and falling back on the last known good value keeps the client serving. Dropping the cache would make it depend on the failed source.
