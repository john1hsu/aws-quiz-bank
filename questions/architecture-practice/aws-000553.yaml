id: aws-000553
product_area: architecture-practice
true_statement: In a cell-based architecture each cell has a maximum size found by load testing, and the workload grows by adding cells rather than enlarging existing ones.
false_statement: In a cell-based architecture each cell has a maximum size found by load testing, and the workload grows by enlarging existing cells rather than adding new ones.
explanation: Bounded cells keep scaling within known, tested limits and quotas. Letting cells grow without bound is an explicit anti-pattern; capacity is added as new cells.
