true_statement: The performance efficiency design principle called mechanical sympathy means choosing technology that fits the goal, such as matching a data store to the workload's access patterns.
false_statement: The performance efficiency design principle called democratizing advanced technologies means choosing technology that fits the goal, such as matching a data store to the workload's access patterns.
explanation: 'Mechanical sympathy is about fitting the technology to how the workload uses it. Democratizing advanced technologies is a different principle: consuming specialized tech such as ML or NoSQL as managed services.'
