id: aws-000691
product_area: architecture-practice
true_statement: With eight workers and two per customer, shuffle sharding gives 28 combinations, so one bad customer affects about 1/28 of the service, versus 1/4 with four fixed shards.
false_statement: With eight workers and two per customer, shuffle sharding gives 4 combinations, so one bad customer affects about 1/4 of the service, the same as with four fixed shards.
explanation: Any two of eight workers can form a shard, which gives 28 distinct pairs. Impact scales with 1 over the number of combinations, so isolation is about seven times better than plain sharding on the same hardware.
