id: aws-000257
product_area: architecture-practice
true_statement: Per the Well-Architected networking guidance, a cluster placement group with supported instances and ENA gives a low-jitter network of up to 25 Gbps between instances.
false_statement: Per the Well-Architected networking guidance, a spread placement group with supported instances and ENA gives a low-jitter network of up to 25 Gbps between instances.
explanation: Cluster placement groups pack instances close together for low-latency, high-throughput networking. Spread placement groups separate instances onto distinct hardware for resilience, not network performance.
