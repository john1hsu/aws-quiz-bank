id: aws-000186
product_area: architecture-practice
true_statement: The Security pillar's apply-security-at-all-layers principle means defense in depth, from the network edge and VPC down to the application and its code.
false_statement: The Security pillar's maintain-traceability principle means defense in depth, from the network edge and VPC down to the application and its code.
explanation: Layered controls are the point of applying security at all layers. Maintaining traceability is a different principle, about monitoring, alerting on and auditing actions in real time.
