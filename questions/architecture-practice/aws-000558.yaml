id: aws-000558
product_area: architecture-practice
true_statement: In a write-partitioned multi-Region design, each record has a home Region chosen by a key such as user ID, which avoids write conflicts.
false_statement: In a write-local multi-Region design, each record has a home Region chosen by a key such as user ID, which avoids write conflicts.
explanation: Write partitioned assigns every record a home Region, at the cost of repartitioning if a Region is lost. Write local lets every Region accept writes to any record, which is why it needs conflict resolution such as last writer wins.
