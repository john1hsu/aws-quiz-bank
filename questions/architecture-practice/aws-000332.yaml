id: aws-000332
product_area: architecture-practice
true_statement: On-Demand Capacity Reservations are billed at the On-Demand rate whether or not the reserved capacity is used, so the Well-Architected guidance warns they are not a discount.
false_statement: On-Demand Capacity Reservations are billed at a discount to the On-Demand rate and only while instances use the reserved capacity, so the Well-Architected guidance treats them as a discount.
explanation: A Capacity Reservation guarantees capacity, not price, and you pay On-Demand rates for it even when it sits idle. Discounts come from Savings Plans, Reserved Instances or Spot.
