id: aws-000120
product_area: architecture-practice
true_statement: In the Operational Excellence pillar, runbooks guide the response to well-understood events, while playbooks guide the investigation of issues.
false_statement: In the Operational Excellence pillar, playbooks guide the response to well-understood events, while runbooks guide the investigation of issues.
explanation: AWS's Operate guidance uses runbooks as step-by-step procedures for known events and playbooks for working out what is wrong when the cause is unclear. The false statement swaps the two.
