true_statement: In the AWS CAF, the Align phase finds capability gaps and cross-team dependencies, while the Launch phase delivers production pilots that show incremental value.
false_statement: In the AWS CAF, the Launch phase finds capability gaps and cross-team dependencies, while the Align phase delivers production pilots that show incremental value.
explanation: CAF's phases run Envision, Align, Launch and Scale. Align is where stakeholders agree on gaps to close; Launch puts pilots into production before Scale expands them.
