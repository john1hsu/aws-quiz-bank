true_statement: Under the Cost Optimization Pillar's demand and supply guidance, Auto Scaling manages the supply side, while API Gateway throttling and SQS buffering manage the demand side.
false_statement: Under the Cost Optimization Pillar's demand and supply guidance, API Gateway throttling and SQS buffering manage the supply side, while Auto Scaling manages the demand side.
explanation: Supply-side tactics change how much capacity exists, which is what Auto Scaling does. Demand-side tactics shape incoming work, by throttling requests or queuing them for later.
