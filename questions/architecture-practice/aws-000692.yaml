id: aws-000692
product_area: architecture-practice
true_statement: Shuffle sharding works only if clients retry against the other workers in their combination when some of them are degraded.
false_statement: Shuffle sharding works only if clients send each request to a single fixed worker and never retry when that worker is degraded.
explanation: A customer's combination may overlap with an impaired one, so callers must route around the bad workers. The retry count also sets how many workers a shard can usefully hold.
