id: aws-000555
product_area: architecture-practice
true_statement: Following static stability, a cell router's data plane should keep serving from its last known cell map even while the cell control plane is down.
false_statement: Following static stability, a cell router's data plane should stop routing new requests until the cell control plane is back up.
explanation: The control plane provisions cells and places tenants, but routing must not depend on it being available. Serving from the last known map keeps existing customers working through a control-plane outage.
