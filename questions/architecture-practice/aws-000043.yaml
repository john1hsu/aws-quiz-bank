id: aws-000043
product_area: architecture-practice
true_statement: A pilot light DR site cannot serve any request until its compute is started, while a warm standby can take traffic immediately at reduced capacity.
false_statement: A warm standby DR site cannot serve any request until its compute is started, while a pilot light can take traffic immediately at reduced capacity.
explanation: Pilot light keeps data and core infrastructure ready but runs no application instances. Warm standby runs a scaled-down working copy that can serve traffic and scale up on failover.
