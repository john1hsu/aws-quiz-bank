id: aws-000230
product_area: migration-and-hybrid
true_statement: AWS Data Transfer Terminals are billed per reserved port hour, with a one-hour minimum, and carry no charge based on data volume.
false_statement: AWS Data Transfer Terminals are billed per terabyte copied, with a one-terabyte minimum, and carry no charge based on reserved time.
explanation: 'Terminal pricing is time-based: you pay for the port hours you reserve, whatever the amount of data moved. Rates also rise when the terminal and AWS endpoint are on different continents.'
