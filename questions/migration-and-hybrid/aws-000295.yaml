id: aws-000295
product_area: migration-and-hybrid
true_statement: For large migrations, AWS Prescriptive Guidance does not recommend refactoring and favors strategies such as rehost, replatform, relocate and retire.
false_statement: For large migrations, AWS Prescriptive Guidance recommends refactoring each workload first and avoids strategies such as rehost and relocate.
explanation: Refactoring is the most complex and costly strategy, so AWS advises migrating first and modernizing later, once rehosted workloads are already running on AWS.
