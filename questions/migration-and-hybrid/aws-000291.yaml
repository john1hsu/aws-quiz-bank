id: aws-000291
product_area: migration-and-hybrid
true_statement: A VPC – Internet endpoint in AWS Transfer Family attaches Elastic IP addresses that partners can allow-list, while a Public endpoint has no static IP.
false_statement: A Public endpoint in AWS Transfer Family attaches Elastic IP addresses that partners can allow-list, while a VPC – Internet endpoint has no static IP.
explanation: Fixed, allow-listable addresses come from the VPC – Internet endpoint type, which also supports security groups. The Public endpoint offers SFTP only, with no static IP or source-IP filtering.
