id: aws-000593
product_area: migration-and-hybrid
true_statement: AWS Elastic Disaster Recovery allows 300 replicating source servers per account per Region by default, and that quota cannot be raised (as of 2026-11).
false_statement: AWS Elastic Disaster Recovery allows 3,000 replicating source servers per account per Region by default, and that quota cannot be raised (as of 2026-11).
explanation: The replicating-server limit is a fixed 300 per account per Region. To recover more, AWS lets several staging accounts feed up to 3,000 servers into one target account.
