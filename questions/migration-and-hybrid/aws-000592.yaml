id: aws-000592
product_area: migration-and-hybrid
true_statement: AWS Elastic Disaster Recovery charges a flat $0.028 per replicating source server per hour, the same whichever Region you replicate to (as of 2026-11).
false_statement: AWS Elastic Disaster Recovery charges a flat $0.028 per GB of replicated data per month, the same whichever Region you replicate to (as of 2026-11).
explanation: DRS bills per source server-hour, with no upfront fee. Staging EBS volumes, snapshots, replication servers and any drill or recovery instances are billed separately at standard rates.
