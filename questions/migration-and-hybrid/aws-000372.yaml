id: aws-000372
product_area: migration-and-hybrid
true_statement: A MAP 2.0 map-migrated tag value combines a lowercase prefix such as mig, sap or oracle with the Migration Program Engagement ID from the MAP agreement.
false_statement: A MAP 2.0 map-migrated tag value combines a lowercase prefix such as mig, sap or oracle with the 12-digit AWS account ID of the migrated workload.
explanation: The value ties spend to a specific MAP agreement through its MPE ID, which is 5 digits or 10 uppercase alphanumeric characters. The account ID plays no part in the tag value.
