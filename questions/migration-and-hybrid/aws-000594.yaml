id: aws-000594
product_area: migration-and-hybrid
true_statement: AWS Elastic Disaster Recovery keeps point-in-time snapshots every 10 minutes for the last hour and hourly for the last 24 hours, plus daily snapshots kept 1 to 365 days.
false_statement: AWS Elastic Disaster Recovery keeps point-in-time snapshots every minute for the last hour and hourly for the last 24 hours, plus daily snapshots kept 1 to 365 days.
explanation: The 10-minute and hourly tiers are fixed, and only the daily retention is configurable. Separately, continuous block replication gives RPOs typically in the sub-second range.
