id: aws-000083
product_area: migration-and-hybrid
true_statement: AWS DMS creates only tables, primary keys and sometimes unique indexes, while views, stored procedures and functions are converted by DMS Schema Conversion.
false_statement: AWS DMS replication tasks convert views, stored procedures and functions during full load, while DMS Schema Conversion creates only tables and primary keys.
explanation: Data movement tasks create just enough schema to load data. Code objects are the job of DMS Schema Conversion, which flags what it cannot convert for manual work.
