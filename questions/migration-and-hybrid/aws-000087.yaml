id: aws-000087
product_area: migration-and-hybrid
true_statement: AWS Transform MGN is the name, since June 2026, of the service previously called AWS Application Migration Service.
false_statement: AWS Transform MGN is the name, since June 2026, of the service previously called AWS Database Migration Service.
explanation: AWS renamed Application Migration Service (MGN) to reflect its role as the replication engine behind AWS Transform. AWS Database Migration Service is a separate, database-level tool that kept its name.
