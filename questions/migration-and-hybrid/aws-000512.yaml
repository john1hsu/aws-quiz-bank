product_area: migration-and-hybrid
true_statement: DMS Schema Conversion is a managed, web-based feature built on the AWS SCT engine, while AWS SCT itself is a desktop application you install.
false_statement: AWS SCT is a managed, web-based feature built on the DMS Schema Conversion engine, while DMS Schema Conversion is a desktop application you install.
explanation: SCT runs on your own workstation and needs network reach to both databases. DMS Schema Conversion reuses SCT's conversion engine but is driven from the DMS console, CLI or API with nothing to install.
