true_statement: Moving SQL Server to Amazon RDS for SQL Server is AWS's example of the replatform strategy, while moving to a SaaS product is repurchase.
false_statement: Moving SQL Server to Amazon RDS for SQL Server is AWS's example of the repurchase strategy, while moving to a SaaS product is replatform.
explanation: Replatform keeps the application but swaps in targeted optimizations such as a managed database. Repurchase replaces the application with a different product, typically SaaS.
