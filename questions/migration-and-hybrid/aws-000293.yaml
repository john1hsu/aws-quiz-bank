id: aws-000293
product_area: migration-and-hybrid
true_statement: AWS Transfer Family charges an hourly fee for each protocol enabled on an endpoint for as long as the server exists, even when no files are moving.
false_statement: AWS Transfer Family charges an hourly fee only while files are moving through an endpoint, so an idle server with protocols enabled costs nothing.
explanation: The per-protocol hourly charge accrues around the clock, so an idle test server with SFTP and FTPS enabled still costs about $0.60 an hour in US East (as of 2026-11). Data transferred is billed separately per GB.
