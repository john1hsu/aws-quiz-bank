id: aws-000438
product_area: migration-and-hybrid
true_statement: AWS Transform's Windows modernization ports .NET Framework apps to cross-platform .NET and converts SQL Server databases to Aurora PostgreSQL.
false_statement: AWS Transform's Windows modernization ports .NET Framework apps to cross-platform .NET and converts SQL Server databases to Amazon DynamoDB.
explanation: The Windows agent targets .NET 8 or .NET 10 for code and Aurora PostgreSQL for SQL Server data, using DMS Schema Conversion for storage objects. It does not move relational schemas into a NoSQL store.
