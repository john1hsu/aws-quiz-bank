id: aws-000086
product_area: migration-and-hybrid
true_statement: AWS Transform MGN source servers send replicated data to replication servers over TCP 1500 and reach the MGN API over TCP 443.
false_statement: AWS Transform MGN source servers send replicated data to replication servers over TCP 443 and reach the MGN API over TCP 1500.
explanation: Data replication uses TCP 1500 into the staging area, while API communication uses HTTPS on 443. Both are encrypted with TLS 1.2, and SSL interception between them is not supported.
