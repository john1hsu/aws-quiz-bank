id: aws-000082
product_area: migration-and-hybrid
true_statement: AWS DMS requires the source or the target to be in Amazon RDS or on Amazon EC2; on-premises-to-on-premises replication is not supported.
false_statement: AWS DMS supports on-premises-to-on-premises replication, provided the replication instance itself runs in AWS.
explanation: DMS needs at least one endpoint inside AWS on RDS or EC2. Replicating between two on-premises databases is outside what the service supports.
