id: aws-000159
product_area: migration-and-hybrid
true_statement: AWS DataSync needs no agent to copy between AWS storage services in the same account, but needs one to reach NFS or SMB shares outside AWS.
false_statement: AWS DataSync needs an agent to copy between AWS storage services in the same account, but reaches NFS or SMB shares outside AWS without one.
explanation: An agent is the VM appliance that reads or writes storage DataSync cannot reach directly, such as on-premises file shares. Same-account transfers between services like S3, EFS and FSx run agentless.
