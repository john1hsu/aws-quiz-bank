id: aws-000085
product_area: migration-and-hybrid
true_statement: Each AWS Transform MGN source server gets a free period of 2,160 hours, or 90 days of replication, starting when the agent is installed (as of 2026-11).
false_statement: Each AWS Transform MGN source server gets a free period of 720 hours, or 30 days of replication, starting when the agent is installed (as of 2026-11).
explanation: MGN's free period is 90 days per source server, after which replication is billed per server-hour. Even during that period, the EC2 and EBS resources it provisions are charged normally.
