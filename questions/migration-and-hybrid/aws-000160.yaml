id: aws-000160
product_area: migration-and-hybrid
true_statement: AWS positions Transfer Family for SFTP or FTPS exchanges with partners, and DataSync for bulk migration and recurring sync of file data into AWS.
false_statement: AWS positions DataSync for SFTP or FTPS exchanges with partners, and Transfer Family for bulk migration and recurring sync of file data into AWS.
explanation: Transfer Family provides protocol endpoints such as SFTP, FTPS, FTP and AS2 for outside parties. DataSync is the managed copy engine for moving NAS, HDFS or object data into AWS storage.
