id: aws-000296
product_area: migration-and-hybrid
true_statement: Relocate, the strategy added to AWS's original six Rs, moves workloads to a cloud version of the same platform or to another VPC, Region or account without changing their architecture.
false_statement: Repurchase, the strategy added to AWS's original six Rs, moves workloads to a cloud version of the same platform or to another VPC, Region or account without changing their architecture.
explanation: Repurchase was already among the six strategies in the 2016 blog post. Relocate is the seventh, and AWS calls it the quickest route because the architecture stays the same.
