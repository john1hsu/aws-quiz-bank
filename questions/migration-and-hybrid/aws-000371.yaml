id: aws-000371
product_area: migration-and-hybrid
true_statement: The MAP 2.0 tag key map-migrated is activated automatically as a cost allocation tag and does not count against the account's cost allocation tag quota.
false_statement: The MAP 2.0 tag key map-migrated must be activated manually as a cost allocation tag and counts against the account's cost allocation tag quota.
explanation: AWS turns on map-migrated as a cost allocation tag itself and exempts it from the tag quota. Cost Explorer still needs to be enabled for MAP spend reporting.
