id: aws-000292
product_area: migration-and-hybrid
true_statement: Plain FTP in AWS Transfer Family is allowed only on a VPC – Internal endpoint, reachable from the VPC and networks connected over VPN or Direct Connect.
false_statement: Plain FTP in AWS Transfer Family is allowed only on a Public endpoint, reachable from anywhere on the internet without a VPC.
explanation: Because FTP is unencrypted, Transfer Family limits it to internal VPC endpoints. Public endpoints support SFTP only.
