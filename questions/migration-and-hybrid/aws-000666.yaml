id: aws-000666
product_area: migration-and-hybrid
true_statement: AWS advises filtering shared services such as Active Directory, backup and monitoring out of dependency maps and building them in AWS before the first wave.
false_statement: AWS advises keeping shared services such as Active Directory, backup and monitoring in dependency maps and migrating them in the final wave.
explanation: Shared services connect to nearly everything, so leaving them in the map would merge the whole estate into one group. Standing them up in AWS first lets every wave rely on them.
