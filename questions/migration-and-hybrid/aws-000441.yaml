id: aws-000441
product_area: migration-and-hybrid
true_statement: EC2 security group rules are not enforced on Amazon EVS network interfaces in VLAN subnets, so traffic there is filtered with network ACLs.
false_statement: Network ACL rules are not enforced on Amazon EVS network interfaces in VLAN subnets, so traffic there is filtered with EC2 security groups.
explanation: EVS VLAN subnets are a case where security groups don't apply to the interfaces. AWS's guidance is to rely on network ACLs to control that traffic.
