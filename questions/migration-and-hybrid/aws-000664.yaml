id: aws-000664
product_area: migration-and-hybrid
true_statement: In AWS migration planning, a hard dependency depends on location, so the pair must move together, while a soft dependency lets the two sides migrate separately.
false_statement: In AWS migration planning, a soft dependency depends on location, so the pair must move together, while a hard dependency lets the two sides migrate separately.
explanation: Hard dependencies would break if one side ran on premises and the other in AWS, so they belong in the same move group. Soft ones tolerate the split, and hard ones can also be nontechnical, such as a shared maintenance window.
