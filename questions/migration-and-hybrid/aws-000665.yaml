id: aws-000665
product_area: migration-and-hybrid
true_statement: AWS's migration assessment guide recommends 6–10 weeks per migration wave, and work that needs longer, such as a full rewrite, runs outside the wave cadence.
false_statement: AWS's migration assessment guide recommends 6–10 months per migration wave, and work that needs longer, such as a full rewrite, runs outside the wave cadence.
explanation: Waves are meant to be short, repeatable increments of a few weeks each. Long refactoring efforts are kept separate so they don't stall the rhythm.
