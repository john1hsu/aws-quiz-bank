id: aws-000229
product_area: migration-and-hybrid
true_statement: With no Snow Family device available to new customers, AWS recommends AWS Data Transfer Terminals for new offline data transfers.
false_statement: With Snowball Edge closed to new customers, AWS recommends ordering Snowcone devices for new offline data transfers.
explanation: AWS no longer offers any Snow Family device to new customers, Snowcone included. Its offline recommendation is Data Transfer Terminals, physical sites where you bring your own storage, with DataSync for online transfers.
