id: aws-000084
product_area: migration-and-hybrid
true_statement: AWS DMS homogeneous data migrations use native database tooling, need no replication instance and bill only for the hours a migration runs.
false_statement: AWS DMS homogeneous data migrations run on a provisioned replication instance that bills for every hour it exists, whether or not a migration is running.
explanation: For supported same-engine moves such as PostgreSQL or MySQL, homogeneous migrations rely on native tools and charge only while running. Provisioned replication instances are the classic option for steady transfers.
