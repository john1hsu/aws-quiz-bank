id: aws-000158
product_area: migration-and-hybrid
true_statement: AWS DataSync Enhanced mode runs the prepare, transfer and verify phases in parallel, while Basic mode runs them one after another.
false_statement: AWS DataSync Basic mode runs the prepare, transfer and verify phases in parallel, while Enhanced mode runs them one after another.
explanation: Basic mode scans both locations fully before moving any bytes. Enhanced mode streams objects through as they are listed, which is faster for most workloads and removes the per-execution file-count limit.
