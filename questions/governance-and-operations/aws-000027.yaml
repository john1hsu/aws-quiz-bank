id: aws-000027
product_area: governance-and-operations
true_statement: CloudWatch custom metrics can be published at 1-second high resolution, while standard metrics have 1-minute resolution.
false_statement: CloudWatch custom metrics can be published at most at 1-minute resolution, while standard metrics have 1-second resolution.
explanation: High-resolution publishing down to one second is an option for custom metrics, and high-resolution alarms can evaluate every 10 seconds. Standard metrics are at 1-minute resolution.
