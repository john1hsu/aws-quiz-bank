true_statement: AWS Service Catalog curates the IT products teams are allowed to launch, while AWS License Manager tracks vendor software licences across AWS and on-premises servers.
false_statement: AWS License Manager curates the IT products teams are allowed to launch, while AWS Service Catalog tracks vendor software licences across AWS and on-premises servers.
explanation: Service Catalog is the governed catalog of approved products, and License Manager is the licence-tracking service. The false statement swaps their jobs.
