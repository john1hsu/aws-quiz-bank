id: aws-000074
product_area: governance-and-operations
true_statement: In AWS Organizations, service control policies cap what IAM principals can do, while resource control policies cap what can be done to resources.
false_statement: In AWS Organizations, resource control policies cap what IAM principals can do, while service control policies cap what can be done to resources.
explanation: SCPs bound the permissions of principals and RCPs bound access to resources in member accounts. Neither type grants permissions; they only limit what other policies allow.
