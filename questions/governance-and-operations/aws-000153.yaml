id: aws-000153
product_area: governance-and-operations
true_statement: Since Control Tower landing zone 4.0, drift notifications are sent to Amazon EventBridge in the management account instead of to Amazon SNS.
false_statement: Since Control Tower landing zone 4.0, drift notifications are sent to Amazon SNS in the Audit account instead of to Amazon EventBridge.
explanation: Landing zone 4.0 moved drift notifications from SNS to EventBridge in the management account. The same release made every integration optional and stopped Control Tower from creating the Security OU.
