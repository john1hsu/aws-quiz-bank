id: aws-000364
product_area: governance-and-operations
true_statement: Systems Manager Session Manager lets you close inbound SSH ports and retire bastion hosts, because IAM decides who may start a session on which node.
false_statement: Systems Manager Session Manager requires inbound SSH ports to stay open on each node, because SSH key pairs decide who may start a session on which node.
explanation: Session Manager connects through the SSM Agent, so nodes need no open inbound ports, bastions or SSH keys. Access is granted and audited through IAM and CloudTrail.
