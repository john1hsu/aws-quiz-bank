true_statement: In the commercial partition, increases to global service quotas must be requested from the US East (N. Virginia) Region.
false_statement: In the commercial partition, increases to global service quotas must be requested from the US West (Oregon) Region.
explanation: Global quota requests are made in us-east-1 for commercial accounts. GovCloud uses GovCloud (US-West) and the China partition uses China (Beijing).
