id: aws-000433
product_area: governance-and-operations
true_statement: A Service Quotas request template holds up to 10 quota increases and applies them to accounts created in the organization afterwards, not to existing accounts.
false_statement: A Service Quotas request template holds up to 10 quota increases and applies them to every existing account in the organization as well as new ones.
explanation: Templates automate increase requests only for new accounts. They require Organizations with all features and work only in commercial, non-opt-in Regions.
