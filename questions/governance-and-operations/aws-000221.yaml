id: aws-000221
product_area: governance-and-operations
true_statement: In AWS's US East (N. Virginia) pricing, AWS Config charges $0.003 per continuously recorded configuration item and $0.012 per daily periodic item (as of 2026-11).
false_statement: In AWS's US East (N. Virginia) pricing, AWS Config charges $0.012 per continuously recorded configuration item and $0.003 per daily periodic item (as of 2026-11).
explanation: Continuous items are cheaper each but are created on every change, while periodic recording costs more per item but produces at most one per resource per day. That is why daily recording helps high-churn workloads.
