id: aws-000284
product_area: governance-and-operations
true_statement: AWS Organizations allows OUs to be nested up to five levels deep, though AWS recommends keeping the hierarchy shallow.
false_statement: AWS Organizations allows OUs to be nested up to ten levels deep, though AWS recommends keeping the hierarchy shallow.
explanation: Five levels of OU nesting is the documented maximum. AWS still suggests a flat structure because deep trees make policy inheritance harder to reason about.
