id: aws-000583
product_area: governance-and-operations
true_statement: AWS Health events remain viewable in the dashboard and API for up to 90 days, so a longer record has to be exported through EventBridge (as of 2026-11).
false_statement: AWS Health events remain viewable in the dashboard and API for up to 2 years, so a longer record has to be exported through EventBridge (as of 2026-11).
explanation: Health keeps events for 90 days, including in organizational view. Teams that need a longer audit trail route events through EventBridge to their own storage.
