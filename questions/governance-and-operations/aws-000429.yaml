id: aws-000429
product_area: governance-and-operations
true_statement: Each root, OU or account can have at most 5 resource control policies attached directly, and the undetachable RCPFullAWSAccess policy uses one of them.
false_statement: Each root, OU or account can have at most 10 resource control policies attached directly, and the undetachable RCPFullAWSAccess policy uses one of them.
explanation: RCPs have a fixed limit of five direct attachments per target, half the SCP limit. Because AWS attaches RCPFullAWSAccess everywhere RCPs are on, only four slots remain for your own RCPs.
