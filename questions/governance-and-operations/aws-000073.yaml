id: aws-000073
product_area: governance-and-operations
true_statement: Service control policies apply to users and roles in member accounts but not to users and roles in the AWS Organizations management account.
false_statement: Service control policies apply to users and roles in the AWS Organizations management account but not to users and roles in member accounts.
explanation: SCPs are guardrails for member accounts; the management account sits outside them. That is why AWS advises keeping workloads out of the management account.
