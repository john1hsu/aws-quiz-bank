id: aws-000491
product_area: governance-and-operations
true_statement: On Basic Support, Trusted Advisor gives every service-limits check plus a few core security checks, while the full check set and its API need a plan such as Business Support+.
false_statement: On Basic Support, Trusted Advisor gives every cost-optimization check plus a few core security checks, while the full check set and its API need a plan such as Business Support+.
explanation: Basic and Developer customers see all service-limits checks and a short security list, such as root MFA and public snapshots. Cost-optimization checks are part of the full set that higher support plans unlock.
