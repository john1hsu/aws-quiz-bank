id: aws-000366
product_area: governance-and-operations
true_statement: A Parameter Store standard parameter can be upgraded to advanced, but an advanced parameter can never be downgraded; it must be deleted and recreated.
false_statement: A Parameter Store advanced parameter can be downgraded to standard, but a standard parameter can never be upgraded; it must be deleted and recreated.
explanation: Moving up a tier is allowed in place, but the change is one-way. Getting back to the standard tier means deleting the advanced parameter and creating a new standard one.
