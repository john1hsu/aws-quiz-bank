id: aws-000428
product_area: governance-and-operations
true_statement: A closed AWS Organizations member account keeps counting against the organization's account quota throughout its 90-day post-closure period.
false_statement: A closed AWS Organizations member account keeps counting against the organization's account quota throughout a 7-day post-closure period.
explanation: Closed accounts occupy a slot until AWS permanently closes them after 90 days. Removing an account from the organization before closing it frees the slot straight away.
