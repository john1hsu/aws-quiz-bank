id: aws-000025
product_area: governance-and-operations
true_statement: Amazon CloudWatch keeps 1-minute metric data points for 15 days before they are available only at coarser 5-minute or 1-hour resolution.
false_statement: Amazon CloudWatch keeps 1-minute metric data points for 455 days before they are available only at coarser 5-minute or 1-hour resolution.
explanation: 'CloudWatch rolls data up as it ages: 1-minute detail lasts 15 days, 5-minute points 63 days and 1-hour points 455 days. Fine-grained data needed longer must be exported.'
