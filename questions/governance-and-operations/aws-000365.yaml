product_area: governance-and-operations
true_statement: Systems Manager Parameter Store standard parameters hold values up to 4 KB, while advanced parameters hold values up to 8 KB.
false_statement: Systems Manager Parameter Store standard parameters hold values up to 8 KB, while advanced parameters hold values up to 64 KB.
explanation: The free standard tier caps values at 4 KB; the paid advanced tier doubles that to 8 KB and adds parameter policies and sharing. Neither tier reaches 64 KB.
