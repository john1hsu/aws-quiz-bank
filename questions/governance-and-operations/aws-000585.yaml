id: aws-000585
product_area: governance-and-operations
true_statement: AWS Health sends each EventBridge event to its own Region and a backup Region, with US West (Oregon) as the backup for every other commercial Region.
false_statement: AWS Health sends each EventBridge event to its own Region and a backup Region, with US East (N. Virginia) as the backup for every other commercial Region.
explanation: Oregon backs up all other commercial Regions, and N. Virginia backs up Oregon. AWS suggests rules in both Regions, de-duplicated on communicationId, for high availability.
