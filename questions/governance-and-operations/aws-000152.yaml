id: aws-000152
product_area: governance-and-operations
true_statement: AWS Control Tower enforces preventive controls through Organizations policies such as SCPs, while its detective controls run as AWS Config rules.
false_statement: AWS Control Tower enforces preventive controls as AWS Config rules, while its detective controls run through Organizations policies such as SCPs.
explanation: Preventive controls block actions before they happen, which is what SCPs and RCPs do. Detective controls find non-compliant resources after the fact, which is the job of AWS Config rules.
