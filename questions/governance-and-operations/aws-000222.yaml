id: aws-000222
product_area: governance-and-operations
true_statement: AWS Proton reached end of support on 2026-10-07; its console is no longer reachable, but infrastructure it deployed stays in place.
false_statement: AWS Proton reached end of support on 2026-10-07; its console is no longer reachable, and infrastructure it deployed was deleted with it.
explanation: End of support removed access to Proton itself, not to the stacks it had provisioned. Those resources keep running and need a new deployment tool such as CloudFormation Git sync or CodePipeline.
