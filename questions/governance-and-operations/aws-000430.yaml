id: aws-000430
product_area: governance-and-operations
true_statement: In a rolling 30-day window an organization can close 250 member accounts or 20% of them, whichever is higher, up to 1,000, and this limit is fixed.
false_statement: In a rolling 30-day window an organization can close 250 member accounts or 20% of them, whichever is lower, up to 1,000, and this limit is fixed.
explanation: The closure allowance takes the larger of the two figures, capped at 1,000, and can't be raised. The window starts at the first closure rather than at the start of a calendar month.
