id: aws-000431
product_area: governance-and-operations
true_statement: AWS service quotas are Regional unless a quota says otherwise, so an increase approved in one Region does not carry over to other Regions.
false_statement: AWS service quotas are global unless a quota says otherwise, so an increase approved in one Region carries over to every other Region.
explanation: Most quotas, such as VPCs per Region, are tracked separately in each Region, and defaults can differ between Regions. Only quotas marked global, such as IAM roles per account, apply account-wide.
