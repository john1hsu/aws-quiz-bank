id: aws-000075
product_area: governance-and-operations
true_statement: Detaching the default FullAWSAccess SCP without attaching a replacement allow policy makes every action in the affected member accounts fail.
false_statement: Detaching the default FullAWSAccess SCP has no effect on member accounts, because IAM policies alone decide what their principals can do.
explanation: With SCPs enabled, an action must be allowed by the SCPs in effect as well as by IAM. Removing FullAWSAccess without another allow leaves nothing permitted, so every action fails.
