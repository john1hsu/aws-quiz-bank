id: aws-000224
product_area: governance-and-operations
true_statement: AWS Security Hub CSPM gathers findings from services such as GuardDuty, Inspector and Macie into one prioritized view, while AWS Audit Manager continuously collects audit evidence.
false_statement: AWS Audit Manager gathers findings from services such as GuardDuty, Inspector and Macie into one prioritized view, while AWS Security Hub CSPM continuously collects audit evidence.
explanation: Security Hub CSPM is the findings aggregator across security services, and Audit Manager is the evidence collector for audits. The false statement reverses them.
