id: aws-000219
product_area: governance-and-operations
true_statement: AWS Config rules in proactive mode evaluate resource properties before deployment but only report results; they neither block the deployment nor remediate.
false_statement: AWS Config rules in proactive mode evaluate resource properties before deployment and block the deployment of any resource they find noncompliant.
explanation: Proactive evaluation is advisory. Stopping a deployment needs a preventive control such as an SCP, which is why AWS suggests pairing the two.
