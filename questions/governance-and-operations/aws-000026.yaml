id: aws-000026
product_area: governance-and-operations
true_statement: Amazon CloudWatch monitors how resources and applications perform, while an audit trail of API calls is the job of AWS CloudTrail.
false_statement: Amazon CloudWatch records an audit trail of API calls, while monitoring how resources and applications perform is the job of AWS CloudTrail.
explanation: CloudWatch handles metrics, logs, alarms and dashboards for operational health. CloudTrail records who called which API, so the two roles are swapped in the false statement.
