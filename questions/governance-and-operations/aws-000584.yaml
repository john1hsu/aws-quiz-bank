id: aws-000584
product_area: governance-and-operations
true_statement: The AWS Health Dashboard and its EventBridge delivery are free for every customer, while the AWS Health API needs a plan such as Business Support+ or Enterprise Support.
false_statement: The AWS Health API is free for every customer, while the AWS Health Dashboard and its EventBridge delivery need a plan such as Business Support+ or Enterprise Support.
explanation: Anyone can use the dashboard and receive events in EventBridge at no extra cost. Programmatic API access is gated by a qualifying support plan, and other accounts get SubscriptionRequiredException.
