id: aws-000282
product_area: governance-and-operations
true_statement: AWS advises structuring OUs around shared security and operational needs rather than mirroring the company's reporting chart.
false_statement: AWS advises structuring OUs to mirror the company's reporting chart rather than grouping accounts by shared security and operational needs.
explanation: OUs exist to apply common controls, so accounts that need the same policies belong together. Org-chart structures change often and rarely match control requirements.
