id: aws-000154
product_area: governance-and-operations
true_statement: AWS Control Tower has no charge of its own; you pay for the services it drives, mainly AWS Config, AWS CloudTrail and Amazon S3.
false_statement: AWS Control Tower charges a monthly fee per governed account on top of the AWS Config, AWS CloudTrail and Amazon S3 usage it drives.
explanation: Control Tower orchestrates other services and bills nothing itself. The costs come from those services, with AWS Config recording in high-churn accounts being the main one to watch.
