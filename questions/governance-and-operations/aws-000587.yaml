true_statement: For the most severe cases, AWS targets a first response under 30 minutes on Business Support+, 15 minutes on Enterprise Support and 5 minutes on Unified Operations.
false_statement: For the most severe cases, AWS targets a first response under 15 minutes on Business Support+, 30 minutes on Enterprise Support and 5 minutes on Unified Operations.
explanation: 'Response targets tighten as the plan rises: 30 minutes, then 15, then 5 from an Incident Management Engineer. Lower-severity targets are the same across paid plans, and all are targets rather than guarantees.'
