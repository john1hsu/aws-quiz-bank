id: aws-000493
product_area: governance-and-operations
true_statement: Trusted Advisor organizational view needs AWS Organizations with all features enabled and a qualifying support plan on the management account.
false_statement: Trusted Advisor organizational view needs AWS Organizations with only consolidated billing enabled and a qualifying support plan on each member account.
explanation: The organization-wide report is built from the management account, which must have all features turned on and an eligible plan. It keeps up to 50 downloadable JSON or CSV reports.
