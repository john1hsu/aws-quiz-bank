true_statement: The legacy Developer, Business and Enterprise On-Ramp support plans end on January 1, 2027, but stay available in the AWS GovCloud (US) Region.
false_statement: The legacy Developer, Business and Enterprise On-Ramp support plans end on January 1, 2027, in AWS GovCloud (US) as well as in commercial Regions.
explanation: The retirement applies outside GovCloud; all three legacy plans remain offered in the GovCloud (US) Region. Enterprise On-Ramp customers elsewhere are moved to Enterprise Support during 2026.
