id: aws-000220
product_area: governance-and-operations
true_statement: AWS Config allows 1,000 rules per Region per account, a fixed limit that also counts the rules deployed inside conformance packs (as of 2026-11).
false_statement: AWS Config allows 1,000 rules per Region per account, a fixed limit that excludes the rules deployed inside conformance packs (as of 2026-11).
explanation: Rules added through conformance packs are not exempt; they consume the same per-Region, non-adjustable allowance as rules created one by one.
