id: aws-000528
product_area: security
true_statement: AWS Shield Advanced costs $3,000 per month per payer account, and one fee covers all linked accounts in an AWS Organization (as of 2026-11).
false_statement: AWS Shield Advanced costs $3,000 per month per member account, and each linked account in an AWS Organization pays its own fee (as of 2026-11).
explanation: The monthly subscription is charged once at the payer account and extends to every linked account in the organization. It also carries a one-year term that renews automatically.
