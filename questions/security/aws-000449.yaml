product_area: security
true_statement: AWS Secrets Manager costs $0.40 per secret per month plus $0.05 per 10,000 API calls, and versions created by rotation are not charged (as of 2026-11).
false_statement: AWS Secrets Manager costs $0.05 per secret per month plus $0.40 per 10,000 API calls, and versions created by rotation are not charged (as of 2026-11).
explanation: The per-secret fee is the larger part, at 40 cents a month, with API calls billed at five cents per 10,000. Secrets scheduled for deletion are also free, but replicas are billed.
