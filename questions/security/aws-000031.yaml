id: aws-000031
product_area: security
true_statement: CloudTrail event history is on by default and shows the past 90 days of management events in a Region at no CloudTrail charge.
false_statement: CloudTrail event history is on by default and shows the past 365 days of management events in a Region at no CloudTrail charge.
explanation: Event history is a free, immutable 90-day view of management events. Keeping activity longer, or capturing data events, requires a trail delivering to S3.
