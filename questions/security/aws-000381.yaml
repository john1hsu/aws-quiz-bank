id: aws-000381
product_area: security
true_statement: In Amazon Inspector's default hybrid mode, EC2 instances with a configured SSM Agent are scanned through the agent, and the rest fall back to agentless EBS snapshot scans.
false_statement: In Amazon Inspector's default hybrid mode, every EC2 instance is scanned through agentless EBS snapshots, and the SSM Agent is used only where snapshots cannot be taken.
explanation: Hybrid mode prefers agent-based scanning, which reruns as soon as packages or CVEs change. Snapshot-based agentless scanning, which runs every 24 hours, covers instances without a working agent.
