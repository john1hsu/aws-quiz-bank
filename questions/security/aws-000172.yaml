id: aws-000172
product_area: security
true_statement: Amazon Macie uses machine learning to discover sensitive data, while Amazon GuardDuty is the AWS service for threat detection.
false_statement: Amazon GuardDuty uses machine learning to discover sensitive data, while Amazon Macie is the AWS service for threat detection.
explanation: The AWS SRA lists Macie under data protection for finding sensitive data, and GuardDuty under threat detection and continuous monitoring. The false statement swaps the two services.
