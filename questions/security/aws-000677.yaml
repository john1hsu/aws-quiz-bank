id: aws-000677
product_area: security
true_statement: An AWS KMS key allows 25 on-demand rotations, a quota that neither Service Quotas nor AWS Support can raise (as of 2026-11).
false_statement: An AWS KMS key allows 25 on-demand rotations, a quota that can be raised through Service Quotas or AWS Support (as of 2026-11).
explanation: The on-demand rotation limit is one of the few fixed KMS quotas. AWS recommends automatic rotation for keys that need regular rotation.
