id: aws-000097
product_area: security
true_statement: AWS KMS encrypts at most 4 KB of data directly, so larger data is encrypted locally with a data key using envelope encryption.
false_statement: AWS KMS encrypts up to 1 MB of data directly, so only larger data needs to be encrypted locally with a data key using envelope encryption.
explanation: Direct KMS encryption is limited to 4 KB, which suits small secrets and data keys. Services such as S3 with SSE-KMS rely on data keys for anything larger.
