id: aws-000526
product_area: security
true_statement: An AWS KMS CloudHSM key store supports only symmetric AES-256 encryption keys, with no asymmetric, HMAC, imported or multi-Region keys.
false_statement: An AWS KMS CloudHSM key store supports symmetric, asymmetric and HMAC keys, but no imported or multi-Region keys.
explanation: Keys in a CloudHSM-backed custom key store are limited to symmetric AES-256 encryption keys whose material stays in your HSMs. Asymmetric and HMAC keys are among the types it cannot hold.
