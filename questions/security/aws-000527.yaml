id: aws-000527
product_area: security
true_statement: AWS CloudHSM charges an hourly fee for each provisioned HSM, while a cluster with zero HSMs and its automatic backups are not billed.
false_statement: AWS CloudHSM charges an hourly fee for each cluster, even one with zero HSMs, while its automatic backups are not billed.
explanation: Billing follows provisioned HSM hours, regardless of how much they are used. An empty cluster costs nothing, though data transfer is billed separately and there is no free tier.
