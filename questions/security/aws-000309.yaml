id: aws-000309
product_area: security
true_statement: Enabling Amazon GuardDuty creates a separate detector in each Region where it is turned on, so threat detection coverage is decided Region by Region.
false_statement: Enabling Amazon GuardDuty creates a single global detector for the account, so threat detection coverage applies to every Region at once.
explanation: Each Region gets its own detector with its own ID, settings and findings. Turning GuardDuty on in one Region does nothing for the others.
