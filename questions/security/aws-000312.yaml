id: aws-000312
product_area: security
true_statement: Since 2025, the original standards-checking Security Hub service is called Security Hub CSPM, and the name Security Hub refers to the newer unified service built on top of it.
false_statement: Since 2025, the original standards-checking Security Hub service is called Security Hub Essentials, and the name Security Hub refers to the newer unified service built on top of it.
explanation: AWS renamed the posture-checking service Security Hub CSPM when the unified service took the Security Hub name. Essentials is the unified service's default pricing plan, not the old service's new name.
