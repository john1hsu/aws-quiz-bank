id: aws-000601
product_area: security
true_statement: 'AWS Firewall Manager policies are Regional: a policy covers resources only in its own Region, so a multi-Region estate needs a policy per Region.'
false_statement: 'AWS Firewall Manager policies are global: one policy covers resources in every Region of the organization, so a multi-Region estate needs a single policy.'
explanation: Each Firewall Manager policy is tied to one Region and can only include resources there. Covering several Regions means creating a policy in each of them.
