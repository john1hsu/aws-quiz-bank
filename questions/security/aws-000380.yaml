id: aws-000380
product_area: security
true_statement: Activating Amazon Inspector automatically turns on EC2, ECR and Lambda standard scanning, while Lambda code scanning has to be switched on separately.
false_statement: Activating Amazon Inspector automatically turns on EC2, ECR and Lambda code scanning, while Lambda standard scanning has to be switched on separately.
explanation: Standard Lambda scanning of dependencies is part of the default enrollment. Lambda code scanning, AMI scanning and Code Security are opt-in, and enabling code scanning also enables standard scanning.
