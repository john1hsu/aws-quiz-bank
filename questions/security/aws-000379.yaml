id: aws-000379
product_area: security
true_statement: Amazon Inspector looks for software vulnerabilities before they are exploited, while Amazon GuardDuty detects threats while they are happening.
false_statement: Amazon GuardDuty looks for software vulnerabilities before they are exploited, while Amazon Inspector detects threats while they are happening.
explanation: Inspector is the vulnerability management service that scans EC2, ECR images, Lambda and code for CVEs and exposure. GuardDuty analyzes logs and events to flag active malicious behavior.
