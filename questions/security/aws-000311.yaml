id: aws-000311
product_area: security
true_statement: In AWS Security Hub Essentials pricing, 12 Lambda functions count as one resource unit, the same as a single EC2 instance (as of 2026-11).
false_statement: In AWS Security Hub Essentials pricing, 125 Lambda functions count as one resource unit, the same as a single EC2 instance (as of 2026-11).
explanation: 'Essentials meters four resource types: one EC2 instance, 18 ECR images, 12 Lambda functions or 125 IAM users and roles per unit. The 125 figure belongs to IAM principals, not Lambda functions.'
