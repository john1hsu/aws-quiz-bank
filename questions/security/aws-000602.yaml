id: aws-000602
product_area: security
true_statement: As of 2026-11, an organization can have at most 10 Firewall Manager administrators, one default plus up to nine more, and that limit is fixed.
false_statement: As of 2026-11, an organization can have at most 10 Firewall Manager administrators, one default plus up to nine more, and that limit is adjustable.
explanation: The ten-administrator ceiling (a default administrator and nine others) cannot be raised. Other Firewall Manager quotas, such as policies per organization, are the adjustable ones.
