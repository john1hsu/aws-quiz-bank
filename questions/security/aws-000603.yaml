id: aws-000603
product_area: security
true_statement: AWS Firewall Manager bills a monthly fee for each protection policy in each Region, and Shield Advanced subscribers pay no policy fee.
false_statement: AWS Firewall Manager bills a monthly fee for each member account it protects in each Region, and Shield Advanced subscribers pay no account fee.
explanation: The Firewall Manager charge is counted per policy per Region, not per account, and Shield Advanced customers are exempt from it. Account count still matters indirectly through the AWS Config rules it creates.
