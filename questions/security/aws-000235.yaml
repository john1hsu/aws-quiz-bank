id: aws-000235
product_area: security
true_statement: AWS WAF inspects at most 8 KB of a request body for an Application Load Balancer, a fixed limit, while CloudFront defaults to 16 KB and can be raised to 64 KB.
false_statement: AWS WAF inspects at most 64 KB of a request body for an Application Load Balancer, a fixed limit, while CloudFront defaults to 8 KB and cannot be raised.
explanation: Body inspection limits depend on the protected resource. ALB is capped at 8 KB, while CloudFront and several other front doors start at 16 KB and can go to 64 KB, so content past the limit needs explicit oversize handling.
