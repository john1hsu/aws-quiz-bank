id: aws-000307
product_area: security
true_statement: Amazon GuardDuty keeps findings for 90 days, a fixed per-Region quota, so a longer record means exporting them elsewhere (as of 2026-11).
false_statement: Amazon GuardDuty keeps findings for 365 days, a fixed per-Region quota, so a longer record means exporting them elsewhere (as of 2026-11).
explanation: GuardDuty's finding retention period is 90 days and is not adjustable. Anything you need beyond that must be sent to another store, such as through EventBridge.
