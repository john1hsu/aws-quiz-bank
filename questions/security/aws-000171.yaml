id: aws-000171
product_area: security
true_statement: The AWS SRA makes a Security Tooling account the delegated administrator for services like GuardDuty and Security Hub, and keeps organization CloudTrail logs in a Log Archive account.
false_statement: The AWS SRA makes a Log Archive account the delegated administrator for services like GuardDuty and Security Hub, and keeps organization CloudTrail logs in a Security Tooling account.
explanation: In the reference architecture the Security Tooling account (Control Tower's Audit account) administers the detection services, while Log Archive stores CloudTrail logs and Config snapshots. Neither job is meant for the management account.
