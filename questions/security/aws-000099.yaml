id: aws-000099
product_area: security
true_statement: Use of AWS managed KMS keys is recorded in your CloudTrail, while AWS owned keys give you neither key policy control nor CloudTrail records.
false_statement: Use of AWS owned KMS keys is recorded in your CloudTrail, while AWS managed keys give you neither key policy control nor CloudTrail records.
explanation: AWS managed keys live in your account and their use is logged, even though a service controls them. AWS owned keys belong to AWS, are shared across accounts and are invisible to your logging.
