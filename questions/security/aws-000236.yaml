id: aws-000236
product_area: security
true_statement: The Count action in an AWS WAF rule records that a request matched without allowing or blocking it, which makes it useful for testing new rules.
false_statement: The Count action in an AWS WAF rule blocks a request once a client exceeds a set number of matches, which makes it useful for rate limiting.
explanation: Count only tallies matches and lets the request continue through the web ACL. Per-client rate limiting is done with rate-based rules instead.
