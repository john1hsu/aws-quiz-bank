id: aws-000234
product_area: security
true_statement: A web ACL that protects a CloudFront distribution must be created, with the IP sets and rule groups it references, in US East (N. Virginia).
false_statement: A web ACL that protects a CloudFront distribution must be created, with the IP sets and rule groups it references, in the Region of the distribution's origin.
explanation: CloudFront uses AWS WAF's Global (CloudFront) scope, which is managed from us-east-1. Regional web ACLs, by contrast, must live in the same Region as the resource they protect.
