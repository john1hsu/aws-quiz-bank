id: aws-000308
product_area: security
true_statement: Malware Protection for S3 is the only GuardDuty protection plan that can be used without enabling GuardDuty itself in the account.
false_statement: Runtime Monitoring is the only GuardDuty protection plan that can be used without enabling GuardDuty itself in the account.
explanation: Malware Protection for S3 can scan newly uploaded objects as a standalone feature. Runtime Monitoring and the other plans build on an enabled GuardDuty detector.
