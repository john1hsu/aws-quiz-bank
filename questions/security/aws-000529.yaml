id: aws-000529
product_area: security
true_statement: Shield Advanced covers EC2 instances and Network Load Balancers only through an attached Elastic IP address.
false_statement: Shield Advanced covers EC2 instances and Application Load Balancers only through an attached Elastic IP address.
explanation: Application Load Balancers can be enrolled directly as Shield Advanced resources. EC2 instances and NLBs are protected by enrolling the Elastic IP attached to them.
