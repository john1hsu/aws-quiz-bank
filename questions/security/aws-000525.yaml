id: aws-000525
product_area: security
true_statement: For production, AWS strongly recommends at least two AWS CloudHSM HSMs in different Availability Zones; high availability is the customer's design job.
false_statement: For production, AWS strongly recommends at least four AWS CloudHSM HSMs in different Availability Zones; high availability is the customer's design job.
explanation: The production baseline is two HSMs in separate AZs, rising to at least three across two or more AZs for mission-critical work. Four is not the documented minimum.
