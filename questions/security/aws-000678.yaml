id: aws-000678
product_area: security
true_statement: In cross-account use of an AWS KMS key, the calling account is throttled against its own request quota, not the account that owns the key.
false_statement: In cross-account use of an AWS KMS key, the account that owns the key is throttled against its request quota, not the calling account.
explanation: KMS request quotas follow the caller. A heavy consumer in another account uses up its own pool rather than the key owner's.
