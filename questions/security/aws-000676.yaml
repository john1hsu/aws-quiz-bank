id: aws-000676
product_area: security
true_statement: KMS calls that S3, EBS and other services make on your behalf for server-side encryption count against your account's KMS request quotas.
false_statement: KMS calls that S3, EBS and other services make on your behalf for server-side encryption count against the calling service's own quota, not your account's.
explanation: Integrated services spend your account's KMS request budget, which is why request quotas usually bite in production. Only AWS owned keys never count against it.
