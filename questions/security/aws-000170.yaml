id: aws-000170
product_area: security
true_statement: Under the shared responsibility model, AWS secures the cloud itself, while customers secure what they run in it, such as their content, applications and networks.
false_statement: Under the shared responsibility model, customers secure the cloud itself, while AWS secures what they run in it, such as their content, applications and networks.
explanation: AWS is responsible for security of the cloud, and the customer for security in the cloud. The AWS security services are tools for that customer half, which is why the false statement's split is backwards.
