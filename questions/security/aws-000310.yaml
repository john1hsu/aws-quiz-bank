id: aws-000310
product_area: security
true_statement: In AWS Security Hub, automation rules and third-party ticketing can be configured only in the aggregation Region, which collects findings from linked Regions.
false_statement: In AWS Security Hub, automation rules and third-party ticketing can be configured only in the organization's home Region for AWS Organizations, separate from the aggregation Region.
explanation: The aggregation Region is where cross-Region findings land, so it is the one place automation rules and Jira or ServiceNow ticketing are set up. There is no separate Organizations home Region for these settings.
