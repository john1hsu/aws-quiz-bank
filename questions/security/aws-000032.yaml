id: aws-000032
product_area: security
true_statement: CloudTrail trails created in the console are multi-Region, while single-Region trails can be created only with the CLI or API.
false_statement: CloudTrail trails created in the console are single-Region, while multi-Region trails can be created only with the CLI or API.
explanation: The console always creates multi-Region trails, which is the recommended practice. A single-Region trail is the CLI and API default and cannot be made in the console.
