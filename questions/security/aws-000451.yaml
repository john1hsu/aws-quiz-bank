id: aws-000451
product_area: security
true_statement: The alternating-users rotation strategy in Secrets Manager keeps the previous database credentials valid during the switch, unlike the single-user strategy.
false_statement: The single-user rotation strategy in Secrets Manager keeps the previous database credentials valid during the switch, unlike the alternating-users strategy.
explanation: Alternating users rotates between two database users, so the old login still works while clients pick up the new one. Single-user rotation changes the password of one user in place.
