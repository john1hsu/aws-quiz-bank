id: aws-000450
product_area: security
true_statement: When one account reads another account's secret, the API call counts against the requesting account's Secrets Manager quota rather than the owner's.
false_statement: When one account reads another account's secret, the API call counts against the owning account's Secrets Manager quota rather than the requester's.
explanation: Secrets Manager throttling falls on the caller, so heavy cross-account readers use up their own request rate. AWS recommends exponential backoff with jitter and client-side caching.
