id: aws-000098
product_area: security
true_statement: A deleted AWS KMS key first enters a waiting period of 7 to 30 days, 30 by default, during which the deletion can be cancelled.
false_statement: A deleted AWS KMS key first enters a waiting period of 1 to 7 days, 7 by default, during which the deletion can be cancelled.
explanation: KMS schedules key deletion with a 7 to 30 day waiting window, defaulting to 30. Deleting imported key material, unlike deleting a key, takes effect immediately.
