id: aws-000033
product_area: security
true_statement: The first copy of management events that a CloudTrail trail delivers to S3 has no CloudTrail charge, but additional copies cost $2.00 per 100,000 events (as of 2026-11).
false_statement: Every copy of management events that CloudTrail trails deliver to S3, including the first, costs $2.00 per 100,000 events (as of 2026-11).
explanation: CloudTrail does not charge for one copy of management events; only S3 storage applies. Overlapping trails that capture management events again create paid copies.
