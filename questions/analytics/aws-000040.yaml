id: aws-000040
product_area: analytics
true_statement: AWS Glue runs serverless Spark jobs billed per DPU-hour, whereas Amazon EMR runs managed clusters billed per instance-hour.
false_statement: Amazon EMR runs serverless Spark jobs billed per DPU-hour, whereas AWS Glue runs managed clusters billed per instance-hour.
explanation: Glue has no cluster to size and charges for data processing units consumed. EMR gives framework and cluster control and is charged by the instance-hour, so the roles are reversed in the false statement.
