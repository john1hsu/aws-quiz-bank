id: aws-000041
product_area: analytics
true_statement: AWS Glue crawlers scan data stores, infer schemas and partitions, and write table definitions into the Glue Data Catalog.
false_statement: AWS Glue DataBrew scans data stores, infers schemas and partitions, and writes table definitions into the Glue Data Catalog.
explanation: Crawlers are the Glue component that discovers data and populates the catalog. DataBrew is a no-code visual data preparation tool, not the catalog's discovery mechanism.
