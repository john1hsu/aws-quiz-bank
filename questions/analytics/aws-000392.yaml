true_statement: Amazon CloudSearch is closed to new customers, and AWS's guidance points to Amazon OpenSearch Service as the place for new search workloads.
false_statement: Amazon CloudSearch is closed to new customers, and AWS's guidance points to Amazon Athena as the place for new search workloads.
explanation: OpenSearch Service is AWS's search and log analytics service and the documented path away from CloudSearch. Athena is for interactive SQL over data in S3, not search.
