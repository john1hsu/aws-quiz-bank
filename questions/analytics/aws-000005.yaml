id: aws-000005
product_area: analytics
true_statement: An Athena workgroup's per-query data scanned limit cancels any query that exceeds it, while per-workgroup hourly or daily thresholds only send an SNS alert.
false_statement: An Athena workgroup's per-query data scanned limit only sends an SNS alert, while per-workgroup hourly or daily thresholds cancel any query that exceeds them.
explanation: The single per-query control is the hard stop that cancels runaway queries. The hourly or daily workgroup thresholds are soft controls that raise an alarm and notify through Amazon SNS without stopping queries.
