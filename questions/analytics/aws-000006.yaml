id: aws-000006
product_area: analytics
true_statement: Athena does not charge for failed queries, but a cancelled query is charged for the data it scanned before cancellation.
false_statement: Athena does not charge for cancelled queries, but a failed query is charged for the data it scanned before failing.
explanation: Failed queries carry no Athena charge. Cancelling a query stops further scanning, but whatever was already scanned up to that point is billed.
