id: aws-000547
product_area: analytics
true_statement: Amazon MSK Serverless requires IAM access control on every cluster and does not support Kafka ACLs.
false_statement: Amazon MSK Serverless requires Kafka ACLs on every cluster and does not support IAM access control.
explanation: Serverless clusters authenticate and authorize clients only through IAM, reached privately over PrivateLink. Kafka's own ACLs are the option it leaves out.
