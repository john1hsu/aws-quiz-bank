id: aws-000327
product_area: analytics
true_statement: AWS Lake Formation charges nothing for creating permissions, enforcing them or cross-account sharing; its own charge is for Storage API bytes scanned (as of 2026-11).
false_statement: AWS Lake Formation charges per permission grant and per cross-account share, while Storage API reads cost nothing extra (as of 2026-11).
explanation: The permissions layer is free; Lake Formation bills only Storage API scans, with a 10 MB minimum, when no other analytics service processes the data. S3 and the Glue Data Catalog bill separately at their usual rates.
