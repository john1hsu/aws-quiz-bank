id: aws-000552
product_area: analytics
true_statement: Individuals can sign up for AWS Quick with an email or social login and no AWS account, while organizations provision it through the AWS Management Console.
false_statement: Individuals need an AWS account to sign up for AWS Quick, while organizations can provision it with an email or social login and no AWS account.
explanation: The individual route skips AWS accounts entirely. Organizations set Quick up in the console with IAM Identity Center or IAM federation and pay through normal AWS billing.
