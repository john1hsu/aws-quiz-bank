id: aws-000616
product_area: analytics
true_statement: One Kinesis Processing Unit in Managed Service for Apache Flink is 1 vCPU and 4 GB of memory, plus 50 GB of running application storage.
false_statement: One Kinesis Processing Unit in Managed Service for Apache Flink is 1 vCPU and 16 GB of memory, plus 50 GB of running application storage.
explanation: The KPU is the service's capacity and billing unit, and each one pairs a single vCPU with 4 GB of memory and 50 GB of application storage. 16 GB overstates the memory.
