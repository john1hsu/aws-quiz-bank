id: aws-000329
product_area: analytics
true_statement: Amazon S3 Tables allows 100 table buckets per account per Region and 10,000 tables per table bucket by default, all adjustable (as of 2026-11).
false_statement: Amazon S3 Tables allows 10 table buckets per account per Region and 10,000 tables per table bucket by default, all adjustable (as of 2026-11).
explanation: The current quotas page lists 100 table buckets per Region. The figure of 10 comes from an older launch announcement that has since been superseded.
