id: aws-000328
product_area: analytics
true_statement: A data lake applies a schema when data is read, whereas a data warehouse usually has its schema designed before data is loaded.
false_statement: A data warehouse applies a schema when data is read, whereas a data lake usually has its schema designed before data is loaded.
explanation: Lakes store raw data in native form and impose structure at query time (schema-on-read). Warehouses such as Redshift typically model the schema first and load data into it.
