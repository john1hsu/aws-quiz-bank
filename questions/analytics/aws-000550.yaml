id: aws-000550
product_area: analytics
true_statement: AWS Quick organization plans add a $250 per account per month infrastructure fee on top of per-user prices, while individual plans carry no such fee (as of 2026-11).
false_statement: AWS Quick individual plans add a $250 per account per month infrastructure fee on top of per-user prices, while organization plans carry no such fee (as of 2026-11).
explanation: The infrastructure fee applies to organization plans (Essentials, Professional, Enterprise). Individual Free, Plus and Max plans skip it, which is why tiny organizational deployments look relatively expensive.
