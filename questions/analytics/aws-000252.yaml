id: aws-000252
product_area: analytics
true_statement: Amazon Data Firehose rounds each Direct PUT or Kinesis Data Streams record up to 5 KB for billing, so many tiny records cost more than the same bytes in fewer records.
false_statement: Amazon Data Firehose bills each Direct PUT or Kinesis Data Streams record by its exact size, so many tiny records cost the same as the same bytes in fewer records.
explanation: Ingestion is billed per GB, but every record counts as at least 5 KB. Batching small events into larger records is therefore a cost lever.
