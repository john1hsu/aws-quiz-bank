id: aws-000254
product_area: analytics
true_statement: If its destination is unavailable, a Direct PUT Firehose stream keeps retrying data for up to 24 hours before discarding it.
false_statement: If its destination is unavailable, a Direct PUT Firehose stream keeps retrying data for up to 7 days before discarding it.
explanation: Direct PUT data is held for at most 24 hours. Only when the source is a Kinesis data stream does the window extend to that stream's retention period.
