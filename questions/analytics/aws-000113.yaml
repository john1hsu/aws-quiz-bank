id: aws-000113
product_area: analytics
true_statement: Kinesis Data Streams keeps records for 24 hours by default, and the retention period can be raised to as much as 365 days for an extra charge.
false_statement: Kinesis Data Streams keeps records for 7 days by default, and the retention period can be raised to as much as 365 days for an extra charge.
explanation: The default retention is 24 hours, adjustable up to 8,760 hours (365 days), with retention beyond a day billed separately. Seven days is not the default.
