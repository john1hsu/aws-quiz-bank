id: aws-000690
product_area: analytics
true_statement: When two AWS Clean Rooms data owners set different aggregation thresholds, the higher threshold applies and rows below it are silently dropped from results.
false_statement: When two AWS Clean Rooms data owners set different aggregation thresholds, the lower threshold applies and rows below it are returned with a warning.
explanation: The most restrictive rule wins when tables are joined. Rows that miss the higher threshold just disappear, which can make small segments look empty.
