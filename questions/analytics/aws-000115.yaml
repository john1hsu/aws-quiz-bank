id: aws-000115
product_area: analytics
true_statement: Kinesis on-demand mode does not isolate hot partition keys, so AWS recommends provisioned mode for streams with heavily skewed keys.
false_statement: Kinesis provisioned mode does not isolate hot partition keys, so AWS recommends on-demand mode for streams with heavily skewed keys.
explanation: On-demand scaling still routes every record with one key to one shard, so a hot key keeps getting throttled. Provisioned mode gives you control over shard distribution, which is why AWS points skewed workloads there.
