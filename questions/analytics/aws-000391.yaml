id: aws-000391
product_area: analytics
true_statement: With Amazon MSK, AWS runs the Kafka cluster control plane, while you produce and consume data using Apache Kafka's own APIs.
false_statement: With Amazon MSK, AWS runs the Kafka cluster control plane, while you produce and consume data using Kinesis Data Streams APIs.
explanation: MSK is managed Apache Kafka, so applications keep using standard Kafka producer and consumer APIs. Kinesis Data Streams is a separate AWS streaming service with its own API.
