id: aws-000253
product_area: analytics
true_statement: Amazon Data Firehose loads Amazon Redshift indirectly, first writing data to an S3 bucket and then issuing a Redshift COPY command.
false_statement: Amazon Data Firehose loads Amazon Redshift directly, inserting each buffered batch into the target table without staging it in Amazon S3.
explanation: Redshift delivery always stages data in S3 before the COPY. Failed loads are retried for a period and then recorded in an errors manifest for manual loading.
