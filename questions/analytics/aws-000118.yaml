id: aws-000118
product_area: analytics
true_statement: AWS positions Amazon Redshift as the central warehouse for complex BI at scale, and Amazon Athena for ad-hoc queries on S3 data without loading it first.
false_statement: AWS positions Amazon Athena as the central warehouse for complex BI at scale, and Amazon Redshift for ad-hoc queries on S3 data without loading it first.
explanation: Redshift is the MPP warehouse you load curated data into for heavy, frequent, concurrent queries. Athena queries files where they sit, which suits interactive exploration, so the false statement swaps the services.
