id: aws-000042
product_area: analytics
true_statement: The first million AWS Glue Data Catalog metadata objects and the first million catalog requests each month are free (as of 2026-11).
false_statement: The first 100,000 AWS Glue Data Catalog metadata objects and the first 100,000 catalog requests each month are free (as of 2026-11).
explanation: The catalog's free tier covers one million objects and one million requests per month. Beyond that, storage is billed at $1.00 per 100,000 objects, which is where the 100,000 figure comes from.
