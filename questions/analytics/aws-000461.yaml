product_area: analytics
true_statement: In Amazon OpenSearch Service, UltraWarm and cold storage keep read-only indexes on Amazon S3-backed managed storage, while hot data sits on EBS or instance storage.
false_statement: In Amazon OpenSearch Service, hot data sits on Amazon S3-backed managed storage, while UltraWarm and cold storage keep read-only indexes on EBS or instance storage.
explanation: The warm and cold tiers lower cost for less-accessed, read-only indexes by keeping them on S3-backed storage. Actively written and queried data stays on the nodes' EBS volumes or instance storage.
