id: aws-000182
product_area: analytics
true_statement: In an Amazon EMR cluster, core nodes run tasks and store HDFS data, while task nodes only run tasks and hold no HDFS data.
false_statement: In an Amazon EMR cluster, task nodes run tasks and store HDFS data, while core nodes only run tasks and hold no HDFS data.
explanation: Core nodes carry HDFS, so multi-node clusters need at least one. Task nodes are pure compute, which makes them optional and the safe place to add or remove capacity such as Spot.
