id: aws-000462
product_area: analytics
true_statement: OpenSearch Service Multi-AZ with Standby needs OpenSearch 1.3 or later and a data-node count that is a multiple of three.
false_statement: OpenSearch Service Multi-AZ with Standby needs OpenSearch 1.3 or later and a data-node count that is a multiple of two.
explanation: The standby option spreads nodes across three Availability Zones with one zone on standby, so data nodes must come in threes. It lets standby nodes take over in under a minute for some failures.
