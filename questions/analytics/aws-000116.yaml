id: aws-000116
product_area: analytics
true_statement: A Redshift Serverless workgroup's base capacity defaults to 128 RPUs, and it can be set as low as 4 RPUs in most Regions.
false_statement: A Redshift Serverless workgroup's base capacity defaults to 4 RPUs, and it can be set as high as 128 RPUs in most Regions.
explanation: Redshift Serverless starts workgroups at 128 RPUs by default, with a configurable range from 4 up to 512 RPUs in most Regions (1,024 in a few large ones). Four RPUs is the floor, not the default, and 128 is not the ceiling.
