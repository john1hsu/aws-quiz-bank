id: aws-000549
product_area: analytics
true_statement: MSK Connect runs Kafka Connect connectors, while MSK Replicator copies data between MSK Provisioned clusters in the same or different Regions.
false_statement: MSK Replicator runs Kafka Connect connectors, while MSK Connect copies data between MSK Provisioned clusters in the same or different Regions.
explanation: MSK Connect is the managed Kafka Connect runtime for moving data in and out of clusters. Cluster-to-cluster replication, within or across Regions, is MSK Replicator's job.
