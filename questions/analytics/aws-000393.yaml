id: aws-000393
product_area: analytics
true_statement: When Amazon QuickSight evolved into AWS Quick, Quick Sight became the name of its BI component, and existing dashboards, datasets and analyses carried over unchanged.
false_statement: When Amazon QuickSight evolved into AWS Quick, Quick Sight became the name of its BI component, and existing dashboards, datasets and analyses had to be rebuilt.
explanation: AWS's October 2025 change was a rename and expansion, not a migration, so BI assets moved across as they were. Older material may still say QuickSight for the same product.
