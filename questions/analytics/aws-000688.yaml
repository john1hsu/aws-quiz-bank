id: aws-000688
product_area: analytics
true_statement: In an AWS Clean Rooms collaboration, exactly one member can run queries and exactly one can receive results, and those roles can't be changed after creation.
false_statement: In an AWS Clean Rooms collaboration, every member can run queries and receive results, and those roles can be reassigned at any time after creation.
explanation: Clean Rooms fixes a single querying member and a single result receiver when the collaboration is created. Because they can't be changed later, they need planning up front; only payer candidates can be several.
