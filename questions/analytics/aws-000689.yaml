id: aws-000689
product_area: analytics
true_statement: An AWS Clean Rooms aggregation analysis rule allows only aggregate results such as COUNT, SUM and AVG above a minimum threshold, while a list rule allows row-level lists of the overlap.
false_statement: An AWS Clean Rooms list analysis rule allows only aggregate results such as COUNT, SUM and AVG above a minimum threshold, while an aggregation rule allows row-level lists of the overlap.
explanation: Aggregation rules never return rows, only grouped figures over a threshold. List rules return the overlapping rows themselves, for enrichment or segment building.
