id: aws-000326
product_area: analytics
true_statement: For Glue compatibility, new accounts grant Super to the IAMAllowedPrincipals group in Lake Formation, so IAM alone decides data access until those defaults change.
false_statement: For Glue compatibility, new accounts revoke the IAMAllowedPrincipals group's access in Lake Formation, so Lake Formation grants decide data access from the start.
explanation: 'Lake Formation is effectively off by default: IAMAllowedPrincipals holds Super and the IAM-only setting is on. You must change both, or use hybrid access mode, before Lake Formation grants take effect.'
