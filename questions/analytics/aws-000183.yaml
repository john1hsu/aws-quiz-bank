id: aws-000183
product_area: analytics
true_statement: Data kept only in an Amazon EMR cluster's HDFS is lost when the cluster terminates, so durable input and output usually live in Amazon S3.
false_statement: Data kept only in an Amazon EMR cluster's HDFS is saved to Amazon S3 automatically when the cluster terminates, so it survives the cluster.
explanation: HDFS on EMR is ephemeral and disappears with the cluster, even after a failure. Keeping durable data in S3 through EMRFS or S3A is what makes short-lived, job-scoped clusters practical.
