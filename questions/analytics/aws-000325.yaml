id: aws-000325
product_area: analytics
true_statement: A data access request governed by AWS Lake Formation has to pass both its IAM permission check and its Lake Formation permission check.
false_statement: A data access request governed by AWS Lake Formation has to pass only its Lake Formation permission check, which overrides any IAM permission check.
explanation: IAM and Lake Formation permissions are complementary layers, and both must allow the request. Enabling Lake Formation does not replace or override existing IAM permissions.
