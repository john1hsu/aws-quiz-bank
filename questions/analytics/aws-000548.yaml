id: aws-000548
product_area: analytics
true_statement: AWS states that Amazon MSK Express brokers deliver up to 3x the throughput per broker of Standard brokers and scale up to 20x faster.
false_statement: AWS states that Amazon MSK Express brokers deliver up to 10x the throughput per broker of Standard brokers and scale up to 20x faster.
explanation: AWS's claim for Express brokers is up to three times the per-broker throughput, for example 500 MBps versus 153.8 MBps on m7g.16xlarge. Ten times overstates it.
