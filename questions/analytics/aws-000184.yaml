id: aws-000184
product_area: analytics
true_statement: An Amazon EMR on EC2 cluster can run one or three primary nodes, and the three-node option needs EMR release 5.23.0 or later.
false_statement: An Amazon EMR on EC2 cluster can run one or two primary nodes, and the two-node option needs EMR release 5.23.0 or later.
explanation: For primary-node high availability EMR supports three primary nodes, starting with release 5.23.0. There is no two-primary configuration.
