id: aws-000617
product_area: analytics
true_statement: Managed Service for Apache Flink bills each streaming application one extra KPU for orchestration, so the smallest always-on application pays for two KPUs.
false_statement: Managed Service for Apache Flink bills each streaming application two extra KPUs for orchestration, so the smallest always-on application pays for three KPUs.
explanation: A streaming application adds a single orchestration KPU on top of its processing KPUs, giving a two-KPU minimum. The two extra KPUs apply to Studio notebooks, not streaming applications.
