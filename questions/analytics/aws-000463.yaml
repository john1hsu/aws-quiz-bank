id: aws-000463
product_area: analytics
true_statement: Service control policies for OpenSearch Service must list both old and new action names, such as es:CreateElasticsearchDomain and es:CreateDomain, because SCPs get no automatic mapping.
false_statement: Identity-based policies for OpenSearch Service must list both old and new action names, such as es:CreateElasticsearchDomain and es:CreateDomain, because they get no automatic mapping.
explanation: After the 2021 rename, AWS maps old action names to new ones for identity policies. SCPs don't receive that mapping, so they need both names to be effective.
