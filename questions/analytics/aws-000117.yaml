id: aws-000117
product_area: analytics
true_statement: Each Amazon Redshift cluster earns up to one hour of free Concurrency Scaling credit per day, and unused credit accrues up to 30 hours.
false_statement: Each Amazon Redshift cluster earns up to one hour of free Concurrency Scaling credit per day, and unused credit expires at the end of that day.
explanation: Concurrency Scaling credits build up rather than reset daily, to a ceiling of 30 hours per cluster. Only usage beyond the banked credit is billed, per second with a one-minute minimum.
