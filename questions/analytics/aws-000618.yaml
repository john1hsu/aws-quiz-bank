id: aws-000618
product_area: analytics
true_statement: Stateful stream jobs such as windowed aggregations suit Managed Service for Apache Flink, while landing a stream in a destination with no stateful logic is simpler with Amazon Data Firehose.
false_statement: Stateful stream jobs such as windowed aggregations suit Amazon Data Firehose, while landing a stream in a destination with no stateful logic is simpler with Managed Service for Apache Flink.
explanation: Flink is built for stateful, low-latency processing like joins and windowed aggregates. Firehose is a delivery service for moving a stream into a destination, and it's often a sink for Flink jobs.
