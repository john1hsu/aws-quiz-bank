id: aws-000004
product_area: analytics
true_statement: Athena SQL per-query billing charges $5 per TB of data scanned, with S3 storage and requests billed separately (as of 2026-11).
false_statement: Athena SQL per-query billing charges $5 per TB of data stored in the queried S3 tables, with S3 requests billed separately (as of 2026-11).
explanation: Athena's per-query price is driven by bytes scanned, which is why partitioning and columnar formats cut cost. Storage of the underlying files is an ordinary S3 charge, not the basis of Athena's price.
