id: aws-000567
product_area: containers
true_statement: EKS Pod Identity allows up to 5,000 associations per cluster, and each Kubernetes service account can be tied to only one IAM role.
false_statement: EKS Pod Identity allows up to 5,000 associations per cluster, and each Kubernetes service account can be tied to up to five IAM roles.
explanation: A service account maps to a single IAM role through Pod Identity. The 5,000-association limit is also one that Service Quotas cannot change.
