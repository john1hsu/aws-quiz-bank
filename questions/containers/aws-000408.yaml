id: aws-000408
product_area: containers
true_statement: An ECS service that uses service discovery is capped at 1,000 tasks, because AWS Cloud Map allows only 1,000 instances per service and that quota can't be raised.
false_statement: An ECS service that uses service discovery can reach 5,000 tasks, because AWS Cloud Map's 1,000 instances-per-service quota can be raised to match ECS.
explanation: The Cloud Map per-service instance limit is fixed at 1,000, so it becomes the ceiling for a service-discovery-enabled ECS service. ECS's own 5,000 tasks-per-service limit is never reached in that case.
