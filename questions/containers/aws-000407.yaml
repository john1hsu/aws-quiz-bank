id: aws-000407
product_area: containers
true_statement: Among Amazon ECS resource quotas, only clusters per account (10,000) is adjustable, while services per cluster is fixed at 5,000 (as of 2026-11).
false_statement: Among Amazon ECS resource quotas, only services per cluster (5,000) is adjustable, while clusters per account is fixed at 10,000 (as of 2026-11).
explanation: The cluster count is the one ECS resource quota you can raise. Services per cluster, tasks per service and the other resource counts are fixed, so they shape how you split workloads across clusters.
