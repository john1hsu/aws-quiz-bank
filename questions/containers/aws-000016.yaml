id: aws-000016
product_area: containers
true_statement: With the EC2 option, Amazon ECS adds no orchestration charge; you pay only for the instances, EBS volumes and public IPv4 addresses you use.
false_statement: With the EC2 option, Amazon ECS adds an hourly per-cluster orchestration charge on top of the instances, EBS volumes and public IPv4 addresses you use.
explanation: ECS does not bill for orchestration itself; the cost comes from the compute and storage your tasks consume. There is no per-cluster fee for the control plane.
