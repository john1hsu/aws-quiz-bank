id: aws-000406
product_area: containers
true_statement: ECS tasks in awsvpc mode on EC2 container instances get no public IP, so IPv4 internet access goes through a private subnet and a NAT gateway.
false_statement: ECS tasks in awsvpc mode on EC2 container instances get a public IP in a public subnet, so IPv4 internet access goes straight through an internet gateway.
explanation: Task ENIs on EC2 container instances are never given public addresses. For outbound IPv4 they rely on NAT from a private subnet; dual-stack tasks can use IPv6 through an internet or egress-only gateway.
