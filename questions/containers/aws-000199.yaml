id: aws-000199
product_area: containers
true_statement: An ECR pull through cache rule mirrors images from an upstream registry such as Docker Hub into your private registry and re-checks the upstream for updates.
false_statement: An ECR replication rule mirrors images from an upstream registry such as Docker Hub into your private registry and re-checks the upstream for updates.
explanation: Pull through cache is the feature for keeping copies of third-party images in ECR. Replication copies images you already hold in ECR to other Regions or accounts.
