id: aws-000634
product_area: containers
true_statement: 'Bottlerocket has no package manager: it ships as a prebuilt image with a read-only root filesystem, and updates are written to a second partition with the old image kept for rollback.'
false_statement: 'Bottlerocket uses a package manager: it ships as a minimal image with a writable root filesystem, and updates patch individual packages in place with no previous image kept for rollback.'
explanation: Bottlerocket is image-based. A whole new release goes onto a spare partition and the bootloader switches to it, so a host is either fully updated or can roll back in one step.
