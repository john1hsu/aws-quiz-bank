id: aws-000266
product_area: containers
true_statement: AWS App2Container is a command-line tool that packages existing .NET and Java applications as containers.
false_statement: AWS App2Container is a managed orchestrator that schedules and scales containers on on-premises servers.
explanation: App2Container helps containerize existing applications; it does not run them. Running containers on premises is the job of options such as ECS Anywhere or EKS Anywhere.
