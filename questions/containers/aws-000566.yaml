id: aws-000566
product_area: containers
true_statement: An EKS control plane in Standard mode supports a cluster database of up to 8 GB, while Provisioned Control Plane tiers support 16 GB.
false_statement: An EKS control plane in Standard mode supports a cluster database of up to 2 GB, while Provisioned Control Plane tiers support 8 GB.
explanation: Standard mode scales automatically but caps the etcd database at 8 GB; paid Provisioned tiers raise it to 16 GB. A cluster that grows past 8 GB cannot return to Standard until usage shrinks.
