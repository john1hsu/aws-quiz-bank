id: aws-000637
product_area: containers
true_statement: Karpenter launches EC2 instances directly from a flexible NodePool, while Cluster Autoscaler resizes EC2 Auto Scaling groups or managed node groups.
false_statement: Cluster Autoscaler launches EC2 instances directly from a flexible NodePool, while Karpenter resizes EC2 Auto Scaling groups or managed node groups.
explanation: Karpenter reads pending pods' requirements and picks right-sized instances itself. Cluster Autoscaler works through pre-built groups, so instance diversity means creating many of them.
