id: aws-000473
product_area: containers
true_statement: AWS Fargate's concurrent capacity quotas count the vCPUs requested by running tasks and pods, rather than the number of running tasks and pods.
false_statement: AWS Fargate's concurrent capacity quotas count the number of running tasks and pods, rather than the vCPUs those tasks and pods request.
explanation: Since 2022 Fargate limits concurrent usage in vCPUs, so sixteen quarter-vCPU tasks use the same quota as one 4-vCPU task. The older task-count quotas and their metrics were retired.
