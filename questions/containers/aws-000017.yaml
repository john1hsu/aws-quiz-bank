id: aws-000017
product_area: containers
true_statement: An Amazon ECS service can be moved from a launch type to a capacity provider, but not directly from the EC2 launch type to the Fargate launch type.
false_statement: An Amazon ECS service can be moved directly from the EC2 launch type to the Fargate launch type, but not from a launch type to a capacity provider.
explanation: ECS supports switching a service from a launch type to a capacity provider strategy. Switching straight between two launch types such as EC2 and Fargate is not supported.
