id: aws-000565
product_area: containers
true_statement: An Amazon EKS cluster allows at most 3,000 access entries, a quota that cannot be raised, so large organizations map access through a few IAM roles (as of 2026-11).
false_statement: An Amazon EKS cluster allows at most 300 access entries, a quota that cannot be raised, so large organizations map access through a few IAM roles (as of 2026-11).
explanation: The fixed ceiling is 3,000 access entries per cluster. It is high but still caps per-user mappings, which is why role-based access is the usual pattern at scale.
