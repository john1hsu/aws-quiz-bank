id: aws-000636
product_area: containers
true_statement: AWS-provided Bottlerocket builds carry no extra charge, so you pay only for the EC2 instances that run them.
false_statement: AWS-provided Bottlerocket builds carry an hourly license fee per node on top of the EC2 instances that run them.
explanation: AWS's own Bottlerocket AMIs are free to use and covered by AWS Support plans. Only third-party Marketplace products built on Bottlerocket may add an hourly fee.
