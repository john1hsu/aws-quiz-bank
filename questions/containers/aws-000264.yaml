id: aws-000264
product_area: containers
true_statement: Up to 25 Amazon ECS Express Mode services can share one Application Load Balancer, and Express Mode adds no charge beyond the resources it creates.
false_statement: Each Amazon ECS Express Mode service needs its own Application Load Balancer, and Express Mode adds a per-service charge on top of the resources it creates.
explanation: Express Mode provisions a Fargate-backed service, ALB, scaling and networking in one call, and several services can share an ALB. You pay only for those underlying resources.
