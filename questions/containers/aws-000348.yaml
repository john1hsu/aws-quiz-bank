id: aws-000348
product_area: containers
true_statement: One ECS task definition can list both FARGATE and MANAGED_INSTANCES, but a single capacity provider strategy cannot mix Managed Instances and Fargate providers.
false_statement: A single ECS capacity provider strategy can mix Managed Instances and Fargate providers, but one task definition cannot list both FARGATE and MANAGED_INSTANCES.
explanation: Compatibility is declared per task definition, so the same definition can run on either option. Capacity provider strategies, however, must not combine Managed Instances with Fargate or Auto Scaling group providers.
