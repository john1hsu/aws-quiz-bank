id: aws-000197
product_area: containers
true_statement: Amazon ECR basic scanning is provided and billed by ECR, while enhanced scanning is provided and billed by Amazon Inspector.
false_statement: Amazon ECR enhanced scanning is provided and billed by ECR, while basic scanning is provided and billed by Amazon Inspector.
explanation: Basic scanning is ECR's own feature. Enhanced scanning hands the work to Amazon Inspector, which also covers programming-language packages and can rescan continuously when new CVEs appear.
