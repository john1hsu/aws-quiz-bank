id: aws-000638
product_area: containers
true_statement: With no disruption budget defined, Karpenter disrupts at most 10% of a NodePool's nodes at a time.
false_statement: With no disruption budget defined, Karpenter disrupts at most 50% of a NodePool's nodes at a time.
explanation: The default budget caps voluntary disruption, such as consolidation or drift replacement, at a tenth of a NodePool's nodes at once. Pods can also opt out with the do-not-disrupt annotation.
