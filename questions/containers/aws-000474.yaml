id: aws-000474
product_area: containers
true_statement: An Amazon EKS pod on Fargate that requests 1 vCPU and 8 GB is provisioned and billed as 2 vCPU and 9 GB, after Fargate adds memory for Kubernetes components and rounds up.
false_statement: An Amazon EKS pod on Fargate that requests 1 vCPU and 8 GB is provisioned and billed as exactly 1 vCPU and 8 GB, because Fargate uses the pod's request as given.
explanation: Fargate adds 256 MB for kubelet, kube-proxy and containerd and then rounds up to the next supported size, which here requires 2 vCPU. The CapacityProvisioned annotation shows the enforced size.
