id: aws-000198
product_area: containers
true_statement: Pulling an ECR image to ECS, Fargate or Lambda in the same Region is free, while cross-Region pulls are charged at internet data transfer rates.
false_statement: Pulling an ECR image to ECS, Fargate or Lambda in another Region is free, while same-Region pulls are charged at internet data transfer rates.
explanation: ECR charges nothing for inbound pushes or for same-Region pulls to AWS compute. Moving image data between Regions, by pulling or by replication, is billed like internet transfer.
