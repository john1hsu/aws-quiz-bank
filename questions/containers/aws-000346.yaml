id: aws-000346
product_area: containers
true_statement: Amazon ECS Managed Instances run only the Bottlerocket OS without SSH access, so you debug running tasks through ECS Exec instead.
false_statement: Amazon ECS Managed Instances run only Amazon Linux 2023 without SSH access, so you debug running tasks through ECS Exec instead.
explanation: Managed Instances use Bottlerocket, AWS's container-focused OS with an immutable root filesystem and no SSH. Custom AMIs, including other Linux images, are not supported.
