true_statement: AWS Fargate bills Linux tasks per second with a one-minute minimum and Windows tasks per second with a five-minute minimum.
false_statement: AWS Fargate bills Windows tasks per second with a one-minute minimum and Linux tasks per second with a five-minute minimum.
explanation: Both operating systems are metered per second from the start of the image download, but the minimum charge is one minute on Linux and five minutes on Windows.
