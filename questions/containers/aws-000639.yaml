id: aws-000639
product_area: containers
true_statement: The Karpenter controller should run on a small managed node group or on Fargate, never on the nodes it manages itself.
false_statement: The Karpenter controller should run on the nodes it manages itself, never on a separate managed node group or on Fargate.
explanation: If Karpenter consolidated or terminated the node hosting its own controller, nothing would be left to manage capacity. Keeping it on separate capacity avoids that.
