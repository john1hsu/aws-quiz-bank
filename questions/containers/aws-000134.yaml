true_statement: Each Kubernetes minor version on Amazon EKS gets 14 months of standard support followed by 12 months of extended support.
false_statement: Each Kubernetes minor version on Amazon EKS gets 12 months of standard support followed by 14 months of extended support.
explanation: EKS gives every minor version 14 months of standard support from its EKS release and then 12 months of extended support, 26 months in total. The false statement swaps the two periods.
