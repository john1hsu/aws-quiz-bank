id: aws-000052
product_area: containers
true_statement: Load balancer target groups for AWS Fargate tasks must use the ip target type, because a task has no EC2 instance to register.
false_statement: Load balancer target groups for AWS Fargate tasks must use the instance target type, because each task is registered through its host EC2 instance.
explanation: Every Fargate task runs in awsvpc mode with its own network interface and IP address, and there is no customer-visible instance. Target groups therefore register tasks by IP.
