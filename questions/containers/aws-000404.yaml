id: aws-000404
product_area: containers
true_statement: When an Amazon ECS task definition on Linux sets no network mode, the task uses bridge mode, even though AWS recommends awsvpc.
false_statement: When an Amazon ECS task definition on Linux sets no network mode, the task uses awsvpc mode, which is also the mode AWS recommends.
explanation: Docker's bridge network is the Linux default when networkMode is omitted. AWS recommends choosing awsvpc explicitly so each task gets its own ENI and VPC address.
