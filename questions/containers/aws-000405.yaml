id: aws-000405
product_area: containers
true_statement: With VPC CNI prefix delegation on Amazon EKS, each ENI slot receives a /28 IPv4 prefix of 16 addresses instead of a single secondary IP.
false_statement: With VPC CNI prefix delegation on Amazon EKS, each ENI slot receives a /24 IPv4 prefix of 256 addresses instead of a single secondary IP.
explanation: Prefix delegation hands out /28 blocks, 16 addresses each, which raises pod density without more ENIs. It needs contiguous /28 space, so fragmented subnets can fail with InsufficientCidrBlocks.
