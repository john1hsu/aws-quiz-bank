id: aws-000135
product_area: containers
true_statement: An Amazon EKS cluster costs $0.10 per hour while its Kubernetes version is in standard support and $0.60 per hour in extended support (as of 2026-11).
false_statement: An Amazon EKS cluster costs $0.10 per hour while its Kubernetes version is in standard support and $0.20 per hour in extended support (as of 2026-11).
explanation: The cluster fee jumps sixfold, from $0.10 to $0.60 per hour, once a version leaves standard support. Worker capacity such as EC2 and EBS is billed separately in both cases.
