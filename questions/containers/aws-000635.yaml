id: aws-000635
product_area: containers
true_statement: Bottlerocket's control container, on by default, runs the Systems Manager agent and must stay enabled for Amazon Inspector to scan the host.
false_statement: Bottlerocket's admin container, on by default, runs the Systems Manager agent and must stay enabled for Amazon Inspector to scan the host.
explanation: The control container provides SSM commands and Session Manager access, and Inspector relies on it. The privileged admin container with debugging tools is off by default and meant for development and testing.
