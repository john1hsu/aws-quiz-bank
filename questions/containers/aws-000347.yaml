id: aws-000347
product_area: containers
true_statement: AWS patches ECS Managed Instances roughly every 14 days, after which ECS drains an instance and moves its service tasks onto a fresh one.
false_statement: AWS patches ECS Managed Instances roughly every 90 days, after which ECS drains an instance and moves its service tasks onto a fresh one.
explanation: Instances live for about two weeks before replacement, so long-running tasks must tolerate being moved. Hosts that must live longer belong on self-managed EC2 capacity.
