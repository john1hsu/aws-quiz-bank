id: aws-000054
product_area: containers
true_statement: On Amazon EKS, Fargate pods are scheduled only if they match a Fargate profile, and they run in private subnets.
false_statement: On Amazon EKS, Fargate pods are scheduled only if they match a Fargate profile, and they run in public subnets.
explanation: EKS uses Fargate profiles to decide which pods go to Fargate, and those pods must use private subnets. Pods that need public subnets, DaemonSets or EBS volumes belong on EC2 nodes.
