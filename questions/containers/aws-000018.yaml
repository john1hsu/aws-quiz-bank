id: aws-000018
product_area: containers
true_statement: The Amazon ECS Managed Instances management fee still applies when the underlying EC2 capacity is covered by Savings Plans, Reserved Instances or Spot.
false_statement: The Amazon ECS Managed Instances management fee is waived when the underlying EC2 capacity is covered by Savings Plans, Reserved Instances or Spot.
explanation: Managed Instances charges a per-instance management fee on top of the EC2 price regardless of purchase option. Discounted EC2 capacity lowers the instance cost but leaves that fee in place.
