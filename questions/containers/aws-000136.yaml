id: aws-000136
product_area: containers
true_statement: The EKS cluster upgrade policy defaults to EXTENDED, so a cluster left on an aging version moves into paid extended support unless you opt out.
false_statement: The EKS cluster upgrade policy defaults to STANDARD, so a cluster left on an aging version is auto-upgraded when standard support ends unless you opt in.
explanation: Extended support is the default for new and existing clusters. Only if you opt out does EKS auto-upgrade the control plane at the end of standard support instead of billing extended support.
