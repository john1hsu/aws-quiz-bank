id: aws-000409
product_area: containers
true_statement: ECS service-modify calls such as UpdateService share a token bucket with a burst of 50 and a sustained rate of 5 per second (as of 2026-11).
false_statement: ECS service-modify calls such as UpdateService share a token bucket with a burst of 100 and a sustained rate of 40 per second (as of 2026-11).
explanation: Service create, update and delete calls refill at only 5 per second after a 50-call burst, which slows pipelines that touch many services. The 100/40 bucket belongs to cluster resource calls such as RunTask and StopTask.
