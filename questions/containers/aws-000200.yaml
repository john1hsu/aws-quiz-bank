id: aws-000200
product_area: containers
true_statement: EKS Auto Mode's built-in NodePools launch only On-Demand C, M and R instances, so Spot or GPU capacity needs a custom NodePool.
false_statement: EKS Auto Mode's built-in NodePools launch only Spot C, M and R instances, so On-Demand or GPU capacity needs a custom NodePool.
explanation: The system and general-purpose pools are On-Demand only and limited to C, M and R families of generation 5 or newer, and they cannot be edited. Adding Spot or GPU instances means defining your own NodePool.
