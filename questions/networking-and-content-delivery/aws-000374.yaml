id: aws-000374
product_area: networking-and-content-delivery
true_statement: Application Load Balancer LCU charges follow whichever single dimension is highest, such as new connections, active connections, processed bytes or rule evaluations.
false_statement: Application Load Balancer LCU charges add up all dimensions together, so new connections, active connections, processed bytes and rule evaluations are each billed separately.
explanation: Each hour the ALB measures usage on every LCU dimension and bills only the largest one. Summing the dimensions would charge several times for the same traffic.
