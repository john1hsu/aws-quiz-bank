id: aws-000299
product_area: networking-and-content-delivery
true_statement: AWS Direct Connect traffic is not encrypted by default, but MACsec layer-2 encryption is available on dedicated connections at selected locations.
false_statement: AWS Direct Connect traffic is encrypted by default with MACsec on every connection, including hosted connections at any location.
explanation: A private link is not the same as an encrypted one. MACsec has to be set up and is limited to certain dedicated connection speeds and locations.
