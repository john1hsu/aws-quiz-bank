id: aws-000443
product_area: networking-and-content-delivery
true_statement: Gateway endpoints for Amazon S3 and DynamoDB don't use PrivateLink and are free, while PrivateLink interface endpoints are billed per endpoint network interface-hour.
false_statement: Interface endpoints for Amazon S3 and DynamoDB don't use PrivateLink and are free, while PrivateLink gateway endpoints are billed per endpoint network interface-hour.
explanation: Gateway endpoints are route-table targets for just S3 and DynamoDB and carry no charge. Interface endpoints place PrivateLink network interfaces in your subnets and cost $0.01 per interface-hour plus data processing in AWS's us-east-1 example.
