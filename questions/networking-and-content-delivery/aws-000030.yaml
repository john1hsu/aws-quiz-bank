true_statement: CloudFront flat-rate plans have no overage charges; going past the plan's allowance can instead degrade performance.
false_statement: CloudFront flat-rate plans bill overage per GB once the plan's allowance is used, with no change to performance.
explanation: Flat-rate plans cap the monthly bill. Instead of charging for extra usage, CloudFront may reduce performance, for example by serving from fewer locations.
