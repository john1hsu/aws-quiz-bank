id: aws-000518
product_area: networking-and-content-delivery
true_statement: If a Region has no healthy endpoints, Global Accelerator fails open and sends that Region's traffic to all of its endpoints.
false_statement: If a Region has no healthy endpoints, Global Accelerator fails closed and drops that Region's traffic until an endpoint recovers.
explanation: Global Accelerator normally routes only to healthy endpoints, but when none in a Region pass it sends traffic to all of them rather than to none. Dropping the traffic is not its documented behaviour.
