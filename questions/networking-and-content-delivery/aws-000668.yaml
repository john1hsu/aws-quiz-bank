id: aws-000668
product_area: networking-and-content-delivery
true_statement: AWS Cloud WAN carries an 8,500-byte MTU between VPCs but only 1,500 bytes over VPN, and packets larger than the MTU are dropped.
false_statement: AWS Cloud WAN carries an 8,500-byte MTU over VPN but only 1,500 bytes between VPCs, and packets larger than the MTU are dropped.
explanation: Jumbo frames work on VPC-to-VPC paths, while VPN paths are limited to the standard 1,500 bytes. Path MTU Discovery only helps traffic entering through VPC attachments.
