id: aws-000373
product_area: networking-and-content-delivery
true_statement: An Application Load Balancer can authenticate users through an OIDC provider or an Amazon Cognito user pool, but only on HTTPS listeners.
false_statement: An Application Load Balancer can authenticate users through an OIDC provider or an Amazon Cognito user pool on any HTTP or HTTPS listener.
explanation: The authenticate-oidc and authenticate-cognito rule actions require an HTTPS listener. Plain HTTP listeners cannot use built-in authentication.
