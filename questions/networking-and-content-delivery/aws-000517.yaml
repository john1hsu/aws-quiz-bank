id: aws-000517
product_area: networking-and-content-delivery
true_statement: A Global Accelerator custom routing accelerator supports only VPC subnet endpoints and maps each user deterministically to a specific private IP and port.
false_statement: A Global Accelerator standard accelerator supports only VPC subnet endpoints and maps each user deterministically to a specific private IP and port.
explanation: Deterministic mapping to subnet destinations is the custom routing type. Standard accelerators send clients to the nearest healthy endpoint, which can be an NLB, ALB, EC2 instance or Elastic IP.
