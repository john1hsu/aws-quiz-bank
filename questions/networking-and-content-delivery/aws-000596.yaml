id: aws-000596
product_area: networking-and-content-delivery
true_statement: Amazon ECS Service Connect uses an AWS Cloud Map HTTP namespace and creates no Route 53 hosted zones.
false_statement: Amazon ECS Service Connect uses an AWS Cloud Map private DNS namespace and creates a private Route 53 hosted zone for it.
explanation: Service Connect relies on the API-based HTTP namespace plus a proxy that ECS injects into each task. Classic ECS service discovery is the option that uses DNS namespaces and records.
