id: aws-000513
product_area: networking-and-content-delivery
true_statement: Every ARC zonal shift must have an expiry, initially set between 1 minute and 3 days, which you can later extend or cancel.
false_statement: Every ARC zonal shift must have an expiry, initially set between 1 minute and 7 days, which you can later extend or cancel.
explanation: Zonal shifts are temporary by design, with a starting duration of up to 3 days (72 hours). A week is beyond that initial maximum, though a shift can be extended afterwards.
