id: aws-000670
product_area: networking-and-content-delivery
true_statement: Each AWS Site-to-Site VPN connection contains two encrypted tunnels that can carry traffic at the same time, for redundancy on the AWS side.
false_statement: Each AWS Site-to-Site VPN connection contains one encrypted tunnel, and redundancy on the AWS side requires creating a second VPN connection.
explanation: Two tunnels come with every Site-to-Site VPN connection, and both can be active together. A second connection isn't needed for AWS-side redundancy.
