id: aws-000164
product_area: networking-and-content-delivery
true_statement: AWS suggests Transit Gateway for self-managed routing between many VPCs, and AWS Cloud WAN when you want AWS to manage a global WAN with central policy.
false_statement: AWS suggests Cloud WAN for self-managed routing between many VPCs, and AWS Transit Gateway when you want AWS to manage a global WAN with central policy.
explanation: Transit Gateway is a hub you configure and route yourself, including across Regions. Cloud WAN is the managed wide-area network option driven by a central policy, so the false statement swaps their roles.
