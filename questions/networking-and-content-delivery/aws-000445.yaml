id: aws-000445
product_area: networking-and-content-delivery
true_statement: Each PrivateLink VPC endpoint starts at 10 Gbps per Availability Zone and scales automatically to 100 Gbps (as of 2026-11).
false_statement: Each PrivateLink VPC endpoint starts at 1 Gbps per Availability Zone and scales automatically to 10 Gbps (as of 2026-11).
explanation: Endpoint bandwidth begins at 10 Gbps in each AZ and grows to 100 Gbps without action from you. Packets larger than the 8,500-byte MTU are dropped.
