id: aws-000165
product_area: networking-and-content-delivery
true_statement: AWS points to Global Accelerator for latency-sensitive applications such as gaming, IoT and VoIP, and to CloudFront for cutting latency on web content.
false_statement: AWS points to CloudFront for latency-sensitive applications such as gaming, IoT and VoIP, and to Global Accelerator for cutting latency on web content.
explanation: CloudFront is the CDN that caches and delivers web content from the edge. Global Accelerator gives static IPs and carries traffic over the AWS network to the nearest healthy endpoint, which suits non-cacheable, latency-sensitive traffic.
