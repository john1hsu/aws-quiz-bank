product_area: networking-and-content-delivery
true_statement: ARC zonal autoshift requires weekly practice runs that move traffic away from one Availability Zone for about 30 minutes.
false_statement: ARC zonal autoshift requires monthly practice runs that move traffic away from one Availability Zone for about 30 minutes.
explanation: Practice runs happen weekly to prove the remaining AZs can carry the load, and each records a SUCCEEDED or FAILED outcome. You can block out windows, but the cadence is weekly, not monthly.
