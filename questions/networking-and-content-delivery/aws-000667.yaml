id: aws-000667
product_area: networking-and-content-delivery
true_statement: In AWS Cloud WAN each attachment lands in exactly one segment, and by default only attachments in the same segment can reach each other.
false_statement: In AWS Cloud WAN each attachment can join several segments, and by default attachments in every segment can reach each other.
explanation: A segment is an isolated routing domain, much like a global VRF. Routes cross segments only when the policy shares them, for example for shared services or central egress.
