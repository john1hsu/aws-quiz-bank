id: aws-000671
product_area: networking-and-content-delivery
true_statement: A Site-to-Site VPN Large Bandwidth Tunnel carries up to 5 Gbps but is available only on transit gateway and Cloud WAN attachments, not on a virtual private gateway.
false_statement: A Site-to-Site VPN Large Bandwidth Tunnel carries up to 5 Gbps but is available only on a virtual private gateway, not on transit gateway or Cloud WAN attachments.
explanation: Large tunnels need a transit gateway or Cloud WAN target. A virtual private gateway is limited to standard tunnels of up to 1.25 Gbps.
