id: aws-000166
product_area: networking-and-content-delivery
true_statement: For workloads leaving AWS App Mesh, AWS recommends Amazon VPC Lattice on Amazon EKS and Amazon ECS Service Connect on Amazon ECS.
false_statement: For workloads leaving AWS App Mesh, AWS recommends Amazon ECS Service Connect on Amazon EKS and Amazon VPC Lattice on Amazon ECS.
explanation: App Mesh closed to new customers in September 2024 and was set to be discontinued on 2026-09-30. Service Connect is an ECS feature, so it cannot be the EKS answer; VPC Lattice is the recommended path for EKS.
