id: aws-000300
product_area: networking-and-content-delivery
true_statement: Transit Gateway appliance mode keeps both directions of a flow on the same Availability Zone interface, which stateful firewalls in an inspection VPC need.
false_statement: Transit Gateway appliance mode spreads the two directions of a flow across different Availability Zone interfaces, which stateful firewalls in an inspection VPC need.
explanation: A stateful appliance must see the request and its return traffic. Appliance mode pins a flow to one AZ's attachment interface so return packets are not dropped.
