id: aws-000028
product_area: networking-and-content-delivery
true_statement: CloudFront Functions run only on viewer request and viewer response events, while Lambda@Edge can also run on origin request and origin response events.
false_statement: Lambda@Edge runs only on viewer request and viewer response events, while CloudFront Functions can also run on origin request and origin response events.
explanation: CloudFront Functions are lightweight, submillisecond JavaScript limited to the viewer side. Lambda@Edge covers all four events and allows network and body access, at lower scale.
