id: aws-000161
product_area: networking-and-content-delivery
true_statement: AWS reserves five IPv4 addresses in every VPC subnet, so a /24 subnet offers 251 usable addresses.
false_statement: AWS reserves two IPv4 addresses in every VPC subnet, so a /24 subnet offers 254 usable addresses.
explanation: Besides the network and broadcast addresses, AWS holds back the VPC router, the DNS server and one address for future use. That leaves 251 of a /24's 256 addresses for your resources.
