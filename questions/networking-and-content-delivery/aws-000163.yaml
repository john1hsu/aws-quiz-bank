id: aws-000163
product_area: networking-and-content-delivery
true_statement: A VPC subnet is public when its route table has a route to an internet gateway, and private when it reaches the internet only through a NAT device.
false_statement: A VPC subnet is public when its route table has a route to a NAT device, and private when it reaches the internet only through an internet gateway.
explanation: The route table, not the subnet itself, decides the type. An internet gateway route makes a subnet public; outbound-only access through NAT keeps it private.
