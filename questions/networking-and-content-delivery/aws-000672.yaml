id: aws-000672
product_area: networking-and-content-delivery
true_statement: A single flow over Site-to-Site VPN is pinned to one tunnel, so aggregating bandwidth needs ECMP across tunnels, which works only with BGP dynamic routing.
false_statement: A single flow over Site-to-Site VPN is split across both tunnels, so aggregating bandwidth needs no ECMP and works with static routing as well as BGP.
explanation: Per-flow throughput is capped by one tunnel. To use several tunnels at once, a transit gateway or Cloud WAN spreads flows with ECMP, and that requires dynamic routing.
