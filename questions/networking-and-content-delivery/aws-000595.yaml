id: aws-000595
product_area: networking-and-content-delivery
true_statement: An AWS Cloud Map HTTP namespace supports discovery only through the DiscoverInstances API, while a private DNS namespace also answers DNS queries from within a VPC.
false_statement: An AWS Cloud Map private DNS namespace supports discovery only through the DiscoverInstances API, while an HTTP namespace also answers DNS queries from within a VPC.
explanation: HTTP namespaces are API-only. A private DNS namespace requires a VPC and creates a private Route 53 hosted zone, so clients can resolve service names by DNS as well.
