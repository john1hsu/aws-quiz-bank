id: aws-000516
product_area: networking-and-content-delivery
true_statement: An IPv4 accelerator in AWS Global Accelerator receives two static IPv4 addresses, while a dual-stack accelerator receives four.
false_statement: An IPv4 accelerator in AWS Global Accelerator receives one static IPv4 address, while a dual-stack accelerator receives two.
explanation: IPv4 accelerators get two addresses, drawn from different network zones at the edge, and dual-stack accelerators get two IPv4 plus two IPv6. A single address would lose that zone-level redundancy.
