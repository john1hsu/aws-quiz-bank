id: aws-000029
product_area: networking-and-content-delivery
true_statement: AWS recommends origin access control (OAC) to restrict a private S3 origin to CloudFront, and labels origin access identity (OAI) as legacy.
false_statement: AWS recommends origin access identity (OAI) to restrict a private S3 origin to CloudFront, and labels origin access control (OAC) as legacy.
explanation: OAC is the current mechanism and supports SSE-KMS objects, newer opt-in Regions and PUT/DELETE to S3. OAI is the older approach that AWS marks as legacy.
