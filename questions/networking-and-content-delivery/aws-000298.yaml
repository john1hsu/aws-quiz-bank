id: aws-000298
product_area: networking-and-content-delivery
true_statement: All connections in an AWS Direct Connect link aggregation group terminate on the same AWS device, so AWS says a LAG is not a high-availability strategy.
false_statement: Connections in an AWS Direct Connect link aggregation group are spread across separate AWS devices, so AWS presents a LAG as a high-availability strategy.
explanation: A LAG bundles links for bandwidth, but one device failure takes them all down. Resilience comes from separate connections on separate devices and locations.
