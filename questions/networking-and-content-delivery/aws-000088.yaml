id: aws-000088
product_area: networking-and-content-delivery
true_statement: A Route 53 alias record can be created at the zone apex, such as example.com itself, whereas a CNAME record cannot.
false_statement: A CNAME record can be created at the zone apex, such as example.com itself, whereas a Route 53 alias record cannot.
explanation: Alias records are a Route 53 extension that works at the apex and tracks the target's changing IPs. A CNAME cannot be placed at the zone apex.
