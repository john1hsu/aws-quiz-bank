id: aws-000669
product_area: networking-and-content-delivery
true_statement: As of 2026-11, AWS Cloud WAN's $0.50 per hour core network edge charge and $0.02 per GB data processing are the same in every Region.
false_statement: As of 2026-11, AWS Cloud WAN's $0.50 per hour core network edge charge and $0.02 per GB data processing apply only in US East (N. Virginia), with other Regions priced differently.
explanation: The edge and data-processing rates are uniform across Regions. What varies by Region is the hourly fee per attachment and per transit gateway peering.
