id: aws-000162
product_area: networking-and-content-delivery
true_statement: A VPC's primary IPv4 CIDR block must be between /16, which holds 65,536 addresses, and /28, which holds 16.
false_statement: A VPC's primary IPv4 CIDR block must be between /8, which holds 16,777,216 addresses, and /28, which holds 16.
explanation: The largest IPv4 block a VPC accepts is a /16. To grow beyond the original block, you add secondary CIDR blocks, because a block cannot be resized after creation.
