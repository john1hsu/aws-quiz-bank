id: aws-000375
product_area: networking-and-content-delivery
true_statement: The default quota for reserved Application Load Balancer LCUs is 0 per Region, so reserving capacity ahead of a traffic spike first needs a quota increase (as of 2026-11).
false_statement: The default quota for reserved Application Load Balancer LCUs is 100 per Region, so reserving capacity ahead of a traffic spike needs no quota increase (as of 2026-11).
explanation: Reserved LCUs start with a zero quota, so teams must request an increase before reserving. Usage above the reservation is then billed at the normal LCU rate.
