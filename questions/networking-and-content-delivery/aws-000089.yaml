id: aws-000089
product_area: networking-and-content-delivery
true_statement: Route 53 does not charge for alias queries to supported AWS resources such as load balancers and CloudFront distributions.
false_statement: Route 53 charges alias queries to supported AWS resources such as load balancers and CloudFront distributions at twice the standard query rate.
explanation: Alias queries that resolve to supported AWS targets are free. By contrast, a CNAME pointing at another Route 53 record is billed as two queries, another reason to prefer aliases.
