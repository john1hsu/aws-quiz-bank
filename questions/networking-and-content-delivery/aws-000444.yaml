id: aws-000444
product_area: networking-and-content-delivery
true_statement: A PrivateLink endpoint service must sit behind a load balancer, while a resource configuration exposed through a resource gateway needs no load balancer.
false_statement: A PrivateLink resource configuration must sit behind a load balancer, while an endpoint service exposed through a resource gateway needs no load balancer.
explanation: Service providers front their endpoint service with a Network or Gateway Load Balancer. Resource owners instead describe a resource, group or CIDR range in a resource configuration and expose it through a resource gateway.
