id: aws-000416
product_area: databases
true_statement: Adding a read replica to an Amazon DocumentDB instance-based cluster copies no data, because the primary and up to 15 replicas share one cluster volume.
false_statement: Adding a read replica to an Amazon DocumentDB instance-based cluster copies the full data set, because the primary and up to 15 replicas each keep their own volume.
explanation: DocumentDB separates compute from a shared, six-copy storage volume, so replicas attach to the same data. That is also why a replica can be promoted quickly when the primary fails.
