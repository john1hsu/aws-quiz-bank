id: aws-000353
product_area: databases
true_statement: Aurora Serverless readers in failover tiers 0–1 track the writer's capacity, while readers in tiers 2–15 scale independently of it.
false_statement: Aurora Serverless readers in failover tiers 2–15 track the writer's capacity, while readers in tiers 0–1 scale independently of it.
explanation: High-priority failover readers stay sized like the writer so they can take over without a capacity shortfall. Lower-priority readers scale on their own load, which suits reporting replicas.
