id: aws-000352
product_area: databases
true_statement: One Aurora capacity unit (ACU) in Aurora Serverless provides roughly 2 GiB of memory with matching CPU and networking.
false_statement: One Aurora capacity unit (ACU) in Aurora Serverless provides roughly 8 GiB of memory with matching CPU and networking.
explanation: AWS sizes an ACU at about 2 GiB of memory plus proportional CPU and network. Capacity ranges and per-ACU-hour prices are all expressed in these units.
