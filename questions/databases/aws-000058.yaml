id: aws-000058
product_area: databases
true_statement: A single Amazon DynamoDB item is capped at 400 KB, a limit that counts attribute names as well as values.
false_statement: A single Amazon DynamoDB item can be up to 4 MB, a limit that counts attribute names as well as values.
explanation: DynamoDB's per-item limit is 400 KB, so larger payloads belong in Amazon S3 with a pointer in the table. The 4 MB figure is the data limit for a whole transaction.
