id: aws-000354
product_area: databases
true_statement: While an Aurora Serverless instance is paused at 0 ACUs its instance charge is zero, but storage and other cluster-level charges continue.
false_statement: While an Aurora Serverless instance is paused at 0 ACUs both its instance charge and the cluster's storage charges stop until it resumes.
explanation: Pausing removes only the compute charge for that instance. Cluster storage persists while paused, so it keeps being billed.
