id: aws-000270
product_area: databases
true_statement: DynamoDB global tables in MREC mode resolve concurrent updates to the same item with last writer wins, while MRSC mode gives a recovery point objective of zero.
false_statement: DynamoDB global tables in MRSC mode resolve concurrent updates to the same item with last writer wins, while MREC mode gives a recovery point objective of zero.
explanation: MREC replicates asynchronously, so conflicting writes are settled by timestamp and the RPO equals the replication lag. MRSC replicates synchronously before acknowledging, which brings the RPO to zero.
