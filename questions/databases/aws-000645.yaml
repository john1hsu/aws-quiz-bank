id: aws-000645
product_area: databases
true_statement: An existing unencrypted Amazon Neptune cluster can't be encrypted in place; you create an encrypted cluster and migrate the data to it.
false_statement: An existing unencrypted Amazon Neptune cluster can be encrypted in place by modifying it to use an AWS KMS key, with no migration needed.
explanation: Encryption at rest with KMS has to be chosen when a Neptune cluster is created. Adding it later means building a new encrypted cluster and moving the data over.
