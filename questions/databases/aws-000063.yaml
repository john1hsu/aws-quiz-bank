id: aws-000063
product_area: databases
true_statement: Amazon RDS read replicas use each engine's asynchronous replication, so a replica can lag behind its source.
false_statement: Amazon RDS read replicas use synchronous replication, so a replica always matches its source with no lag.
explanation: Read replicas rely on the engine's built-in asynchronous replication, which means reads right after a write may be stale. Synchronous replication is what a Multi-AZ standby uses.
