id: aws-000209
product_area: databases
true_statement: Enabling durability on a node-based ElastiCache for Valkey cluster logs writes to a Multi-AZ transactional log, so data survives the loss of every cache node.
false_statement: Enabling durability on a node-based ElastiCache for Memcached cluster logs writes to a Multi-AZ transactional log, so data survives the loss of every cache node.
explanation: Durability is offered for node-based Valkey clusters. Memcached has no such option, so a plain Memcached cache loses its contents when its nodes are lost.
