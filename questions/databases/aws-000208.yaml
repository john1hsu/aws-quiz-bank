id: aws-000208
product_area: databases
true_statement: An ElastiCache serverless cache stores data redundantly across three Availability Zones and carries a 99.99% availability SLA.
false_statement: An ElastiCache serverless cache stores data in a single Availability Zone and carries a 99.9% availability SLA.
explanation: 'Serverless caches are built highly available by default: data is spread over three AZs and the SLA is 99.99%. Single-AZ placement is a node-based option, not how serverless works.'
