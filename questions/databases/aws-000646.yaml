id: aws-000646
product_area: databases
true_statement: As of 2026-11, each DynamoDB partition can serve at most 3,000 read units and 1,000 write units per second.
false_statement: As of 2026-11, each DynamoDB partition can serve at most 1,000 read units and 3,000 write units per second.
explanation: The per-partition ceiling is higher for reads (3,000) than for writes (1,000). Traffic concentrated on one key hits that ceiling even when the table has spare capacity.
