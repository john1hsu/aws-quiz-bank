id: aws-000480
product_area: databases
true_statement: During a Multi-AZ failover, RDS Proxy keeps its IP address and holds idle client connections open, cancelling only connections that are mid-transaction or mid-statement.
false_statement: During a Multi-AZ failover, RDS Proxy changes its IP address and drops every client connection, so all clients must reconnect to the new writer.
explanation: The proxy queues new requests and routes them to the new writer while idle connections stay up. AWS says this can cut failover times for RDS and Aurora Multi-AZ databases by up to 66%.
