id: aws-000575
product_area: databases
true_statement: The RDS API token bucket that Aurora shares holds up to 300 tokens per account per Region and refills at 12 tokens per second.
false_statement: The RDS API token bucket that Aurora shares holds up to 300 tokens per account per Region and refills at 1 token per second.
explanation: A drained bucket refills at 12 tokens a second, taking about 25 seconds. The limit sits outside Service Quotas, so raising it means a Support case with measured peak rates.
