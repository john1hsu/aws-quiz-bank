true_statement: In Amazon ElastiCache, Global Datastore cross-Region replication and data tiering are available only on node-based clusters, not on serverless caches.
false_statement: In Amazon ElastiCache, Global Datastore cross-Region replication and data tiering are available only on serverless caches, not on node-based clusters.
explanation: Serverless trades control for simplicity and lacks these features. Workloads that need cross-Region replication or data tiering must run node-based clusters.
