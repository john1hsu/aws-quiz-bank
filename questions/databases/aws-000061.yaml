id: aws-000061
product_area: databases
true_statement: In an Amazon RDS Multi-AZ DB instance deployment the standby serves no reads, while a Multi-AZ DB cluster's two readers can serve reads.
false_statement: In an Amazon RDS Multi-AZ DB cluster deployment the standbys serve no reads, while a Multi-AZ DB instance's standby can serve reads.
explanation: The Multi-AZ DB instance keeps a synchronous standby purely for failover. The Multi-AZ DB cluster runs a writer and two readers across three AZs, and the readers accept read traffic.
