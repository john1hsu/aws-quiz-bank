id: aws-000479
product_area: databases
true_statement: Any SQL statement larger than 16 KB pins an RDS Proxy client session to one database connection, which removes the multiplexing benefit for that session.
false_statement: Any SQL statement larger than 64 KB pins an RDS Proxy client session to one database connection, which removes the multiplexing benefit for that session.
explanation: RDS Proxy pins a session when it can't safely move its state, and oversized statements over 16 KB are one trigger. The DatabaseConnectionsCurrentlySessionPinned metric shows how often pinning happens.
