id: aws-000060
product_area: databases
true_statement: A DynamoDB global secondary index can use a different partition key from its table, while a local secondary index shares the table's partition key.
false_statement: A DynamoDB local secondary index can use a different partition key from its table, while a global secondary index shares the table's partition key.
explanation: GSIs define their own partition and sort key, giving a fully alternate access path. LSIs keep the table's partition key and vary only the sort key.
