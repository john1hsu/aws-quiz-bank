id: aws-000419
product_area: databases
true_statement: An Aurora Global Database has one primary Region for writes and up to 10 read-only secondary Regions (as of 2026-11).
false_statement: An Aurora Global Database has one primary Region for writes and up to 3 read-only secondary Regions (as of 2026-11).
explanation: AWS raised the secondary-Region limit from five to ten in 2025, so older material may still say five. All writes still go to the single primary Region.
