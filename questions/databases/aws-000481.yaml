id: aws-000481
product_area: databases
true_statement: RDS Proxy is billed per vCPU-hour of the underlying provisioned database instances, or per ACU-hour for Aurora Serverless (as of 2026-11).
false_statement: RDS Proxy is billed per client connection-hour through the proxy, whatever the size of the underlying database instances (as of 2026-11).
explanation: Proxy cost scales with the capacity of the database it fronts, billed in 1-second increments with a 10-minute minimum. Extra endpoints add separately billed PrivateLink interface endpoints.
