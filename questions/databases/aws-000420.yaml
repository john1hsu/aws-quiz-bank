id: aws-000420
product_area: databases
true_statement: Aurora Global Database switchover is for healthy clusters and loses no data, while managed failover promotes a secondary without waiting for sync, so RPO is non-zero.
false_statement: Aurora Global Database managed failover is for healthy clusters and loses no data, while switchover promotes a secondary without waiting for sync, so RPO is non-zero.
explanation: 'Switchover waits for the target secondary to catch up before swapping roles. Managed failover is the outage path: it promotes immediately and accepts losing the last seconds of writes.'
