id: aws-000141
product_area: databases
true_statement: When an Aurora writer fails, promoting a replica typically restores service in under 60 seconds, while a cluster with no replicas typically needs under 10 minutes to recreate it.
false_statement: When an Aurora writer fails, promoting a replica typically restores service in under 10 minutes, while a cluster with no replicas typically needs under 60 seconds to recreate it.
explanation: Promoting an existing reader is fast because it already shares the cluster volume. Without one, Aurora has to recreate the primary in the same AZ, which is slower, so AWS recommends at least one replica in another AZ.
