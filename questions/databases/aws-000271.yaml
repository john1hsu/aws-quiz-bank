id: aws-000271
product_area: databases
true_statement: A DynamoDB MRSC global table spans exactly three Regions, either three replicas or two replicas plus a witness that serves no reads or writes.
false_statement: A DynamoDB MRSC global table spans exactly two Regions, either two replicas or one replica plus a witness that serves no reads or writes.
explanation: Strongly consistent multi-Region tables are fixed at three Regions. A DynamoDB-managed witness can stand in for one replica, storing data without serving traffic.
