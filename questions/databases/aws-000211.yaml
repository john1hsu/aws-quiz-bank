id: aws-000211
product_area: databases
true_statement: AWS positions Amazon ElastiCache for ephemeral caching and Amazon MemoryDB as a durable primary in-memory database.
false_statement: AWS positions Amazon MemoryDB for ephemeral caching and Amazon ElastiCache as a durable primary in-memory database.
explanation: Both are in-memory services, but MemoryDB is meant to be the durable system of record, while ElastiCache is a cache in front of another store. The false statement reverses their roles.
