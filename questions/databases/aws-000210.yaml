id: aws-000210
product_area: databases
true_statement: In AWS's database decision guide, Amazon Keyspaces is the wide-column option for Apache Cassandra workloads and Amazon DocumentDB is the MongoDB-compatible document option.
false_statement: In AWS's database decision guide, Amazon DocumentDB is the wide-column option for Apache Cassandra workloads and Amazon Keyspaces is the MongoDB-compatible document option.
explanation: Keyspaces is AWS's managed Cassandra-compatible wide-column store, while DocumentDB stores JSON-like documents with MongoDB compatibility. The false statement swaps the two.
