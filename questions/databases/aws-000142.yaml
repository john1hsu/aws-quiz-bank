id: aws-000142
product_area: databases
true_statement: AWS's rule of thumb is to choose Aurora I/O-Optimized once I/O makes up about 25% or more of total Aurora spend.
false_statement: AWS's rule of thumb is to choose Aurora Standard once I/O makes up about 25% or more of total Aurora spend.
explanation: I/O-Optimized drops per-request I/O charges in exchange for higher storage and compute rates, so it pays off when I/O is a large share of the bill. Standard, which bills every I/O, suits workloads where I/O is a small share.
