id: aws-000574
product_area: databases
true_statement: The default quota of 40 DB instances per account per Region is shared by Amazon RDS, Aurora, Neptune and DocumentDB instances (as of 2026-11).
false_statement: The default quota of 40 DB instances per account per Region applies to Aurora on its own, separate from RDS, Neptune and DocumentDB (as of 2026-11).
explanation: All four engines draw from one instance pool, so accounts running several of them can hit the limit quickly. Request an increase before a migration rather than during it.
