id: aws-000647
product_area: databases
true_statement: A calculated DynamoDB shard suffix, such as a hash of an order ID, lets a point read recompute the key and use GetItem, while a random suffix forces reads across every suffix.
false_statement: A random DynamoDB shard suffix, such as 1–200 picked at write time, lets a point read recompute the key and use GetItem, while a calculated suffix forces reads across every suffix.
explanation: When the suffix is derived from a queried attribute, the reader can work it out again and fetch one item directly. A random suffix spreads writes just as well but leaves the reader querying all shards and merging.
