id: aws-000644
product_area: databases
true_statement: Each Neptune Capacity Unit in Neptune Serverless is 2 GiB of memory with matching vCPU and networking, and capacity can range up to 128 NCUs.
false_statement: Each Neptune Capacity Unit in Neptune Serverless is 8 GiB of memory with matching vCPU and networking, and capacity can range up to 128 NCUs.
explanation: Neptune Serverless scales in NCUs of 2 GiB of memory each, between a minimum of at least 1 NCU and a maximum of up to 128. 8 GiB overstates the unit.
