true_statement: In Amazon Neptune, property graphs are queried with Gremlin or openCypher, while RDF graphs are queried with SPARQL.
false_statement: In Amazon Neptune, RDF graphs are queried with Gremlin or openCypher, while property graphs are queried with SPARQL.
explanation: 'Neptune''s two graph models have their own languages: Gremlin and openCypher both work on the same property graph, and SPARQL is the W3C language for RDF. The false statement swaps them.'
