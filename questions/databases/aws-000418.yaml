id: aws-000418
product_area: databases
true_statement: Amazon DocumentDB elastic clusters hash-partition data by a shard key across up to 32 shards, each with its own writer and up to 15 replicas.
false_statement: Amazon DocumentDB elastic clusters hash-partition data by a shard key across up to 32 shards, all sending writes through one cluster-wide primary.
explanation: Elastic clusters scale writes by giving every shard its own writer instance. They are meant for workloads whose write rate or data volume is too much for a single primary.
