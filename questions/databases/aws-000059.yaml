id: aws-000059
product_area: databases
true_statement: One DynamoDB write capacity unit covers one write of up to 1 KB, while one read capacity unit covers one strongly consistent read of up to 4 KB.
false_statement: One DynamoDB write capacity unit covers one write of up to 4 KB, while one read capacity unit covers one strongly consistent read of up to 1 KB.
explanation: Writes are sized in 1 KB units and reads in 4 KB units; an eventually consistent read uses half a unit. The false statement swaps the two sizes.
