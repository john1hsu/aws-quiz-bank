id: aws-000272
product_area: databases
true_statement: DynamoDB charges no cross-Region data transfer for replication between a global table's Regions, but bills replicated write units in every Region that holds a replica.
false_statement: DynamoDB bills no replicated write units for a global table's replicas, but charges cross-Region data transfer for replication between its Regions.
explanation: Global table cost comes from replicated writes, charged per 1 KB in each replica Region at normal write-unit prices. Inter-Region replication traffic itself is not billed.
