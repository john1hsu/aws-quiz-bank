id: aws-000648
product_area: databases
true_statement: High-cardinality values such as user IDs make good DynamoDB partition keys, while status codes or creation dates rounded to a day concentrate traffic.
false_statement: Low-cardinality values such as status codes make good DynamoDB partition keys, while user IDs or other unique identifiers concentrate traffic.
explanation: Capacity spreads evenly when the workload touches many distinct key values. A handful of statuses or a single day's date funnels requests onto few partitions and invites throttling.
