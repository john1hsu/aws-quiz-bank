id: aws-000062
product_area: databases
true_statement: Amazon RDS keeps automated backups for 7 days by default and can retain them for up to 35 days.
false_statement: Amazon RDS keeps automated backups for 1 day by default and can retain them for up to 7 days.
explanation: The default retention is 7 days, adjustable up to 35; setting it to 0 turns automated backups off. Manual snapshots are kept until deleted.
