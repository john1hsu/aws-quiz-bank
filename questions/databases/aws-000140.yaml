id: aws-000140
product_area: databases
true_statement: Aurora synchronously writes each change to six storage nodes spread across Availability Zones, even if every DB instance in the cluster sits in one AZ.
false_statement: Aurora synchronously writes each change to two storage nodes in the writer's Availability Zone, unless the cluster's DB instances span several AZs.
explanation: Aurora's durability comes from the shared cluster volume, which always keeps six copies across AZs in the Region. Instance placement affects failover, not how many storage copies exist.
