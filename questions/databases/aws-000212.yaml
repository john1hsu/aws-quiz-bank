id: aws-000212
product_area: databases
true_statement: Amazon Timestream for LiveAnalytics closed to new customers on June 20, 2025, and AWS points new customers to Timestream for InfluxDB.
false_statement: Amazon Timestream for InfluxDB closed to new customers on June 20, 2025, and AWS points new customers to Timestream for LiveAnalytics.
explanation: LiveAnalytics is the edition that stopped taking new customers; existing workloads keep running. Timestream for InfluxDB is the recommended path for new time-series workloads.
