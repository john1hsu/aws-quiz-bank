id: aws-000421
product_area: databases
true_statement: Aurora Global Database replicates in the cluster storage layer, so replication barely uses the primary's compute and typically lags by under one second.
false_statement: Aurora Global Database replicates through the database engine's binlog, so replication uses the primary's compute and typically lags by under one second.
explanation: Cross-Region copies are shipped by dedicated storage-layer infrastructure rather than by the engine. Replication is asynchronous, so primary commits don't wait for the secondaries.
