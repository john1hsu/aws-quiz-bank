product_area: databases
true_statement: A single table can reach 64 TiB on Aurora MySQL but only 32 TiB on Aurora PostgreSQL, and neither limit can be raised.
false_statement: A single table can reach 32 TiB on Aurora MySQL but as much as 64 TiB on Aurora PostgreSQL, and neither limit can be raised.
explanation: 'Table size is an engine constraint: 64 TiB for Aurora MySQL and 32 TiB for Aurora PostgreSQL. Engine constraints like this are fixed, unlike most Aurora resource counts.'
