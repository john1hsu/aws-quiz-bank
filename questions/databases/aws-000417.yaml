id: aws-000417
product_area: databases
true_statement: A single Amazon DocumentDB document can be at most 16 MiB, and that document limit is fixed rather than adjustable (as of 2026-11).
false_statement: A single Amazon DocumentDB document can be at most 4 MiB, and that document limit is fixed rather than adjustable (as of 2026-11).
explanation: DocumentDB allows documents up to 16 MiB. Document-level limits such as size, nesting depth and indexes per collection can't be raised, unlike the Regional cluster and instance quotas.
