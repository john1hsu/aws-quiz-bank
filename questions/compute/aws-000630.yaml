id: aws-000630
product_area: compute
true_statement: EC2 Image Builder checks that Amazon Inspector is activated only when a pipeline or image is created or updated, so deactivating Inspector later silently drops findings.
false_statement: EC2 Image Builder checks that Amazon Inspector is activated on every build, so deactivating Inspector later makes each following build fail.
explanation: The activation check runs only at create or update time. If Inspector is turned off afterwards, builds keep succeeding but no longer get vulnerability findings.
