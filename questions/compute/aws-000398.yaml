id: aws-000398
product_area: compute
true_statement: In an Elastic Beanstalk worker environment, a daemon on each instance reads messages from an Amazon SQS queue and passes each one to the application.
false_statement: In an Elastic Beanstalk worker environment, a daemon on each instance reads messages from an Amazon SNS topic and passes each one to the application.
explanation: Worker environments are built around an SQS queue, which Elastic Beanstalk creates if you don't provide one, and a per-instance daemon pulls from it. SNS pushes notifications to subscribers and is not the queue a worker tier polls.
