id: aws-000049
product_area: compute
true_statement: When several EC2 Auto Scaling policies trigger at once, the service applies the one that yields the largest capacity, for scale-out and scale-in alike.
false_statement: When several EC2 Auto Scaling policies trigger at once, the service applies the one that yields the smallest capacity, for scale-out and scale-in alike.
explanation: EC2 Auto Scaling resolves conflicting policies in favor of the largest resulting capacity. That bias keeps the group from scaling in too aggressively while another policy still wants capacity.
