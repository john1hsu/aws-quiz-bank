id: aws-000013
product_area: compute
true_statement: Amazon EC2 per-second billing meters usage in one-second increments with a 60-second minimum per instance.
false_statement: Amazon EC2 per-second billing meters usage in one-second increments with a one-hour minimum per instance.
explanation: EC2 bills supported operating systems by the second once the first 60 seconds are charged. A one-hour minimum would make per-second metering pointless for short-lived instances.
