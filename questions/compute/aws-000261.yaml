id: aws-000261
product_area: compute
true_statement: An EC2 spread placement group in a Region allows at most 7 running instances per Availability Zone, so a three-AZ Region supports 21.
false_statement: An EC2 spread placement group in a Region allows at most 7 running instances in total, however many Availability Zones the Region has.
explanation: The spread limit applies per AZ, so it grows with the number of AZs used. Larger fleets need several spread groups, with no guarantee that instances in different groups are apart.
