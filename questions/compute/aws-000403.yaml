id: aws-000403
product_area: compute
true_statement: An Arm-based Graviton EC2 instance can change only to another Arm instance type, because a type change must keep the same processor architecture.
false_statement: An Arm-based Graviton EC2 instance can change to an x86 instance type, because a type change only has to keep the same virtualization type.
explanation: Resizing an instance requires matching processor architecture as well as compatible virtualization. Moving between Arm and x86 means launching a new instance from a suitable AMI instead.
