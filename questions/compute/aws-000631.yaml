id: aws-000631
product_area: compute
true_statement: Savings Plans and Regional Reserved Instances discount On-Demand Capacity Reservations automatically, but zonal Reserved Instance discounts don't apply to them.
false_statement: Savings Plans and zonal Reserved Instances discount On-Demand Capacity Reservations automatically, but Regional Reserved Instance discounts don't apply to them.
explanation: A Capacity Reservation is billed at the On-Demand rate, and Savings Plans or Regional RIs bring that rate down, first for instance usage and then unused slots. Zonal RIs are the exception that doesn't apply.
