id: aws-000194
product_area: compute
true_statement: Each vCPU on an AWS Graviton instance is a full physical core rather than one hyperthread of a shared core.
false_statement: Each vCPU on an AWS Graviton instance is one hyperthread, with two vCPUs sharing every physical core.
explanation: Graviton does not use simultaneous multithreading, so a vCPU maps to a whole core. AWS cites this as one reason for Graviton's efficiency.
