id: aws-000014
product_area: compute
true_statement: Data on an EC2 instance store volume is lost when the instance is stopped, whereas an EBS-backed root volume keeps its data across a stop and start.
false_statement: Data on an EBS-backed root volume is lost when the instance is stopped, whereas an EC2 instance store volume keeps its data across a stop and start.
explanation: Instance store is local, temporary storage tied to the host, so stopping, hibernating or terminating wipes it. EBS is persistent network block storage that survives a stop and start.
