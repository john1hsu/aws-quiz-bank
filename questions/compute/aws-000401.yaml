id: aws-000401
product_area: compute
true_statement: EC2 Flex instances such as M7i-flex have a 40% CPU baseline and can burst to 100% for 95% of a 24-hour window.
false_statement: EC2 Flex instances such as M7i-flex have a 20% CPU baseline and can burst to 100% for 95% of a 24-hour window.
explanation: Flex variants guarantee a 40% CPU baseline, with bursting to full CPU allowed for most of the day. Long stretches above baseline can slowly reduce how much they can burst.
