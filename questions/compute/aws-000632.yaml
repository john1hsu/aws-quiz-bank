id: aws-000632
product_area: compute
true_statement: An open Capacity Reservation, the default, absorbs any matching instance automatically, while a targeted one serves only instances that name it or its resource group.
false_statement: A targeted Capacity Reservation, the default, absorbs any matching instance automatically, while an open one serves only instances that name it or its resource group.
explanation: Open matching is the default and lets any instance with the same attributes consume the reservation. Targeted matching keeps capacity for instances that explicitly point at it.
