id: aws-000262
product_area: compute
true_statement: In an EC2 partition placement group no two partitions share a rack, so AWS suggests matching the partition count to a data store's replication factor.
false_statement: In an EC2 partition placement group each partition sits in its own Availability Zone, so AWS suggests matching the partition count to a data store's replication factor.
explanation: Partitions are isolated at rack level, with separate network and power, inside an AZ. Rack-aware systems such as HDFS or Kafka can then treat the partition number as a rack ID.
