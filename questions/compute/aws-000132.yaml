id: aws-000132
product_area: compute
true_statement: A Network Load Balancer can give each Availability Zone a static IP or an Elastic IP, which makes it the ELB choice when clients need fixed addresses.
false_statement: An Application Load Balancer can give each Availability Zone a static IP or an Elastic IP, which makes it the ELB choice when clients need fixed addresses.
explanation: Static and Elastic IP addresses per zone are a Network Load Balancer feature. Clients reach an ALB through its DNS name, whose node addresses change as it scales.
