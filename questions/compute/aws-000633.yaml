id: aws-000633
product_area: compute
true_statement: On-Demand Capacity Reservations have no count limit of their own; they draw on the Region's On-Demand Instance quota, whether or not instances fill them.
false_statement: On-Demand Capacity Reservations have a count limit of their own per Availability Zone, separate from the Region's On-Demand Instance quota.
explanation: Reserved capacity, used or idle, counts against the same On-Demand Instance quota that running instances use. There is no separate reservation quota to raise.
