id: aws-000263
product_area: compute
true_statement: Only On-Demand Capacity Reservations can reserve capacity inside an EC2 cluster placement group; zonal Reserved Instances cannot.
false_statement: Only zonal Reserved Instances can reserve capacity inside an EC2 cluster placement group; On-Demand Capacity Reservations cannot.
explanation: Capacity Reservations can target a cluster placement group, whereas zonal RIs reserve capacity only in an AZ. No reservation type reserves capacity in partition or spread groups.
