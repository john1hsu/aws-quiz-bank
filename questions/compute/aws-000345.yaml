id: aws-000345
product_area: compute
true_statement: A Nitro Enclave has no persistent storage, no interactive access and no external networking, and it communicates only with its parent instance over a local socket.
false_statement: A Nitro Enclave has no persistent storage and no interactive access, and it communicates with external services through its own elastic network interface.
explanation: Enclaves are isolated VMs carved from the parent's vCPUs and memory, with the parent as their only channel. They get no network interface of their own, which keeps their attack surface minimal.
