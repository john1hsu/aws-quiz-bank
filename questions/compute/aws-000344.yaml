id: aws-000344
product_area: compute
true_statement: Nitro v6 instances cut the default idle timeout for established TCP connections from 432,000 seconds to 350 seconds, so long-lived idle connections need keepalives.
false_statement: Nitro v6 instances raise the default idle timeout for established TCP connections from 350 seconds to 432,000 seconds, so long-lived idle connections no longer need keepalives.
explanation: On Nitro v6 the established-connection idle timeout dropped sharply to 350 seconds. Applications that keep idle connections open must send keepalives or they will be cut off.
