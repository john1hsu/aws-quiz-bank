id: aws-000343
product_area: compute
true_statement: In the AWS Nitro System, Nitro Cards handle VPC networking and EBS I/O, while the Nitro Hypervisor partitions CPU and memory and has no networking stack.
false_statement: In the AWS Nitro System, the Nitro Hypervisor handles VPC networking and EBS I/O, while Nitro Cards partition CPU and memory and have no networking stack.
explanation: Nitro offloads I/O to dedicated cards, leaving a minimal KVM-based hypervisor that only partitions CPU and memory and passes devices through. Keeping networking out of the hypervisor is part of its small attack surface.
