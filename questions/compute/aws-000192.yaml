id: aws-000192
product_area: compute
true_statement: AWS cites savings of up to 90% with Spot Instances and up to 72% with Savings Plans compared with On-Demand pricing (as of 2026-11).
false_statement: AWS cites savings of up to 72% with Spot Instances and up to 90% with Savings Plans compared with On-Demand pricing (as of 2026-11).
explanation: Spot offers the deepest discount because the capacity can be reclaimed. Savings Plans trade a usage commitment for a smaller maximum discount, so the false statement swaps the two figures.
