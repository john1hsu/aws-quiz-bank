id: aws-000402
product_area: compute
true_statement: EC2 dedicates CPU, memory and instance storage to each instance, while network and disk subsystems are shared among instances on the same host.
false_statement: EC2 dedicates network and disk subsystems to each instance, while CPU, memory and instance storage are shared among instances on the same host.
explanation: Compute, memory and local instance storage belong to the instance alone. The I/O paths for network and disk are shared, and types rated for higher I/O get a bigger and steadier share.
