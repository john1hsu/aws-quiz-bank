id: aws-000051
product_area: compute
true_statement: By default, an EC2 Auto Scaling warm pool is sized to the group's maximum capacity minus its desired capacity.
false_statement: By default, an EC2 Auto Scaling warm pool is sized to the group's desired capacity minus its minimum capacity.
explanation: The default warm pool holds enough pre-initialized instances to cover the headroom between desired and maximum capacity. That is the room the group could scale out into.
