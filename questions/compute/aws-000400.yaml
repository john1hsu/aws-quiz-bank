id: aws-000400
product_area: compute
true_statement: Elastic Beanstalk's default quota of 1,000 application versions is shared by all applications in an account's Region, not counted per application.
false_statement: Elastic Beanstalk's default quota of 1,000 application versions is counted per application, not shared by all applications in an account's Region.
explanation: The application-version limit is a single Regional pool for the account. An account that hits it must delete versions by hand, because the version lifecycle policy only runs after a new version is created.
