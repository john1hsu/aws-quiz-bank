id: aws-000195
product_area: compute
true_statement: Graviton-based EC2 instances run Linux rather than Windows, so .NET Framework applications must be ported to modern .NET first.
false_statement: Graviton-based EC2 instances run Windows Server as well as Linux, so .NET Framework applications can move to them unchanged.
explanation: Graviton EC2 targets Linux and BSD workloads that can be rebuilt for Arm64. Windows workloads, and .NET Framework code that has not been ported, are reasons to stay on x86.
