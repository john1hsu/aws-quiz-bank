id: aws-000564
product_area: compute
true_statement: An AMI copy can encrypt an unencrypted image with an AWS KMS key, but an encrypted AMI can never be copied to an unencrypted one.
false_statement: An AMI copy can decrypt an encrypted image into an unencrypted one, but an unencrypted AMI can never be encrypted during a copy.
explanation: Encryption can be added when copying, not removed. Copying a shared encrypted AMI across accounts also needs the owner to share both the snapshots and the KMS key.
