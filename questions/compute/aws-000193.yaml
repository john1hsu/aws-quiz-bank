id: aws-000193
product_area: compute
true_statement: AWS Lambda's default concurrency quota is 1,000 executions per account per Region, and the quota can be adjusted.
false_statement: AWS Lambda's default concurrency quota is 1,000 executions per function per Region, and the quota can be adjusted.
explanation: The 1,000-execution default is shared by all functions in an account within one Region. Treating it as a per-function allowance overstates how much concurrency an account has before requesting an increase.
