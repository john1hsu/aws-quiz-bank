id: aws-000562
product_area: compute
true_statement: A deprecated AMI can still be launched by anyone who knows its ID, while a disabled AMI blocks all new launches until it is re-enabled.
false_statement: A disabled AMI can still be launched by anyone who knows its ID, while a deprecated AMI blocks all new launches until it is re-enabled.
explanation: Deprecation only hides the image from listings, so launch templates and Auto Scaling groups that reference it keep working. Disabling stops every new launch and makes a shared AMI private, reversibly.
