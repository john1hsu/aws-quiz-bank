id: aws-000629
product_area: compute
true_statement: EC2 Image Builder distributes a new image only after every configured test passes in the test stage, which runs on an instance launched from that image.
false_statement: EC2 Image Builder distributes a new image as soon as the build stage finishes, and runs the configured tests afterwards on the instances that launch from it.
explanation: Each pipeline run builds on a temporary instance, then launches a fresh instance from the new image to run test components. Distribution waits for all tests to pass.
