id: aws-000399
product_area: compute
true_statement: Elastic Beanstalk's rolling with additional batch policy launches an extra batch first so capacity stays full, while the plain rolling policy reduces capacity by one batch.
false_statement: Elastic Beanstalk's plain rolling policy launches an extra batch first so capacity stays full, while the rolling with additional batch policy reduces capacity by one batch.
explanation: The extra batch is what keeps full capacity during a rolling-with-additional-batch deployment. Plain rolling just takes one batch at a time out of service, so capacity dips by that batch.
