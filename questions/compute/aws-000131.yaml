id: aws-000131
product_area: compute
true_statement: Cross-zone load balancing is always on at the load balancer level for Application Load Balancers but off by default for Network and Gateway Load Balancers.
false_statement: Cross-zone load balancing is always on at the load balancer level for Network and Gateway Load Balancers but off by default for Application Load Balancers.
explanation: ALBs spread requests across zones by default (it can be turned off per target group). NLBs and GWLBs keep traffic in the receiving zone unless you enable cross-zone balancing, so the false statement swaps the defaults.
