id: aws-000697
product_area: compute
true_statement: With IMDSv2, a caller first sends a PUT request to get a session token, then includes that token in a header on each GET for instance metadata.
false_statement: With IMDSv2, a caller first sends a GET request to get a session token, then includes that token in the query string of each PUT for instance metadata.
explanation: 'IMDSv2 is session-based: a PUT to the token path returns a token with a TTL, which goes in the X-aws-ec2-metadata-token header on later GETs. Many open WAFs and proxies don''t forward PUT, which helps block abuse.'
