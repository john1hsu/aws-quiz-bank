id: aws-000015
product_area: compute
true_statement: Amazon EC2 On-Demand instance quotas are set per Region and measured in vCPUs rather than in numbers of instances.
false_statement: Amazon EC2 On-Demand instance quotas are set per account globally and measured in numbers of running instances rather than vCPUs.
explanation: EC2 quotas are Regional and count the vCPUs of running instances in a quota group. They are not a global count of instances, which is why one large instance can use up a small quota.
