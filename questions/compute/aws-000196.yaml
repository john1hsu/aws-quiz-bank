id: aws-000196
product_area: compute
true_statement: In an EC2 instance name such as M8gd, the g marks a Graviton processor and the d marks local NVMe storage.
false_statement: In an EC2 instance name such as M8gd, the g marks local NVMe storage and the d marks a Graviton processor.
explanation: The letter g after the generation number signals Graviton, and an added d signals instance-attached NVMe disks, as in M9gd or C9gd.
