id: aws-000472
product_area: compute
true_statement: A single AWS Batch job queue cannot mix Fargate compute environments with EC2 or EC2 Spot compute environments.
false_statement: A single AWS Batch job queue cannot mix On-Demand EC2 compute environments with EC2 Spot compute environments.
explanation: Fargate and Fargate Spot environments must sit in their own queues apart from EC2-based ones. EC2 On-Demand and Spot environments can share a queue in priority order.
