id: aws-000470
product_area: compute
true_statement: AWS Batch has no charge of its own; you pay only for the EC2 instances, Fargate tasks or other resources it launches to run your jobs.
false_statement: AWS Batch charges a fee per submitted job on top of the EC2 instances, Fargate tasks or other resources it launches to run your jobs.
explanation: Batch is a free scheduler in every Region. Costs come from the underlying compute, where Spot, Savings Plans, Reserved Instances and Fargate pricing apply as usual.
