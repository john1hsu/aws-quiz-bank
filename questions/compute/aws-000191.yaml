id: aws-000191
product_area: compute
true_statement: AWS App Runner is no longer open to new customers, and AWS points new container web apps to Amazon ECS Express Mode instead.
false_statement: Amazon ECS Express Mode is no longer open to new customers, and AWS points new container web apps to AWS App Runner instead.
explanation: App Runner gets no new features and is closed to new customers, though existing customers can keep creating services. ECS Express Mode is the suggested path, provisioning a Fargate service, an ALB and auto scaling from one API call.
