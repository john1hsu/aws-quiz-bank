id: aws-000471
product_area: compute
true_statement: AWS Batch's default BEST_FIT allocation strategy waits when the cheapest fitting instance type is unavailable, while BEST_FIT_PROGRESSIVE moves on to other types.
false_statement: AWS Batch's default BEST_FIT_PROGRESSIVE allocation strategy waits when the cheapest fitting instance type is unavailable, while BEST_FIT moves on to other types.
explanation: BEST_FIT is the default and sticks to the cheapest type that fits, so jobs can wait for capacity. BEST_FIT_PROGRESSIVE tries additional types instead, and may overshoot maxvCpus by up to one instance.
