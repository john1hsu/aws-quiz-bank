id: aws-000628
product_area: compute
true_statement: EC2 Image Builder has no charge of its own; you pay only for the EC2 instances, EBS snapshots, ECR storage, Inspector scans and other resources a build uses.
false_statement: EC2 Image Builder charges a fee per image pipeline run, on top of the EC2 instances, EBS snapshots, ECR storage, Inspector scans and other resources a build uses.
explanation: The service itself is free, and even creating a pipeline costs nothing until a build runs. The bill comes from the resources used to build, test, store and scan images.
