id: aws-000563
product_area: compute
true_statement: Public AMIs are deprecated two years after creation by default, while private AMIs can be given a deprecation date up to 10 years ahead.
false_statement: Public AMIs are deprecated one year after creation by default, while private AMIs can be given a deprecation date up to 10 years ahead.
explanation: The automatic deprecation for public images arrives at the two-year mark. Deprecating does not stop the snapshot storage charges behind an AMI; only deregistering and deleting snapshots does.
