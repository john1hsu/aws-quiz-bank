id: aws-000426
product_area: global-infrastructure
true_statement: Each AWS Outpost is an extension of a single Availability Zone in its parent Region, linked back to that Region by a service link.
false_statement: Each AWS Outpost is an extension of every Availability Zone in its parent Region, linked back to that Region by a service link.
explanation: An Outpost is anchored to one AZ of its parent Region, and you create VPC subnets on it from that Region's VPC. The service link carries its management and control traffic.
