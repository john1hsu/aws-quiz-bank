id: aws-000071
product_area: global-infrastructure
true_statement: A standard AWS Organizations organization cannot manage AWS GovCloud (US) accounts, so you end up with one organization per partition.
false_statement: A standard AWS Organizations organization can manage AWS GovCloud (US) accounts as members alongside commercial accounts in a single organization.
explanation: Partitions are separate identity and governance domains, so GovCloud accounts belong to a separate organization created inside GovCloud. A commercial organization cannot hold them.
