id: aws-000072
product_area: global-infrastructure
true_statement: Features such as S3 Cross-Region Replication and Transit Gateway inter-Region peering work only between Regions in the same partition.
false_statement: Features such as S3 Cross-Region Replication and Transit Gateway inter-Region peering work between Regions in different partitions, such as commercial and GovCloud (US).
explanation: The partition is a hard boundary with its own IAM, so cross-Region features stop at its edge. Integrating across partitions has to be planned at the network or API layer with separate credentials.
