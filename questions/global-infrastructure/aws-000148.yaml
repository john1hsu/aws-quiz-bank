id: aws-000148
product_area: global-infrastructure
true_statement: In AWS's static stability example, a workload that needs six instances runs three in each of three AZs, so losing one AZ requires no scaling.
false_statement: In AWS's static stability example, a workload that needs six instances runs two in each of three AZs and relies on auto scaling if one AZ is lost.
explanation: Static stability pre-provisions about 50% extra capacity (nine instances) because scaling during an AZ event depends on the EC2 control plane and takes time. Relying on auto scaling is exactly what the pattern avoids.
