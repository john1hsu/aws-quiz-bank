id: aws-000488
product_area: global-infrastructure
true_statement: AWS encrypts all data that crosses its global network between Regions at the physical layer before the data leaves AWS-secured facilities.
false_statement: AWS encrypts data that crosses its global network between Regions only when the customer applies TLS or a VPN before it leaves AWS facilities.
explanation: Inter-Region backbone traffic is encrypted by AWS automatically, and inter-AZ traffic is encrypted too. Customer TLS or VPN adds another layer on top rather than being the only protection.
