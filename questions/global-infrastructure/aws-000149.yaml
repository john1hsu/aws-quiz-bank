product_area: global-infrastructure
true_statement: The control planes of IAM, Route 53 and CloudFront run in us-east-1, while the AWS Global Accelerator control plane runs in us-west-2.
false_statement: The control planes of IAM, Route 53 and CloudFront run in us-west-2, while the AWS Global Accelerator control plane runs in us-east-1.
explanation: Most global services keep a single-Region control plane in us-east-1, including IAM, Organizations, Route 53 and CloudFront. Global Accelerator is the exception AWS names, with its control plane in us-west-2.
