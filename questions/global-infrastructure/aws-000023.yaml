id: aws-000023
product_area: global-infrastructure
true_statement: AWS Regions launched after 20 March 2019 are opt-in and stay disabled until you enable them; Regions launched before that date are enabled by default.
false_statement: AWS Regions launched before 20 March 2019 are opt-in and stay disabled until you enable them; Regions launched after that date are enabled by default.
explanation: The older Regions, such as us-east-1, are on by default and cannot be disabled. Newer Regions are hidden and disabled until an account opts in, which is free.
