id: aws-000151
product_area: global-infrastructure
true_statement: AWS Outposts needs Enterprise Support or Enterprise On-Ramp, and the customer supplies its power and redundant networking.
false_statement: AWS Local Zones need Enterprise Support or Enterprise On-Ramp, and the customer supplies their power and redundant networking.
explanation: Outposts sit in a facility the customer chooses, so the customer provides power and networking and must hold one of those support plans. Local Zone capacity and facilities are owned by AWS, which is one reason AWS prefers them when both fit.
