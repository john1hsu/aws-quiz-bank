id: aws-000425
product_area: global-infrastructure
true_statement: If an Outpost loses its service link, running EC2 instances keep serving local traffic, but control-plane calls such as launching or stopping instances fail.
false_statement: If an Outpost loses its service link, running EC2 instances keep serving local traffic, and a local control plane keeps launching and stopping instances.
explanation: Outposts depend on the parent Region for control-plane operations, so they aren't designed to run disconnected. Existing instances and EBS volumes keep working, and metrics and logs are cached for up to 7 days.
