id: aws-000361
product_area: global-infrastructure
true_statement: On Amazon EC2 the customer patches the guest operating system, while on Amazon DynamoDB AWS runs the operating system and platform for the customer.
false_statement: On Amazon DynamoDB the customer patches the guest operating system, while on Amazon EC2 AWS runs the operating system and platform for the customer.
explanation: EC2 is an infrastructure service, so the guest OS, installed software and security groups are the customer's. DynamoDB is abstracted, leaving the customer only data, encryption choices and IAM permissions.
