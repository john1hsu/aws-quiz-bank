id: aws-000486
product_area: global-infrastructure
true_statement: Most AWS services are Regional, so a service or price available in one Region can't be assumed to exist in another.
false_statement: Most AWS services are global, so a service or price available in one Region can be assumed to exist in every other Region.
explanation: Customers choose a Region for each workload, and availability and pricing vary between Regions. That is why Region choice affects latency, data residency and cost.
