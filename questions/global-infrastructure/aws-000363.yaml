id: aws-000363
product_area: global-infrastructure
true_statement: AWS Lambda functions packaged as container images receive runtime patches only after the customer rebuilds from the latest base image and redeploys.
false_statement: AWS Lambda functions packaged as container images receive runtime patches automatically from Lambda in Auto update mode, with no rebuild or redeploy needed.
explanation: Auto update mode applies to Lambda's managed runtimes. A container image bundles its own runtime, so patching it is the customer's job of rebuilding and redeploying.
