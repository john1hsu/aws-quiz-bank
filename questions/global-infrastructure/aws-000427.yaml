id: aws-000427
product_area: global-infrastructure
true_statement: Data sent from an Outpost to its parent Region is free, while data sent from the Region into the Outpost is charged at Region transfer rates.
false_statement: Data sent from the parent Region into an Outpost is free, while data sent from the Outpost to the Region is charged at Region transfer rates.
explanation: Outposts follow the usual AWS pattern of charging traffic that leaves the Region, so Region-to-Outpost transfer is billed. Outpost-to-Region traffic and traffic out through the local gateway cost nothing.
