true_statement: CloudFront regional edge caches sit inside AWS Regions, between origin servers and the points of presence that serve viewers.
false_statement: CloudFront regional edge caches sit inside ISP networks, closer to viewers than the points of presence that connect back to origins.
explanation: RECs are the mid tier located in Regions. The tier embedded in ISP networks, closest to viewers, is the embedded PoP.
