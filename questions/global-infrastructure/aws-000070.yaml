id: aws-000070
product_area: global-infrastructure
true_statement: The partition identifier, such as aws or aws-us-gov, is the second field of every Amazon Resource Name (ARN).
false_statement: The partition identifier, such as aws or aws-us-gov, is the fourth field of every Amazon Resource Name (ARN), after the service and Region.
explanation: 'ARNs follow arn:partition:service:region:account-id:resource-id, so the partition comes right after the arn prefix. Hard-coding arn:aws: breaks templates deployed into other partitions.'
