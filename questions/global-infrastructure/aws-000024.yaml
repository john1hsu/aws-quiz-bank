id: aws-000024
product_area: global-infrastructure
true_statement: Disabling an opt-in AWS Region removes IAM access to its resources but does not delete them, so they keep incurring charges.
false_statement: Disabling an opt-in AWS Region deletes the resources in it, so they stop incurring charges.
explanation: Disabling only cuts off access through IAM; resources in the Region remain and continue to bill. They should be removed before the Region is disabled.
