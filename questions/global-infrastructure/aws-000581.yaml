id: aws-000581
product_area: global-infrastructure
true_statement: Instances in two Wavelength Zones of the same VPC cannot reach each other, so AWS recommends one VPC per zone joined by a transit gateway.
false_statement: Instances in two Wavelength Zones of the same VPC cannot reach each other, so AWS recommends one VPC per zone joined by a carrier gateway.
explanation: Cross-zone traffic is blocked within a VPC, so each zone gets its own VPC linked through Transit Gateway, attached via a subnet in the parent AZ. A carrier gateway connects to the carrier network, not between VPCs.
