id: aws-000279
product_area: global-infrastructure
true_statement: You use an AWS Local Zone by extending a VPC from its parent Region with a subnet in the zone, so the zone's subnet joins the same VPC.
false_statement: You use an AWS Local Zone by creating a separate VPC inside the zone and peering it with a VPC in the parent Region.
explanation: A Local Zone is an extension of its parent Region. You add a subnet there to an existing VPC, and its gateways and route tables carry over as for any other subnet.
