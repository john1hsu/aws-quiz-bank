product_area: global-infrastructure
true_statement: For single-tenant managed services such as Amazon RDS the customer picks when AWS-built patches apply, while multi-tenant services such as DynamoDB are patched with no customer action.
false_statement: For multi-tenant services such as DynamoDB the customer picks when AWS-built patches apply, while single-tenant managed services such as Amazon RDS are patched with no customer action.
explanation: With RDS, ElastiCache or OpenSearch Service, AWS releases patches but the customer schedules them through maintenance windows or restarts. Multi-tenant services like S3 and DynamoDB are patched entirely by AWS.
