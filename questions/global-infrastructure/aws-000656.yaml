true_statement: AWS estimates roughly 3–6 months from data center handover to a running AWS AI Factory, after a site readiness assessment.
false_statement: AWS estimates roughly 3–6 days from data center handover to a running AWS AI Factory, after a site readiness assessment.
explanation: An AI Factory is a physical build-out of accelerators and networking in the customer's site, so lead time is measured in months and depends on configuration and component availability.
