id: aws-000490
product_area: global-infrastructure
true_statement: Data sent out over AWS Direct Connect to a remote Region is billed at the rate of the Region the data leaves, not the connection's associated Region.
false_statement: Data sent out over AWS Direct Connect to a remote Region is billed at the rate of the connection's associated Region, not the Region the data leaves.
explanation: A Direct Connect location can reach other public Regions over the backbone, but outbound transfer is still metered by the source Region. Backbone transport does not make that traffic free.
