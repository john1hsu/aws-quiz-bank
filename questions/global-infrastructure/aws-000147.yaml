id: aws-000147
product_area: global-infrastructure
true_statement: Amazon S3 and DynamoDB replicate data across Availability Zones for you, while Amazon RDS and ElastiCache need Multi-AZ switched on.
false_statement: Amazon RDS and ElastiCache replicate data across Availability Zones for you, while Amazon S3 and DynamoDB need Multi-AZ switched on.
explanation: Services such as S3, EFS, Aurora, DynamoDB and SQS spread data across AZs automatically. RDS, Redshift and ElastiCache are single-AZ until you enable Multi-AZ, so the false statement reverses the two groups.
