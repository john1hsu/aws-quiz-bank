id: aws-000150
product_area: global-infrastructure
true_statement: Global services' data planes keep working when their control planes are impaired, so AWS advises keeping control-plane calls out of failover and recovery paths.
false_statement: Global services' control planes keep working when their data planes are impaired, so AWS advises keeping data-plane calls out of failover and recovery paths.
explanation: Data-plane functions such as IAM authentication and Route 53 DNS resolution are distributed and stay up. Creating or changing resources depends on a single-Region control plane, so recovery should not rely on it.
