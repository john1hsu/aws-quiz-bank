id: aws-000280
product_area: global-infrastructure
true_statement: Opting in to an AWS Local Zone group is self-service, but disabling a zone group requires an AWS Support case after its resources are deleted.
false_statement: Opting in to an AWS Local Zone group requires an AWS Support case, but disabling a zone group is self-service once its resources are deleted.
explanation: Zone groups are enabled from AWS Global View or the ModifyAvailabilityZoneGroup API. Turning one off is not self-service and goes through Support.
