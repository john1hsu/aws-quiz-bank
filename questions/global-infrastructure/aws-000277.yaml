id: aws-000277
product_area: global-infrastructure
true_statement: AWS Global Accelerator announces static anycast IP addresses from edge locations and terminates client TCP connections at the edge before reaching regional endpoints.
false_statement: AWS Global Accelerator announces static anycast IP addresses from each Region and passes client TCP connections straight through to regional endpoints unterminated.
explanation: Clients enter AWS at the nearest edge location, where Global Accelerator ends the TCP connection and opens a new one to the endpoint, keeping the traffic on the AWS backbone.
