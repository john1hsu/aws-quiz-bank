id: aws-000278
product_area: global-infrastructure
true_statement: Edge locations host services such as CloudFront and Route 53 for you; you cannot choose them to launch EC2 instances or store data as you would a Region.
false_statement: Edge locations host services such as CloudFront and Route 53 and can also be chosen, like a small Region, to launch EC2 instances or store data.
explanation: Edge locations are the entry point for user traffic, not a place to provision compute or storage. For compute near users, AWS points to options such as Local Zones or Outposts.
