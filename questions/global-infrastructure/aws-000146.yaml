id: aws-000146
product_area: global-infrastructure
true_statement: An AZ ID such as use2-az1 is the same physical location in every account, while an AZ name such as us-east-1a can map differently in older accounts.
false_statement: An AZ name such as us-east-1a is the same physical location in every account, while an AZ ID such as use2-az1 can map differently in older accounts.
explanation: AWS mapped AZ names to physical zones per account in its oldest Regions for accounts created before November 2025. AZ IDs are consistent everywhere, which is why cross-account work such as RAM subnet sharing should compare IDs.
