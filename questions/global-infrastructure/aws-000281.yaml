id: aws-000281
product_area: global-infrastructure
true_statement: For high availability with Local Zones, AWS suggests pairing two zones in one parent Region that are anchored to different parent Availability Zones.
false_statement: For high availability with Local Zones, AWS suggests pairing two zones in one parent Region that are anchored to the same parent Availability Zone.
explanation: Each Local Zone relies on a parent AZ for some control-plane operations. Using zones with different parents gives a Multi-AZ design from the control-plane point of view.
