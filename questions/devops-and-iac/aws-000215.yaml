id: aws-000215
product_area: devops-and-iac
true_statement: A CodePipeline manual approval action times out after 7 days by default, and the timeout can be extended to as long as 60 days.
false_statement: A CodePipeline manual approval action times out after 1 hour by default, and the timeout can be extended to as long as 7 days.
explanation: Approvals default to a 7-day window that can be configured up to 60 days. The one-hour timeout is the default for most other action types.
