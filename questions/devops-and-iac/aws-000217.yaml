id: aws-000217
product_area: devops-and-iac
true_statement: In an Amazon RDS Blue/Green Deployment the green environment is read-only by default, because writes to it can cause replication conflicts.
false_statement: In an Amazon RDS Blue/Green Deployment the green environment accepts writes by default, because replication from blue resolves any conflicts.
explanation: Green is kept in sync from blue by replication, so writing to it directly risks conflicts. RDS therefore makes it read-only unless you change that.
