id: aws-000144
product_area: devops-and-iac
true_statement: sam sync can push changes such as Lambda code directly to a service API instead of deploying through CloudFormation, so AWS advises it only for development stacks.
false_statement: sam deploy can push changes such as Lambda code directly to a service API instead of deploying through CloudFormation, so AWS advises it only for development stacks.
explanation: sam sync trades consistency for speed and can drift from the template, which is why AWS keeps it to development. sam deploy always transforms the template and deploys it as a CloudFormation stack, the path recommended for production.
