id: aws-000273
product_area: devops-and-iac
true_statement: AWS Prescriptive Guidance suggests Terraform for multi-cloud or hybrid infrastructure, and CloudFormation or the AWS CDK when infrastructure lives entirely on AWS.
false_statement: AWS Prescriptive Guidance suggests CloudFormation for multi-cloud or hybrid infrastructure, and Terraform or Pulumi when infrastructure lives entirely on AWS.
explanation: CloudFormation and the CDK manage state for you and support new AWS features natively, which suits AWS-only estates. Terraform's provider ecosystem is the reason it is suggested for multi-provider setups.
