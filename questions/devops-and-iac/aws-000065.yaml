id: aws-000065
product_area: devops-and-iac
true_statement: Running cdk bootstrap deploys a CDKToolkit stack holding an S3 bucket for assets, an ECR repository for images and IAM deployment roles.
false_statement: Running cdk bootstrap deploys a CDKToolkit stack holding a DynamoDB table that tracks deployment state and IAM deployment roles.
explanation: The bootstrap stack provides the asset storage CDK publishes to (S3 for files, ECR for container images) plus the roles used to deploy. Deployment state is kept by CloudFormation, not a DynamoDB table.
