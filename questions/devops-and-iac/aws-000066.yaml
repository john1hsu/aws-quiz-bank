id: aws-000066
product_area: devops-and-iac
true_statement: A CDK app has already exited when CloudFormation deploys its stacks, so code that must run during deployment needs a custom resource or the Triggers module.
false_statement: A CDK app keeps running while CloudFormation deploys its stacks, so app code can act on resources as they are created without a custom resource.
explanation: CDK only synthesizes templates and assets; CloudFormation does the provisioning after the app finishes. Logic that must run at deploy time therefore goes into a custom resource or Triggers.
