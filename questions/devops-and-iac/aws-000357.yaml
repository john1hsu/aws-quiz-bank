id: aws-000357
product_area: devops-and-iac
true_statement: AWS CodeBuild sets its concurrent build quotas per compute type, and Linux GPU types default to 0, so GPU builds need a quota increase first.
false_statement: AWS CodeBuild sets one concurrent build quota shared by all compute types, and it defaults high enough that GPU builds run without a quota increase.
explanation: Concurrency is tracked separately for each compute type, and many start at 1 or even 0. Teams moving CI to a new account often see builds queue until they request increases.
