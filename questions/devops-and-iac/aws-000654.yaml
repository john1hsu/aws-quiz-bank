id: aws-000654
product_area: devops-and-iac
true_statement: Instance refresh skip matching compares only launch template versions and AMI IDs, so a change in code pulled by a user-data script goes unnoticed.
false_statement: Instance refresh skip matching compares application code as well as launch template versions and AMI IDs, so a change in code pulled by a user-data script is detected.
explanation: Skip matching decides which instances already match the target configuration by looking at the template version and AMI only. AWS advises turning it off when instances fetch their code at boot.
