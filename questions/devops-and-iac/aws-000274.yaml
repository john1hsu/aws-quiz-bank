id: aws-000274
product_area: devops-and-iac
true_statement: CloudFormation drift detection checks only the resource properties set explicitly in the template or its parameters, not properties left at their defaults.
false_statement: CloudFormation drift detection checks every property of each resource, including properties left at their defaults rather than set in the template.
explanation: Drift is measured against the values the template declares. Properties it never sets are not compared, so changes to them can go unnoticed.
