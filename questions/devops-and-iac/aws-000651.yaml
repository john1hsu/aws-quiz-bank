id: aws-000651
product_area: devops-and-iac
true_statement: AWS's DevOps Guidance became the DevOps Lens in the AWS Well-Architected Tool in March 2024, so teams can self-assess workloads against it.
false_statement: AWS's DevOps Guidance became a paid DevOps assessment service in AWS Trusted Advisor in March 2024, so teams can self-assess workloads against it.
explanation: The guidance, first published in October 2023, was added to the Well-Architected Tool as a lens, which gives improvement plans from a self-assessment. Trusted Advisor isn't where it lives.
