true_statement: 'CloudFormation drift-aware change sets compare three states: the live configuration, the last deployed template and the new template.'
false_statement: 'CloudFormation drift-aware change sets compare two states: the last deployed template and the new template, ignoring the live configuration.'
explanation: Adding the live state lets you preview which out-of-band changes a deployment would overwrite and revert them. A plain change set compares only templates.
