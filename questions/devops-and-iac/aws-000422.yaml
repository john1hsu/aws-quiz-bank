id: aws-000422
product_area: devops-and-iac
true_statement: OneAtATime is the default CodeDeploy deployment configuration for the EC2/On-Premises compute platform.
false_statement: HalfAtATime is the default CodeDeploy deployment configuration for the EC2/On-Premises compute platform.
explanation: Unless you choose otherwise, CodeDeploy updates EC2 or on-premises hosts one at a time. HalfAtATime and AllAtOnce are the other predefined options, each defined by a minimum healthy host count.
