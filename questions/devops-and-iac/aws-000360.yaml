product_area: devops-and-iac
true_statement: AWS's DevOps Guidance rates continuous deployment, which removes all manual approvals, as optional, but rates automatically triggered builds as foundational.
false_statement: AWS's DevOps Guidance rates continuous deployment, which removes all manual approvals, as foundational, but rates automatically triggered builds as optional.
explanation: Automatic build triggering is a baseline CI practice that gives fast feedback. Removing every approval is left optional because regulated organizations may need to keep approval steps.
