id: aws-000069
product_area: devops-and-iac
true_statement: If stack creation fails, AWS CloudFormation by default rolls back by deleting the resources it had created.
false_statement: If stack creation fails, AWS CloudFormation by default keeps the resources it had created and marks the stack for manual cleanup.
explanation: Automatic rollback is the default behavior for a failed create, so partial stacks do not linger. Rollback can be switched off deliberately when you want to debug the failure.
