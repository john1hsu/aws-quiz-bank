id: aws-000356
product_area: devops-and-iac
true_statement: An AWS CodeBuild build timeout can be set from 5 to 2,160 minutes (36 hours), and neither bound can be raised (as of 2026-11).
false_statement: An AWS CodeBuild build timeout can be set from 5 to 480 minutes (8 hours), and neither bound can be raised (as of 2026-11).
explanation: CodeBuild allows builds of up to 36 hours, a fixed ceiling. Eight hours understates that limit by a wide margin.
