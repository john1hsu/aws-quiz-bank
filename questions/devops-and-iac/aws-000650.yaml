id: aws-000650
product_area: devops-and-iac
true_statement: Amazon's two-pizza team rule caps a team at the size two pizzas can feed, on the view that smaller teams collaborate better and ship faster.
false_statement: Amazon's two-pizza team rule requires every team to include two operations engineers, on the view that shared on-call duty makes teams ship faster.
explanation: 'The rule is about team size: keep teams small enough that two pizzas feed them, since more people add coordination overhead. It says nothing about a fixed number of operations staff.'
