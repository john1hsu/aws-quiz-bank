id: aws-000424
product_area: devops-and-iac
true_statement: Each CodeDeploy deployment group can run only one deployment at a time, a fixed limit, while an account allows 1,300 concurrent deployments by default.
false_statement: Each CodeDeploy account can run only one deployment at a time, a fixed limit, while a deployment group allows 1,300 concurrent deployments by default.
explanation: The one-at-a-time rule applies per deployment group and can't be raised. The account-wide figure of 1,300 concurrent deployments is the adjustable one.
