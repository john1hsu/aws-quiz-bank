true_statement: The CodeDeploy configuration ECSCanary10Percent5Minutes shifts 10% of traffic first and moves the remaining 90% five minutes later.
false_statement: The CodeDeploy configuration ECSCanary10Percent5Minutes shifts another 10% of traffic every five minutes until all traffic has moved.
explanation: 'A canary configuration shifts traffic in two steps: a first slice, then everything else after the wait. Moving equal slices at fixed intervals describes a linear configuration instead.'
