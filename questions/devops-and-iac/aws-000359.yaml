id: aws-000359
product_area: devops-and-iac
true_statement: Amazon's own pipelines deploy first to a single one-box unit and then to production in waves of growing size, waiting a bake time between stages.
false_statement: Amazon's own pipelines deploy first to the largest production Region and then to the rest in waves of shrinking size, waiting a bake time between stages.
explanation: Starting with one box and widening gradually limits the blast radius of a bad change. Automatic rollback on high-severity alarms stops a wave before it reaches the next stage.
