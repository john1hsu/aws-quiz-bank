id: aws-000145
product_area: devops-and-iac
true_statement: sam local invoke needs a container runtime such as Docker, because the SAM CLI runs the function in a container on your machine.
false_statement: sam remote invoke needs a container runtime such as Docker, because the SAM CLI runs the function in a container on your machine.
explanation: Local invocation emulates Lambda in a local container, so a runtime like Docker must be installed. sam remote invoke calls functions that are already deployed in AWS.
