id: aws-000143
product_area: devops-and-iac
true_statement: What marks a CloudFormation template as an AWS SAM template is its declaration of the AWS::Serverless-2016-10-31 transform.
false_statement: What marks a CloudFormation template as an AWS SAM template is its declaration of the AWS::LanguageExtensions transform.
explanation: The serverless transform is what CloudFormation expands into ordinary resources at deployment. AWS::LanguageExtensions is a separate transform that, when used, has to be listed before the serverless one.
