id: aws-000652
product_area: devops-and-iac
true_statement: A failed Elastic Beanstalk immutable update is undone by deleting its temporary Auto Scaling group, so the fleet is never left half-deployed, unlike a failed rolling update.
false_statement: A failed Elastic Beanstalk rolling update is undone by deleting its temporary Auto Scaling group, so the fleet is never left half-deployed, unlike a failed immutable update.
explanation: Immutable updates build the new version in a separate, temporary group and only move it in after health checks pass. Rolling updates change existing instances batch by batch, so a failure can leave a mix of versions.
