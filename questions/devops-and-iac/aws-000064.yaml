id: aws-000064
product_area: devops-and-iac
true_statement: AWS CDK L1 constructs, prefixed Cfn, are generated from the CloudFormation resource specification and map one-to-one to a resource type.
false_statement: AWS CDK L3 constructs, prefixed Cfn, are generated from the CloudFormation resource specification and map one-to-one to a resource type.
explanation: L1 constructs such as CfnBucket mirror CloudFormation resources exactly. L3 constructs are higher-level patterns that combine several resources into an architecture.
