id: aws-000067
product_area: devops-and-iac
true_statement: A single AWS CloudFormation template can declare at most 500 resources, and that quota is not adjustable (as of 2026-11).
false_statement: A single AWS CloudFormation template can declare at most 200 resources, and that quota is not adjustable (as of 2026-11).
explanation: The per-template resource ceiling is 500; 200 is the limit for parameters, mappings and outputs. Reaching 500 resources is the usual cue to split into nested or separate stacks.
