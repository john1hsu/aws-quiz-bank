id: aws-000577
product_area: devops-and-iac
true_statement: Stack-level CloudFormation drift detection skips nested stacks, so each nested stack has to be checked on its own.
false_statement: Stack-level CloudFormation drift detection covers nested stacks too, so one check on the parent stack is enough.
explanation: Detection on a parent stack does not walk into its nested stacks. You run it separately on each nested stack to see their drift.
