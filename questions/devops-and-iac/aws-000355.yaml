true_statement: AWS CodeBuild's Lambda compute mode starts builds faster than EC2 mode but offers only 1–10 GiB of memory with 10 GB of disk.
false_statement: AWS CodeBuild's EC2 compute mode starts builds faster than Lambda mode but offers only 1–10 GiB of memory with 10 GB of disk.
