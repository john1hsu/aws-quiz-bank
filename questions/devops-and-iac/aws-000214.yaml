id: aws-000214
product_area: devops-and-iac
true_statement: CodePipeline caps pipelines that poll their source at 300 per Region, a quota that cannot be raised, so AWS favors event-based change detection.
false_statement: CodePipeline caps pipelines that use event-based change detection at 300 per Region, a quota that cannot be raised, so AWS favors polling the source.
explanation: The general limit is 1,000 pipelines per Region and is adjustable, but polling pipelines have their own fixed cap of 300. Event-based detection avoids that cap.
