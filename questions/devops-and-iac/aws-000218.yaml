id: aws-000218
product_area: devops-and-iac
true_statement: For CodeDeploy blue/green deployments of an ECS service behind a Network Load Balancer, only the ECSAllAtOnce configuration is supported (as of 2026-11).
false_statement: For CodeDeploy blue/green deployments of an ECS service behind a Network Load Balancer, only canary and linear configurations are supported (as of 2026-11).
explanation: Gradual canary and linear shifting is not available for ECS services fronted by an NLB in CodeDeploy; they must shift all traffic at once.
