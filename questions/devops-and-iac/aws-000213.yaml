id: aws-000213
product_area: devops-and-iac
true_statement: CodePipeline V1 costs $1.00 per active pipeline per month, while V2 costs $0.002 per action execution minute (as of 2026-11).
false_statement: CodePipeline V2 costs $1.00 per active pipeline per month, while V1 costs $0.002 per action execution minute (as of 2026-11).
explanation: V1 is the flat-rate type billed per active pipeline; V2 is metered by action execution minutes, with manual approvals and custom actions not charged. The false statement swaps the two pricing models.
