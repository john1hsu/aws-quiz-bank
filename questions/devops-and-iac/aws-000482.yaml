id: aws-000482
product_area: devops-and-iac
true_statement: AWS CodeCommit, de-emphasized in July 2024, was returned to full general availability and reopened to new customers in November 2025.
false_statement: AWS Cloud9, closed to new customers in July 2024, was returned to full general availability and reopened to new customers in November 2025.
explanation: AWS reversed course on CodeCommit, citing customers' use of its IAM, VPC endpoint and pipeline integration, and published a roadmap. Cloud9 remains closed to new customers, with IDE Toolkits and CloudShell as the suggested path.
