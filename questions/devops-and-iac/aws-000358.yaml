id: aws-000358
product_area: devops-and-iac
true_statement: Continuous delivery keeps a manual approval before production, whereas continuous deployment pushes every validated change to production with no human approval.
false_statement: Continuous deployment keeps a manual approval before production, whereas continuous delivery pushes every validated change to production with no human approval.
explanation: Under continuous delivery every change is ready to ship, but a person decides when it goes live. Continuous deployment removes that gate and releases each passing change automatically.
