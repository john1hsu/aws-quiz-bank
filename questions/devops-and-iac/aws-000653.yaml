id: aws-000653
product_area: devops-and-iac
true_statement: Setting both minimum and maximum healthy percentages to 100% makes an EC2 Auto Scaling instance refresh launch each replacement before terminating an old instance.
false_statement: Setting both minimum and maximum healthy percentages to 100% makes an EC2 Auto Scaling instance refresh terminate each old instance before launching its replacement.
explanation: With the minimum at 100%, the group may never drop below full healthy capacity, so a new instance must come up first. Terminating first would briefly reduce capacity below that floor.
