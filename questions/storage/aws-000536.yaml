id: aws-000536
product_area: storage
true_statement: Amazon S3 multipart uploads use parts of 5 MB to 5 GB, apart from a smaller final part, and can have at most 10,000 parts.
false_statement: Amazon S3 multipart uploads use parts of 5 MB to 5 GB, apart from a smaller final part, and can have at most 1,000 parts.
explanation: The fixed multipart limits are a 5 MB to 5 GB part size and up to 10,000 parts per upload. A 1,000-part cap would make 50 TB objects impossible to upload.
