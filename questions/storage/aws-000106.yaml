id: aws-000106
product_area: storage
true_statement: EBS Multi-Attach lets an io1 or io2 volume attach to up to 16 Nitro-based instances at once, while other volume types attach to one instance.
false_statement: EBS Multi-Attach lets a gp3 or gp2 volume attach to up to 16 Nitro-based instances at once, while io1 and io2 volumes attach to one instance.
explanation: 'Multi-Attach is a Provisioned IOPS feature: only io1 and io2 volumes can be shared by up to 16 Nitro instances. General Purpose volumes attach to a single instance.'
