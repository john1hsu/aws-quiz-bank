id: aws-000610
product_area: storage
true_statement: As of 2026-11, an AWS Backup plan can have at most 10 rules, and that limit is fixed, so larger schedules need more plans.
false_statement: As of 2026-11, an AWS Backup plan can have at most 10 rules, and that limit is adjustable through Service Quotas, so larger schedules need a quota increase.
explanation: The rule count belongs to the fixed plan-structure limits, which shape plan design rather than being raised by request. Counts such as vaults and plans per Region are the adjustable ones.
