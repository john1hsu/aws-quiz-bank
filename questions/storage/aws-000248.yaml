id: aws-000248
product_area: storage
true_statement: AWS's storage decision guide notes that a single EBS gp3 volume can reach 64 TiB, 80,000 IOPS and 2,000 MB/s.
false_statement: AWS's storage decision guide notes that a single EBS gp3 volume can reach 16 TiB, 16,000 IOPS and 1,000 MB/s.
explanation: The guide quotes higher gp3 ceilings of 64 TiB, 80,000 IOPS and 2,000 MB/s. The smaller figures understate what one gp3 volume can now do.
