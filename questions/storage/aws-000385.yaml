id: aws-000385
product_area: storage
true_statement: Volume Gateway cached volumes keep the primary copy of data in Amazon S3, while stored volumes keep the full dataset on premises and back up snapshots to AWS.
false_statement: Volume Gateway stored volumes keep the primary copy of data in Amazon S3, while cached volumes keep the full dataset on premises and back up snapshots to AWS.
explanation: Cached mode treats S3 as primary storage and caches hot data locally. Stored mode keeps everything local for low-latency access and sends point-in-time snapshots to AWS asynchronously.
