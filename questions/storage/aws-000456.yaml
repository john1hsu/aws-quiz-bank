id: aws-000456
product_area: storage
true_statement: In Amazon S3 Files, large reads of 1 MiB or more are streamed straight from the bucket, while small files are imported onto the file system's high-performance storage.
false_statement: In Amazon S3 Files, small reads under 1 MiB are streamed straight from the bucket, while large files are imported onto the file system's high-performance storage.
explanation: S3 Files caches small files (under 128 KiB by default) on its fast tier for low-latency repeat reads. Big sequential reads bypass that tier and come directly from S3, billed as normal GET requests.
