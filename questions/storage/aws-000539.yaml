id: aws-000539
product_area: storage
true_statement: S3 Glacier Deep Archive has no Expedited retrieval option; its Standard restores finish within 12 hours and Bulk restores within 48 hours.
false_statement: S3 Glacier Flexible Retrieval has no Expedited retrieval option; its Standard restores finish within 12 hours and Bulk restores within 48 hours.
explanation: Deep Archive is the class without Expedited restores. Flexible Retrieval does offer Expedited (typically 1-5 minutes), with Standard in 3-5 hours and free Bulk in 5-12 hours.
