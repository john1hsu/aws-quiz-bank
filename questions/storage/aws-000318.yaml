id: aws-000318
product_area: storage
true_statement: Amazon FSx for Lustre can link to an Amazon S3 bucket, presenting its objects as files and writing processed results back to the bucket.
false_statement: Amazon FSx for OpenZFS can link to an Amazon S3 bucket, presenting its objects as files and writing processed results back to the bucket.
explanation: The S3 data repository link is a Lustre feature aimed at HPC and ML pipelines. OpenZFS is an NFS file system without that built-in S3 linkage.
