id: aws-000612
product_area: storage
true_statement: Since 2026-09-01, AWS Backup can protect every S3 general purpose bucket up to the account's S3 bucket quota, replacing the earlier cap of 1,000 buckets.
false_statement: Since 2026-09-01, AWS Backup can protect at most 1,000 S3 general purpose buckets per account, regardless of the account's S3 bucket quota.
explanation: The old 1,000-bucket ceiling on AWS Backup's S3 coverage was lifted, so the S3 bucket quota now sets the limit. Custom IAM policies may need new permissions for it.
