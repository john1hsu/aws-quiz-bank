id: aws-000246
product_area: storage
true_statement: For a mixed fleet of Windows and Linux clients, AWS's storage guide points to Amazon FSx for NetApp ONTAP, which serves NFS and SMB at the same time.
false_statement: For a mixed fleet of Windows and Linux clients, AWS's storage guide points to Amazon EFS, which serves NFS and SMB at the same time.
explanation: FSx for NetApp ONTAP is the multiprotocol option in the guide. EFS is recommended for Linux clients over NFS, and FSx for Windows File Server for Windows over SMB.
