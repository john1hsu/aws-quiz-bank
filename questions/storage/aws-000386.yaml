id: aws-000386
product_area: storage
true_statement: Volume Gateway snapshots are stored as Amazon EBS snapshots, so they can be restored as EBS volumes for EC2 but are not reachable through S3 APIs.
false_statement: Volume Gateway snapshots are stored as Amazon S3 objects, so they can be read through S3 APIs but cannot be restored as EBS volumes for EC2.
explanation: Although S3 backs the service, Volume Gateway snapshots surface as EBS snapshots. That makes EC2 recovery possible, while the data itself is not exposed as S3 objects.
