id: aws-000537
product_area: storage
true_statement: Amazon S3 allows up to 50 tags per bucket but only 10 tags per object, and neither limit can be raised (as of 2026-11).
false_statement: Amazon S3 allows up to 10 tags per bucket but as many as 50 tags per object, and neither limit can be raised (as of 2026-11).
explanation: Buckets take 50 tags and objects 10, both fixed quotas. Cost-allocation and retention schemes therefore have to fit inside those hard limits.
