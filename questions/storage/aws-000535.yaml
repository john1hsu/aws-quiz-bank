id: aws-000535
product_area: storage
true_statement: An AWS account can create 10,000 Amazon S3 general purpose buckets by default, and the quota is adjustable through Service Quotas (as of 2026-11).
false_statement: An AWS account can create 100 Amazon S3 general purpose buckets by default, and the quota is adjustable through Service Quotas (as of 2026-11).
explanation: The default general purpose bucket quota is 10,000 per account. The figure of 100 is the default for directory buckets, not general purpose ones.
