id: aws-000316
product_area: storage
true_statement: Amazon FSx for Lustre runs only in a single Availability Zone, and its scratch file systems don't replicate data while its persistent file systems do.
false_statement: Amazon FSx for Lustre runs only in a single Availability Zone, and its persistent file systems don't replicate data while its scratch file systems do.
explanation: Scratch Lustre is meant for temporary, short-lived processing and keeps no replica. Persistent Lustre replicates data within its AZ for longer-lived workloads.
