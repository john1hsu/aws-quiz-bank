id: aws-000611
product_area: storage
true_statement: AWS Backup runs only one backup or copy job against a given resource at a time.
false_statement: AWS Backup runs up to five backup or copy jobs against a given resource at a time.
explanation: 'Jobs against the same resource are serialized: a second backup or copy of it waits until the first finishes. Concurrency limits across many resources are a separate matter.'
