id: aws-000245
product_area: storage
true_statement: A logically air-gapped AWS Backup vault is always locked in compliance mode and can be shared through AWS RAM so other accounts can restore if the owner account is compromised.
false_statement: A logically air-gapped AWS Backup vault is always locked in governance mode and can be shared through AWS RAM so other accounts can restore if the owner account is compromised.
explanation: Air-gapped vaults are built for ransomware recovery, so their lock is fixed in compliance mode, which nobody can lift early. Governance mode would let privileged users in the compromised account remove it.
