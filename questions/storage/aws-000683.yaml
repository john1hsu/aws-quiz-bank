id: aws-000683
product_area: storage
true_statement: EBS quotas on in-flight Elastic Volumes changes count the combined current size or IOPS of the volumes being modified, not the number of modification requests.
false_statement: EBS quotas on in-flight Elastic Volumes changes count the number of modification requests in progress, not the combined size or IOPS of the volumes being modified.
explanation: Because the limit is measured in TiB or IOPS, resizing a few very large volumes at once can use it all up, while many small volumes would not.
