id: aws-000243
product_area: storage
true_statement: An AWS Backup Vault Lock in governance mode can be removed by suitably authorized IAM users, while one in compliance mode becomes unchangeable once its grace time ends.
false_statement: An AWS Backup Vault Lock in compliance mode can be removed by suitably authorized IAM users, while one in governance mode becomes unchangeable once its grace time ends.
explanation: Governance mode is the reversible setting, useful for testing retention rules. After the grace time, a compliance-mode lock cannot be altered or deleted by users or by AWS until retention ends.
