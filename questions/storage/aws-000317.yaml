product_area: storage
true_statement: Within the Amazon FSx family, only FSx for NetApp ONTAP and FSx for Windows File Server support Active Directory authentication and data deduplication.
false_statement: Within the Amazon FSx family, only FSx for OpenZFS and FSx for Windows File Server support Active Directory authentication and data deduplication.
explanation: ONTAP and Windows File Server are the two members with AD integration and deduplication. OpenZFS offers snapshots, clones and compression, but not those two features.
