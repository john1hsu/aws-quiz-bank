id: aws-000035
product_area: storage
true_statement: After a successful PUT or DELETE in Amazon S3, subsequent reads and list operations reflect the change, with strong consistency at no extra cost.
false_statement: After a successful PUT or DELETE in Amazon S3, reads and list operations are eventually consistent unless you pay extra for strong consistency.
explanation: S3 provides strong read-after-write consistency for object operations in all Regions without an extra charge. Only bucket configuration changes are eventually consistent.
