id: aws-000540
product_area: storage
true_statement: S3 Standard-IA and S3 One Zone-IA bill a 30-day minimum storage duration and a 128 KB minimum object size.
false_statement: S3 Standard-IA and S3 One Zone-IA bill a 90-day minimum storage duration and a 128 KB minimum object size.
explanation: The infrequent-access classes carry a 30-day minimum plus per-GB retrieval fees. A 90-day minimum applies to Glacier Instant Retrieval and Glacier Flexible Retrieval instead.
