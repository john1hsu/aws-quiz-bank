id: aws-000244
product_area: storage
true_statement: AWS Backup continuous backups of Amazon S3 allow restoring to any point within the last 35 days, while periodic S3 backups can run as often as hourly.
false_statement: AWS Backup continuous backups of Amazon S3 allow restoring to any point within the last 7 days, while periodic S3 backups can run at most once a day.
explanation: Continuous S3 backup gives a 35-day point-in-time restore window, and periodic backups can be scheduled down to hourly. The false statement shrinks both.
