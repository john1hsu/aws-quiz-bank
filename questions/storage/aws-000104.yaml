id: aws-000104
product_area: storage
true_statement: An Amazon EBS volume can attach only to instances in its own Availability Zone, but its snapshots can be restored into any AZ in the Region.
false_statement: An Amazon EBS volume can attach to instances in any Availability Zone of its Region, but its snapshots can be restored only into the original AZ.
explanation: Volumes are replicated and attached within a single AZ. Snapshots sit in AWS-managed storage replicated across the Region's AZs, which is what makes cross-AZ recovery possible, so the false statement reverses the scopes.
