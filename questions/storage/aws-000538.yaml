id: aws-000538
product_area: storage
true_statement: S3 Intelligent-Tiering moves objects not accessed for 30 consecutive days to its Infrequent Access tier and those untouched for 90 days to Archive Instant Access.
false_statement: S3 Intelligent-Tiering moves objects not accessed for 60 consecutive days to its Infrequent Access tier and those untouched for 180 days to Archive Instant Access.
explanation: The automatic instant tiers kick in at 30 and 90 days without access, and an accessed object returns to Frequent Access with no tiering charge. The 180-day figure belongs to the opt-in Deep Archive Access tier.
