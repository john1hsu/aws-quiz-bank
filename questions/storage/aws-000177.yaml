id: aws-000177
product_area: storage
true_statement: The default Amazon EFS lifecycle policy moves files to Infrequent Access after 30 days without access and to Archive after 90 days.
false_statement: The default Amazon EFS lifecycle policy moves files to Infrequent Access after 90 days without access and to Archive after 180 days.
explanation: EFS tiers untouched files to IA at 30 days and to Archive at 90 days by default. Intelligent-Tiering can bring a file back to Standard when it is read again.
