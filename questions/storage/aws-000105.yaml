id: aws-000105
product_area: storage
true_statement: An EBS gp3 volume gets a baseline of 3,000 IOPS and 125 MiB/s at any size, while gp2 performance scales with size at 3 IOPS per GiB.
false_statement: An EBS gp2 volume gets a baseline of 3,000 IOPS and 125 MiB/s at any size, while gp3 performance scales with size at 3 IOPS per GiB.
explanation: gp3 decouples performance from capacity with a fixed baseline you can provision above. gp2 ties IOPS to volume size and relies on burst credits for small volumes, so the false statement swaps the two types.
