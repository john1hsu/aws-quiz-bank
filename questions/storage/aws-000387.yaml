product_area: storage
true_statement: An archived Tape Gateway tape typically takes 3–5 hours to retrieve from S3 Glacier Flexible Retrieval and about 12 hours from S3 Glacier Deep Archive.
false_statement: An archived Tape Gateway tape typically takes 3–5 hours to retrieve from S3 Glacier Deep Archive and about 12 hours from S3 Glacier Flexible Retrieval.
explanation: Deep Archive is the colder, cheaper shelf, so its retrievals are slower than Flexible Retrieval. Archived tapes must return to the virtual tape library before backup software can read them.
