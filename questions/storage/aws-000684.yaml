id: aws-000684
product_area: storage
true_statement: An operating system can use EBS space beyond 2 TiB only with GPT partitioning, because MBR partitioning tops out at 2 TiB.
false_statement: An operating system can use EBS space beyond 16 TiB only with GPT partitioning, because MBR partitioning tops out at 16 TiB.
explanation: MBR's 2 TiB ceiling is an OS-level limit separate from the EBS volume size. Larger volumes need GPT, and large boot volumes also need GRUB2 or UEFI boot.
