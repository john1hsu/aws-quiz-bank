id: aws-000034
product_area: storage
true_statement: The maximum size of a single Amazon S3 object is 50 TB, raised from 5 TB in December 2025.
false_statement: The maximum size of a single Amazon S3 object is 5 TB, raised from 5 GB in December 2025.
explanation: S3 lifted the per-object limit from 5 TB to 50 TB across all Regions and storage classes in December 2025. The 5 GB figure is the cap on a single PUT request, not on objects.
