id: aws-000178
product_area: storage
true_statement: Amazon EFS encryption at rest must be chosen when the file system is created, while encryption in transit is turned on when a client mounts it.
false_statement: Amazon EFS encryption in transit must be chosen when the file system is created, while encryption at rest is turned on when a client mounts it.
explanation: At-rest encryption with AWS KMS is a creation-time setting of the file system. TLS for data in transit is enabled per mount, using the EFS mount helper, so the false statement swaps the two.
