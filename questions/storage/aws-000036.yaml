id: aws-000036
product_area: storage
true_statement: Amazon S3 supports at least 3,500 PUT/COPY/POST/DELETE and 5,500 GET/HEAD requests per second per partitioned prefix.
false_statement: Amazon S3 supports at least 5,500 PUT/COPY/POST/DELETE and 3,500 GET/HEAD requests per second per partitioned prefix.
explanation: Reads get the higher per-prefix rate of 5,500 per second and writes 3,500 per second. Because prefixes are unlimited, spreading keys across prefixes raises total throughput.
