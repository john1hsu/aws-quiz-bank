id: aws-000455
product_area: storage
true_statement: Amazon S3 Files needs a general purpose bucket in the same Region with S3 Versioning enabled before a file system can be linked to it.
false_statement: Amazon S3 Files needs an S3 directory bucket in the same Region with S3 Versioning enabled before a file system can be linked to it.
explanation: S3 Files works on general purpose buckets that have versioning turned on and use SSE-S3 or SSE-KMS. Directory buckets are a different bucket type and are not the prerequisite.
