id: aws-000176
product_area: storage
true_statement: A Regional EFS file system stores data across several Availability Zones, while a One Zone file system keeps it in one AZ and can lose data if that AZ is damaged.
false_statement: A One Zone EFS file system stores data across several Availability Zones, while a Regional file system keeps it in one AZ and can lose data if that AZ is damaged.
explanation: Regional is AWS's recommended type and stays available through AZ failures. One Zone trades that resilience for a single-AZ footprint, which is why AWS turns on backups by default for it.
