id: aws-000682
product_area: storage
true_statement: As of 2026-11, a single EBS gp3 volume can be up to 64 TiB and deliver up to 80,000 IOPS, after limits rose from 16 TiB and 16,000 IOPS in September 2025.
false_statement: As of 2026-11, a single EBS gp3 volume can be up to 16 TiB and deliver up to 16,000 IOPS, the same limits gp3 has had since launch.
explanation: On 2025-09-26 AWS raised gp3's ceilings to 64 TiB, 80,000 IOPS and 2,000 MiB/s with no price change. The 16 TiB and 16,000 IOPS figures are the old limits.
