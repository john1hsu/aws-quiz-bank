id: aws-000457
product_area: storage
true_statement: Writes through Amazon S3 Files are typically exported to the bucket within minutes, while changes made directly in the bucket usually appear in the file system within seconds.
false_statement: Writes through Amazon S3 Files are typically exported to the bucket within seconds, while changes made directly in the bucket usually appear in the file system within minutes.
explanation: File-system writes first land on the high-performance tier and are pushed to S3 as new objects or versions some minutes later. In the other direction, bucket changes are picked up quickly through EventBridge-driven synchronization.
