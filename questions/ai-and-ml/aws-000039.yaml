id: aws-000039
product_area: ai-and-ml
true_statement: Because Bedrock guardrails are Regional, an organization-wide Amazon Bedrock policy needs a separate guardrail in each Region it should cover.
false_statement: Because Bedrock guardrails are global, one guardrail referenced in an organization-wide Amazon Bedrock policy covers every Region.
explanation: A guardrail exists in one Region, so central enforcement through AWS Organizations requires a guardrail per Region. The policy must also pin a specific guardrail version.
