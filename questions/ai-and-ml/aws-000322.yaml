id: aws-000322
product_area: ai-and-ml
true_statement: Amazon Comprehend can detect PII in real time or in a batch job, but PII redaction runs only as an asynchronous job.
false_statement: Amazon Comprehend can detect PII only in a batch job, but PII redaction runs either in real time or as an asynchronous job.
explanation: Detection is offered both synchronously and asynchronously, while redaction is limited to async jobs that read from and write to S3. The false version reverses which capability is restricted.
