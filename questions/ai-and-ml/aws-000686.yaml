id: aws-000686
product_area: ai-and-ml
true_statement: An Amazon Kendra index's edition is chosen when the index is created and can't be changed afterwards.
false_statement: An Amazon Kendra index's edition can be upgraded in place, for example from Basic Developer to Basic Enterprise, without recreating the index.
explanation: The Edition parameter is set in CreateIndex and is fixed for the life of the index. Moving to another edition means building a new index.
