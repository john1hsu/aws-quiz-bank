id: aws-000687
product_area: ai-and-ml
true_statement: Amazon Kendra bills every provisioned index by the hour from creation to deletion, even when the index is empty or idle.
false_statement: Amazon Kendra bills an index only for the hours in which it serves queries, so an empty or idle index costs nothing.
explanation: Kendra charges hourly for each index's provisioned storage and query capacity whether or not it is used, which is its most common cost surprise.
