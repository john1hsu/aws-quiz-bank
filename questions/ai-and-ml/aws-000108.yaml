id: aws-000108
product_area: ai-and-ml
true_statement: A Bedrock knowledge base connected to Amazon Redshift is not vectorized; Bedrock translates each natural-language question into SQL instead.
false_statement: A Bedrock knowledge base connected to Amazon Redshift is vectorized; Bedrock embeds the table rows into a vector store instead of generating SQL.
explanation: Structured stores such as Redshift or the Glue Data Catalog skip the chunk-and-embed pipeline. Bedrock uses schema metadata and query history to generate SQL against the data, rather than indexing rows as vectors.
