id: aws-000541
product_area: ai-and-ml
true_statement: Since 30 July 2026, Bedrock Agents Classic blocks CreateAgent and InvokeInlineAgent only for accounts with no Bedrock Agents usage in the previous 12 months.
false_statement: Since 30 July 2026, Bedrock Agents Classic blocks CreateAgent and InvokeInlineAgent only for accounts with no Bedrock Agents usage in the previous 90 days.
explanation: The closed-to-new-customers rule looks back 12 months of usage, and affected accounts get an AccessDeniedException with no exception process. Other APIs such as InvokeAgent keep working.
