id: aws-000319
product_area: ai-and-ml
true_statement: Amazon Bedrock AgentCore works with any agent framework and can call models hosted outside Amazon Bedrock, while Amazon Bedrock Agents is tied to Bedrock's own orchestration and models.
false_statement: Amazon Bedrock Agents works with any agent framework and can call models hosted outside Amazon Bedrock, while Amazon Bedrock AgentCore is tied to Bedrock's own orchestration and models.
explanation: AgentCore is deliberately framework- and model-agnostic, hosting agents built with tools like LangGraph or Strands that may call non-Bedrock models. Bedrock Agents is the older managed feature bound to Bedrock's orchestration.
