id: aws-000179
product_area: ai-and-ml
true_statement: Amazon Textract's DetectDocumentText API returns plain OCR text, while AnalyzeDocument also returns structure such as form key-value pairs and tables.
false_statement: Amazon Textract's AnalyzeDocument API returns plain OCR text, while DetectDocumentText also returns structure such as form key-value pairs and tables.
explanation: DetectDocumentText is the basic OCR call. AnalyzeDocument adds forms, tables, signatures, layout and Queries so the output keeps the page's relationships, which is why the false statement has them reversed.
