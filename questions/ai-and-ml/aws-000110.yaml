id: aws-000110
product_area: ai-and-ml
true_statement: SageMaker AI asynchronous inference accepts payloads up to 1 GB with up to one hour of processing, while serverless inference caps payloads at 4 MB.
false_statement: SageMaker AI serverless inference accepts payloads up to 1 GB with up to one hour of processing, while asynchronous inference caps payloads at 4 MB.
explanation: Asynchronous inference queues requests, which is what lets it take very large payloads and long processing times. Serverless inference is meant for intermittent, small requests and is limited to 4 MB and 60 seconds.
