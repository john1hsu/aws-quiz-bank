id: aws-000543
product_area: ai-and-ml
true_statement: With return control, a Bedrock agent hands the chosen action and its parameters back in the InvokeAgent response so your own application runs it.
false_statement: With return control, a Bedrock agent hands the chosen action and its parameters to an AWS Step Functions workflow, which runs it for your application.
explanation: 'Return control is the alternative to attaching a Lambda function to an action group: the agent returns its predicted action to the caller, which executes it. Step Functions plays no part.'
