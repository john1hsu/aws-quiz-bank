id: aws-000544
product_area: ai-and-ml
true_statement: An Amazon Rekognition face collection stores face vectors rather than the images themselves, and holds up to 20 million face vectors.
false_statement: An Amazon Rekognition face collection stores the indexed face images themselves, and holds up to 20 million face images.
explanation: IndexFaces extracts a vector for each face and keeps only that in the server-side collection; the source images stay wherever you store them. Searches then compare new faces against those vectors.
