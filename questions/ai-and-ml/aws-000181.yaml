true_statement: In AWS's US West (Oregon) example rates, Textract Forms costs $0.05 per page versus $0.0015 for DetectDocumentText text detection (as of 2026-11).
false_statement: In AWS's US West (Oregon) example rates, Textract Forms costs $0.0015 per page versus $0.05 for DetectDocumentText text detection (as of 2026-11).
explanation: Each Textract feature is billed per page on its own, and Forms is far pricier than raw text detection for the first million pages. Requesting Forms when you only need text multiplies the cost by more than 30.
