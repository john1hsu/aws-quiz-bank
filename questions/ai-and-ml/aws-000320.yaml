id: aws-000320
product_area: ai-and-ml
true_statement: An Amazon Bedrock AgentCore Runtime session on microVMs can last at most 8 hours, with an idle timeout that defaults to 15 minutes (as of 2026-11).
false_statement: An Amazon Bedrock AgentCore Runtime session on microVMs can last at most 1 hour, with an idle timeout that defaults to 15 minutes (as of 2026-11).
explanation: Runtime microVM sessions can run for up to 8 hours, and the newer Instances compute type stretches that to 14 days. Both the lifetime and the idle timeout are set per agent in its lifecycle configuration.
