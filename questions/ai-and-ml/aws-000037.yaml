id: aws-000037
product_area: ai-and-ml
true_statement: When Amazon Bedrock Guardrails blocks an input, the model is never invoked and you pay only for the guardrail evaluation.
false_statement: When Amazon Bedrock Guardrails blocks an input, the model is still invoked and you pay for both the guardrail evaluation and the inference.
explanation: Inputs are checked before the model call, so a blocked prompt returns the configured blocked message without any inference charge. Inference is billed only when the input passes.
