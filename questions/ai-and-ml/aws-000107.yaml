id: aws-000107
product_area: ai-and-ml
true_statement: The Bedrock Knowledge Bases Retrieve API returns relevant chunks and leaves generation to your code, while RetrieveAndGenerate returns a cited model answer.
false_statement: The Bedrock Knowledge Bases RetrieveAndGenerate API returns relevant chunks and leaves generation to your code, while Retrieve returns a cited model answer.
explanation: Retrieve is the lower-level call for teams that want to run their own prompt orchestration. RetrieveAndGenerate does retrieval and inference in one managed call and attaches citations, so the false statement swaps the two operations.
