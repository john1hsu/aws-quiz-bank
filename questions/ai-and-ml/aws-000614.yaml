id: aws-000614
product_area: ai-and-ml
true_statement: Amazon Bedrock on-demand pricing has no idle cost and suits spiky traffic, while instance-based model hosting bills provisioned capacity and pays off at sustained use.
false_statement: Instance-based model hosting has no idle cost and suits spiky traffic, while Amazon Bedrock on-demand pricing bills provisioned capacity and pays off at sustained use.
explanation: Bedrock on-demand charges for what you invoke, so quiet periods cost nothing. Hosting on instances charges for capacity whether or not it is busy, which favours steady, high utilization.
