true_statement: An Amazon Q Business Starter index runs in one Availability Zone for proofs of concept, while an Enterprise index runs in three AZs for production.
false_statement: An Amazon Q Business Enterprise index runs in one Availability Zone for proofs of concept, while a Starter index runs in three AZs for production.
