id: aws-000180
product_area: ai-and-ml
true_statement: By default, asynchronous Amazon Textract results sit in a Textract-owned bucket and can be retrieved for only 7 days after the job starts.
false_statement: By default, asynchronous Amazon Textract results sit in a Textract-owned bucket and can be retrieved for up to 90 days after the job starts.
explanation: Textract keeps default async output for just 7 days. To keep results longer, set OutputConfig so they are written to your own S3 bucket, optionally encrypted with a customer managed KMS key.
