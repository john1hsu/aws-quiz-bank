id: aws-000038
product_area: ai-and-ml
true_statement: The ApplyGuardrail API evaluates text against a guardrail without invoking a model, so it can protect models hosted outside Amazon Bedrock.
false_statement: The ApplyGuardrail API evaluates text only during a Bedrock model invocation, so it cannot protect models hosted outside Amazon Bedrock.
explanation: ApplyGuardrail is a standalone call that checks any text against a guardrail. That lets the same safeguards cover external models or individual pipeline steps.
