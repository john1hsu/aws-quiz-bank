id: aws-000250
product_area: ai-and-ml
true_statement: Trainium3 is AWS's first 3 nm AI chip, and a fully configured Trn3 UltraServer holds up to 144 Trainium3 chips.
false_statement: Trainium3 is AWS's first 3 nm AI chip, and a fully configured Trn3 UltraServer holds up to 64 Trainium3 chips.
explanation: Trn3 UltraServers scale to 144 chips joined by an all-to-all switch fabric. The 64-chip figure matches a Trn2 UltraServer of four Trn2 instances, or the smaller Gen1 Trn3 layout.
