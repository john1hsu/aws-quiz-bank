true_statement: Amazon Bedrock's Flex service tier for on-demand inference is priced at a 50% discount to the Standard tier (as of 2026-11).
false_statement: Amazon Bedrock's Flex service tier for on-demand inference is priced at a 75% premium over the Standard tier (as of 2026-11).
explanation: Flex trades latency guarantees for a 50% discount off Standard pricing. The 75% premium belongs to the Priority tier, which buys faster, preferred processing.
