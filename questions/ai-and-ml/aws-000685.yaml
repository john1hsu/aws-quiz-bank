product_area: ai-and-ml
true_statement: Amazon Kendra stopped accepting new customers on July 30, 2026, and AWS recommends Amazon Bedrock knowledge bases for new search and RAG applications.
false_statement: Amazon Kendra stopped accepting new customers on July 30, 2026, and AWS recommends Amazon OpenSearch Serverless collections as the named successor for new RAG applications.
explanation: Kendra went into maintenance mode on June 30, 2026 and closed to new customers a month later. AWS's migration guide maps it to Bedrock's managed knowledge bases; OpenSearch is only an option for keyword-heavy search.
