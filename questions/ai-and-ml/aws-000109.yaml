id: aws-000109
product_area: ai-and-ml
true_statement: By default, deleting a Bedrock knowledge base or data source also removes its vectors from S3 Vectors unless the data deletion policy is set to Retain.
false_statement: By default, deleting a Bedrock knowledge base or data source keeps its vectors in S3 Vectors unless the data deletion policy is set to Delete.
explanation: The default data deletion policy is Delete, so the vectors go with the knowledge base or data source. Keeping them requires choosing Retain explicitly.
