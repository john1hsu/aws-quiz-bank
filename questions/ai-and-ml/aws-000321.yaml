id: aws-000321
product_area: ai-and-ml
true_statement: AgentCore Runtime does not bill CPU while an agent waits on I/O such as a model response, but it still bills the memory the session holds during that wait.
false_statement: AgentCore Runtime does not bill memory while an agent waits on I/O such as a model response, but it still bills the CPU the session holds during that wait.
explanation: Runtime pricing skips CPU charges during I/O waits, which suits agents that spend much of their time waiting on models. Memory stays allocated, so it keeps accruing until Runtime v2 reclaims idle memory.
