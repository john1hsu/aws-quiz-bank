product_area: ai-and-ml
true_statement: Renaming Amazon SageMaker to Amazon SageMaker AI in December 2024 left the sagemaker API namespace and CLI commands unchanged.
false_statement: Renaming Amazon SageMaker to Amazon SageMaker AI in December 2024 also moved the API namespace and CLI commands to sagemaker-ai.
explanation: 'The rename was cosmetic at the API level: namespaces, CLI commands, managed policies, CloudFormation resource types and endpoints all kept the sagemaker name. Existing code and templates did not need changes.'
