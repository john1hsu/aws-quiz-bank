id: aws-000323
product_area: ai-and-ml
true_statement: Amazon Comprehend meters requests in 100-character units with a minimum charge of 3 units (300 characters) per request (as of 2026-11).
false_statement: Amazon Comprehend meters requests in 100-character units with a minimum charge of 10 units (1,000 characters) per request (as of 2026-11).
explanation: Every request is billed for at least three 100-character units, which makes very short texts relatively costly. Batching short texts is the usual way to soften that minimum.
