id: aws-000545
product_area: ai-and-ml
true_statement: Amazon Rekognition streaming video analysis closed to new customers on 30 April 2026, and AWS recommends sending sampled frames to the Image API instead.
false_statement: Amazon Rekognition streaming video analysis closed to new customers on 30 April 2026, and AWS recommends sending the streams to SageMaker AI endpoints instead.
explanation: AWS's suggested replacement for streaming and bulk analysis is to sample stream frames, or batch S3 images, into the Rekognition Image API. Accounts that used the feature in the prior 12 months keep access.
