id: aws-000459
product_area: ai-and-ml
true_statement: Amazon Q Developer Pro costs $19 per user per month and includes 4,000 lines of Java transformation a month, pooled at the account level.
false_statement: Amazon Q Developer Pro costs $19 per user per month and includes 4,000 lines of Java transformation a month for each individual user.
explanation: Pro's Java transformation allowance is a shared account-level pool, with extra lines billed at $0.003 each. The Free tier's 1,000 lines, by contrast, apply per user.
