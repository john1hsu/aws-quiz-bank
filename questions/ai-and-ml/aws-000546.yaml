id: aws-000546
product_area: ai-and-ml
true_statement: Amazon Rekognition Custom Labels bills $4 per inference hour while a model runs, so an idle model left running is still charged (as of 2026-11, US East).
false_statement: Amazon Rekognition Custom Labels bills only per image analyzed, so an idle model left running is not charged (as of 2026-11, US East).
explanation: Custom Labels charges for the hours a model is started, plus $1 per training hour, regardless of traffic. Stopping unused models is the way to avoid paying for idle capacity.
