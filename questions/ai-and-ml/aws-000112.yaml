true_statement: SageMaker Savings Plans can cut eligible SageMaker AI instance usage by up to 64%, regardless of instance family, size or Region.
false_statement: SageMaker Savings Plans can cut eligible SageMaker AI instance usage by up to 64%, but only within one instance family in one Region.
explanation: The SageMaker plan type is flexible across instance families, sizes and Regions, and it covers notebooks, processing, training, real-time inference and batch transform. The false statement wrongly ties it to one family and Region.
