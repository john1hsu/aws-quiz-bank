id: aws-000003
product_area: ai-and-ml
true_statement: Global cross-Region inference profiles in Amazon Bedrock do not meet data-residency requirements; geographic profiles such as US or EU keep processing inside one geography.
false_statement: Geographic cross-Region inference profiles in Amazon Bedrock do not meet data-residency requirements; Global profiles keep processing inside one geography.
explanation: A Global profile may send a request to any supported commercial Region, so it cannot guarantee residency. Geographic profiles restrict routing to Regions within one geography such as the US, EU or APAC.
