id: aws-000571
product_area: cost-management
true_statement: AWS Compute Optimizer analyzes the last 14 days of metrics by default, and its paid enhanced infrastructure metrics extend the lookback to about three months.
false_statement: AWS Compute Optimizer analyzes the last 7 days of metrics by default, and its paid enhanced infrastructure metrics extend the lookback to about three months.
explanation: The default window is 14 days, with a 32-day option at no extra cost for several resource types. Enhanced infrastructure metrics push EC2 and RDS analysis to roughly 93 days to catch quarterly patterns.
