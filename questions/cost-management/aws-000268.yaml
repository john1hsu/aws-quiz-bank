id: aws-000268
product_area: cost-management
true_statement: Joining AWS Organizations or setting up an AWS Control Tower landing zone automatically upgrades a Free-plan account to a Paid account plan.
false_statement: Joining AWS Organizations or setting up an AWS Control Tower landing zone is blocked for a Free-plan account until it is manually upgraded to a Paid plan.
explanation: These actions are allowed, but taking them moves the account onto the Paid plan automatically, as do Enterprise Agreements and HIPAA or SEC designations.
