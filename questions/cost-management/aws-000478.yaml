id: aws-000478
product_area: cost-management
true_statement: AWS Billing Conductor builds a separate, custom version of monthly billing data for showback and chargeback without changing what AWS actually charges.
false_statement: AWS Billing Conductor rewrites the amounts AWS actually charges each account, so showback and chargeback rates appear on the official invoice.
explanation: Billing Conductor produces pro forma billing data, for example to present custom rates to internal teams or customers. The real AWS bill is unaffected.
