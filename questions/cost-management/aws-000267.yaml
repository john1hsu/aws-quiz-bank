id: aws-000267
product_area: cost-management
true_statement: An AWS account on the Free account plan is never billed; when the plan ends the account is closed, and upgrading within 90 days restores it.
false_statement: An AWS account on the Free account plan is never billed; when the plan ends the account moves to on-demand billing, and nothing is closed or deleted.
explanation: 'The Free plan stops rather than starts charging: the account closes when the period ends, content is kept for 90 days, and only an upgrade to a Paid plan in that window brings it back.'
