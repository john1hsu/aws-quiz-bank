id: aws-000413
product_area: cost-management
true_statement: A cost allocation tag backfill applies a key's current activation status to up to 12 months of past cost data, and only one backfill can run at a time.
false_statement: A cost allocation tag backfill applies a key's current activation status to up to 3 months of past cost data, and only one backfill can run at a time.
explanation: Since 2024 the management account can backfill activation over the previous 12 months, at most once every 24 hours. It only helps for months in which resources actually carried the tag.
