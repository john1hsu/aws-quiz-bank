product_area: cost-management
true_statement: AWS Cost Anomaly Detection learns what normal spend looks like and flags deviations, while AWS Budgets checks spend against limits you set.
false_statement: AWS Budgets learns what normal spend looks like and flags deviations, while AWS Cost Anomaly Detection checks spend against limits you set.
explanation: Anomaly detection uses machine learning on an account's own history to spot unusual spikes. Budgets compares actual or forecast spend with fixed thresholds you define.
