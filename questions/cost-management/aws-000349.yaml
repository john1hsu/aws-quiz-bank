id: aws-000349
product_area: cost-management
true_statement: AWS names compute, storage and outbound data transfer as its three fundamental cost drivers, while inbound data transfer is in most cases free.
false_statement: AWS names compute, storage and inbound data transfer as its three fundamental cost drivers, while outbound data transfer is in most cases free.
explanation: Data leaving AWS is billed and shows up as AWS Data Transfer Out, whereas data coming in is usually not charged. AWS still advises checking for exceptions before relying on free transfer.
