id: aws-000204
product_area: cost-management
true_statement: Amazon EC2 gives a two-minute warning before it stops or terminates a Spot Instance, delivered as an EventBridge event and in instance metadata.
false_statement: Amazon EC2 gives a ten-minute warning before it stops or terminates a Spot Instance, delivered as an EventBridge event and in instance metadata.
explanation: The Spot interruption notice gives two minutes of lead time, on a best-effort basis, and AWS suggests polling metadata for it every few seconds. Ten minutes overstates the window; hibernation gets no lead time at all.
