id: aws-000570
product_area: cost-management
true_statement: AWS billing transfer lets one external management account receive and pay the consolidated bills of several organizations, while each keeps its own security governance.
false_statement: AWS billing transfer lets one external management account receive and pay the consolidated bills of several organizations, and also moves their security governance to it.
explanation: 'Billing transfer separates who pays from who governs: the paying account takes over invoices, but each organization keeps control of its own security. Bill source accounts stay liable for charges from before the transfer.'
