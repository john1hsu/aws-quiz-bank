id: aws-000206
product_area: cost-management
true_statement: A Spot capacity pool is the unused capacity of one instance type in one Availability Zone, so adding instance types and AZs gives Spot more pools to draw from.
false_statement: A Spot capacity pool is the unused capacity of one instance family across a whole Region, so adding Availability Zones gives Spot no extra pools to draw from.
explanation: Pools are defined per instance type per AZ and are available independently. That is why AWS recommends many instance types and every AZ in the VPC for Spot workloads.
