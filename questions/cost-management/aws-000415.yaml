id: aws-000415
product_area: cost-management
true_statement: The AWS-generated aws:createdBy tag is applied only to resources created after the tag is activated, and only for a listed set of create events.
false_statement: The AWS-generated aws:createdBy tag is applied retroactively to existing resources once activated, and only for a listed set of create events.
explanation: aws:createdBy is stamped on resources at creation time, built from CloudTrail records, so older resources stay without it. It is also best-effort and limited to certain events and Regions.
