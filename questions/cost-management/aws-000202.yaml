id: aws-000202
product_area: cost-management
true_statement: By default you can buy 20 new regional Reserved Instances per Region per month plus 20 new zonal RIs per Availability Zone per month (as of 2026-11).
false_statement: By default you can buy 20 new Reserved Instances per Region per month in total, whether they are regional or zonal (as of 2026-11).
explanation: The regional and zonal purchase quotas are separate, and the zonal one applies per AZ, so a three-AZ Region allows 80 new RIs a month by default.
