id: aws-000569
product_area: cost-management
true_statement: One month can bring several AWS invoices, because each service provider (seller of record), such as Amazon Web Services, Inc. or AWS EMEA SARL, issues its own.
false_statement: One month can bring several AWS invoices, because each AWS Region in which the account ran resources issues its own.
explanation: Invoices are split by seller of record, not by Region. Payment profiles then let you pay each provider's invoices in its own currency and payment method.
