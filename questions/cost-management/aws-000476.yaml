id: aws-000476
product_area: cost-management
true_statement: AWS Organizations consolidated billing has no extra fee and pools usage across accounts, so volume discounts, Reserved Instances and Savings Plans are shared.
false_statement: AWS Organizations consolidated billing has no extra fee but prices each account's usage separately, so volume discounts, Reserved Instances and Savings Plans are not shared.
explanation: Consolidated billing produces one bill and treats the organization's usage as a pool, which helps accounts reach volume tiers and lets commitments apply across accounts.
