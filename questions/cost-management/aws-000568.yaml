id: aws-000568
product_area: cost-management
true_statement: On the AWS Bills page, a Pending billing period shows estimated totals for a period still open, while an Issued period has a final invoice.
false_statement: On the AWS Bills page, an Issued billing period shows estimated totals for a period still open, while a Pending period has a final invoice.
explanation: Pending means usage is still being metered, so the figures are estimates. Once the period closes the invoice is issued and the totals become final.
