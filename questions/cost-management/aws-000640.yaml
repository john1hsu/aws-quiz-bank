id: aws-000640
product_area: cost-management
true_statement: A new AWS Cost Anomaly Detection monitor needs at least 10 days of usage data before it can find anomalies.
false_statement: A new AWS Cost Anomaly Detection monitor needs at least 90 days of usage data before it can find anomalies.
explanation: The models need about ten days of history to learn expected spend, and a newly used service waits for the same ten days. Three months of history isn't required.
