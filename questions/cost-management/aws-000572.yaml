id: aws-000572
product_area: cost-management
true_statement: Compute Optimizer's paid enhanced infrastructure metrics bill an Auto Scaling group per running instance, not as a single resource per group (as of 2026-11).
false_statement: Compute Optimizer's paid enhanced infrastructure metrics bill an Auto Scaling group as a single resource per group, not per running instance (as of 2026-11).
explanation: The per-resource-hour rate applies to each instance an Auto Scaling group runs, so a large group costs more than one resource. AWS also suggests leaving the feature off for short-lived test instances.
