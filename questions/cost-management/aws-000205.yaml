id: aws-000205
product_area: cost-management
true_statement: Setting an optional maximum price on Spot Instances makes them get interrupted more often than leaving the maximum price unset.
false_statement: Setting an optional maximum price on Spot Instances makes them get interrupted less often than leaving the maximum price unset.
explanation: 'A maximum price adds a second interruption trigger: when the Spot price rises above it, EC2 reclaims the instance. Leaving it unset removes that trigger, so interruptions are less frequent.'
