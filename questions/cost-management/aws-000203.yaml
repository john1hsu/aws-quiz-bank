id: aws-000203
product_area: cost-management
true_statement: Only Standard Reserved Instances can be sold on the Reserved Instance Marketplace; Convertible RIs can instead be exchanged for other Convertible RIs.
false_statement: Only Convertible Reserved Instances can be sold on the Reserved Instance Marketplace; Standard RIs can instead be exchanged for other Standard RIs.
explanation: RIs cannot be cancelled. Standard RIs can be modified or resold on the Marketplace, while exchanges for different attributes are a Convertible RI feature.
