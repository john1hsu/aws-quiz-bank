id: aws-000139
product_area: cost-management
true_statement: A budget action run from an Organizations management account can attach an SCP to a member account but cannot target EC2 or RDS instances in that account.
false_statement: A budget action run from an Organizations management account can target EC2 or RDS instances in a member account but cannot attach an SCP to that account.
explanation: Attaching an SCP is a management-account action that reaches other accounts. EC2 and RDS instance actions work only on instances in the budget's own account, so the false statement reverses what crosses the account boundary.
