id: aws-000477
product_area: cost-management
true_statement: IAM users and roles can't open the Billing and Cost Management console until the account turns on its Activate IAM Access setting.
false_statement: IAM users and roles can't open the Billing and Cost Management console until the organization attaches an SCP that allows billing actions.
explanation: Billing console access for IAM identities is gated by an account-level setting called Activate IAM Access, which new accounts often miss. SCPs only cap permissions and can't grant this access.
