id: aws-000351
product_area: cost-management
true_statement: In US East (Ohio), a NAT gateway costs $0.045 per hour plus $0.045 per GB processed, and cross-AZ use adds data transfer charges (as of 2026-11).
false_statement: In US East (Ohio), a NAT gateway costs $0.045 per hour with no per-GB processing charge, and cross-AZ use adds data transfer charges (as of 2026-11).
explanation: NAT gateways bill both an hourly rate and a per-GB data processing rate, which is why they are a classic hidden network cost. Placing the gateway in a different AZ from its instances adds transfer charges on top.
