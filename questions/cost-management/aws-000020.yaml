id: aws-000020
product_area: cost-management
true_statement: During hourly billing, EC2 Instance Savings Plans are applied before Compute Savings Plans, after any EC2 Reserved Instances.
false_statement: During hourly billing, Compute Savings Plans are applied before EC2 Instance Savings Plans, after any EC2 Reserved Instances.
explanation: Reserved Instances apply first, then the narrower EC2 Instance Savings Plans, and finally Compute Savings Plans. The broader plan goes last so it can cover usage the narrower ones cannot.
