id: aws-000201
product_area: cost-management
true_statement: A zonal Reserved Instance reserves capacity in one Availability Zone, while a regional Reserved Instance reserves no capacity but discounts usage in any AZ of the Region.
false_statement: A regional Reserved Instance reserves capacity in every Availability Zone of the Region, while a zonal Reserved Instance reserves no capacity but discounts usage in one AZ.
explanation: Capacity reservation comes only with zonal RIs. Regional RIs trade that away for a discount that floats across AZs and, through size flexibility, across instance sizes.
