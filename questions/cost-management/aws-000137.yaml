id: aws-000137
product_area: cost-management
true_statement: AWS Budgets data refreshes up to three times a day, so a budget is not a real-time hard cap and costs can keep rising after an alert.
false_statement: AWS Budgets data refreshes every minute, so a budget works as a real-time hard cap that stops costs from rising after an alert.
explanation: Budget figures update only a few times a day, usually 8 to 12 hours apart, and billing lags real usage. That is why AWS suggests pairing Budgets with Cost Anomaly Detection for sudden spikes.
