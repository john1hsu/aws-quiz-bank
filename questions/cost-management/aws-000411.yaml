product_area: cost-management
true_statement: In the in-console Pricing Calculator, workload estimates are free, while bill estimates are free for five per calendar month and then cost $2 each (as of 2026-11).
false_statement: In the in-console Pricing Calculator, bill estimates are free, while workload estimates are free for five per calendar month and then cost $2 each (as of 2026-11).
explanation: Only the whole-bill estimate type carries a charge after the monthly free allowance; failed ones aren't billed. Workload estimates for a single application or change cost nothing.
