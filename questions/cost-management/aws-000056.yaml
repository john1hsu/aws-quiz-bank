id: aws-000056
product_area: cost-management
true_statement: The Cost Explorer API costs $0.01 per request, and each page of a paginated result counts as a separate request (as of 2026-11).
false_statement: The Cost Explorer API costs $0.01 per request, and a paginated result counts as one request however many pages it has (as of 2026-11).
explanation: Every page returned is billed as its own request, so scripts that page through large groupings can add up. The console itself is free.
