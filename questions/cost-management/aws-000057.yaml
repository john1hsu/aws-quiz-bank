id: aws-000057
product_area: cost-management
true_statement: Enabling AWS Cost Explorer automatically sets up Cost Anomaly Detection with an AWS services monitor and a daily summary alert subscription.
false_statement: Enabling AWS Cost Explorer automatically sets up AWS Budgets with a monthly cost budget and a daily summary alert subscription.
explanation: Turning on Cost Explorer also switches on Cost Anomaly Detection, which you can opt out of. AWS Budgets is a separate tool that you configure yourself.
