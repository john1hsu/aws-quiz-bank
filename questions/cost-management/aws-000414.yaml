id: aws-000414
product_area: cost-management
true_statement: Activating an AWS-generated cost allocation tag in an organization's management account also turns it on for every member account.
false_statement: Activating an AWS-generated cost allocation tag in an organization's management account turns it on there only, so each member account must activate it too.
explanation: Member accounts can't use the cost allocation tags manager; the management account (or a standalone account) controls activation, and its choice for AWS-generated tags propagates to members.
