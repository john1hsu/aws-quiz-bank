id: aws-000138
product_area: cost-management
true_statement: The first two action-enabled AWS budgets each month are free, and each additional action-enabled budget costs $0.10 per day (as of 2026-11).
false_statement: The first ten action-enabled AWS budgets each month are free, and each additional action-enabled budget costs $0.10 per day (as of 2026-11).
explanation: Budget monitoring and alerts are free, and two budgets with actions are included each month however many actions they hold. Beyond those two, each action-enabled budget is billed $0.10 per day.
