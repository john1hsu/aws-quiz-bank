id: aws-000573
product_area: cost-management
true_statement: AWS Compute Optimizer can take EC2 memory metrics from third-party observability tools such as Datadog and Dynatrace to improve rightsizing accuracy.
false_statement: AWS Compute Optimizer can take EC2 memory metrics only from AWS Trusted Advisor checks to improve rightsizing accuracy.
explanation: Memory is not in default EC2 metrics, so Compute Optimizer accepts it from external observability tools as well as CloudWatch. Trusted Advisor is a separate checking service, not a metrics source for it.
