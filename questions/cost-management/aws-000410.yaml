true_statement: 'A saved AWS Pricing Calculator estimate is not auto-updated: every change creates a new link, and links created since 31 May 2023 stay valid for one year.'
false_statement: 'A saved AWS Pricing Calculator estimate is not auto-updated: every change creates a new link, and links created since 31 May 2023 stay valid for three years.'
explanation: Shared estimates are frozen snapshots behind a unique link, and newer links expire after one year. Anyone with the link can open it, so it should be handled as shared content.
