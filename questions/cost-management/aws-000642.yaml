id: aws-000642
product_area: cost-management
true_statement: Cost Anomaly Detection monitors on linked accounts, tags or cost categories can be created only in the Organizations management account; member accounts get only the AWS services monitor.
false_statement: Cost Anomaly Detection monitors on linked accounts, tags or cost categories can be created in any member account; the Organizations management account gets only the AWS services monitor.
explanation: Organization-wide dimensions are reserved for the management account, and anomalies show only in the account that owns the monitor. Member accounts are limited to watching AWS services.
