id: aws-000019
product_area: cost-management
true_statement: Compute Savings Plans apply to EC2, AWS Fargate and AWS Lambda usage, while EC2 Instance Savings Plans cover only EC2 in one instance family and Region.
false_statement: EC2 Instance Savings Plans apply to EC2, AWS Fargate and AWS Lambda usage, while Compute Savings Plans cover only EC2 in one instance family and Region.
explanation: Compute Savings Plans are the flexible type that floats across families, Regions and the serverless compute services. EC2 Instance Savings Plans give a deeper discount but are locked to one family in one Region and exclude Fargate and Lambda.
