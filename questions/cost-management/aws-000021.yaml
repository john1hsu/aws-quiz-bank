id: aws-000021
product_area: cost-management
true_statement: Savings Plans reserve no capacity, so workloads that need capacity assurance pair them with On-Demand Capacity Reservations.
false_statement: Savings Plans reserve capacity in the Regions they cover, so workloads that use them no longer need On-Demand Capacity Reservations.
explanation: A Savings Plan is purely a billing discount for committed spend. Capacity Reservations hold capacity without a discount, and the two are designed to be combined.
