product_area: public-sector-and-compliance
true_statement: 'In the AWS European Sovereign Cloud, ARNs begin arn:aws-eusc: and service endpoints use amazonaws.eu, while IAM service principals still end in amazonaws.com.'
false_statement: 'In the AWS European Sovereign Cloud, ARNs begin arn:aws-eusc: and service endpoints use amazonaws.eu, and IAM service principals also end in amazonaws.eu.'
explanation: The partition changes ARNs and endpoint domains, but service principals in policies keep the amazonaws.com suffix. Policies copied from the commercial partition need ARN edits, not principal edits.
