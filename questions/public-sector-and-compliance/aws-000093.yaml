id: aws-000093
product_area: public-sector-and-compliance
true_statement: AWS requires the GovCloud (US) account owner to be a U.S. person but does not require IAM users or application users to be U.S. persons.
false_statement: AWS requires every IAM user and application user in a GovCloud (US) account to be a U.S. person, but not the account owner.
explanation: Only the account owner must be a U.S. person. Restricting which IAM and application users may access export-controlled data is the customer's job under the shared responsibility model.
