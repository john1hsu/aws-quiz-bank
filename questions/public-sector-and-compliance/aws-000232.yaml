id: aws-000232
product_area: public-sector-and-compliance
true_statement: After a HIPAA BAA is accepted in AWS Artifact, the account may still use any AWS service, but protected health information belongs only in HIPAA Eligible Services.
false_statement: After a HIPAA BAA is accepted in AWS Artifact, the account is blocked from using any AWS service that is not a HIPAA Eligible Service.
explanation: Accepting the BAA designates a HIPAA Account without restricting which services run there. The customer's obligation is to keep PHI inside eligible services.
