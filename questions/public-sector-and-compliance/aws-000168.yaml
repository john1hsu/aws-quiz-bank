product_area: public-sector-and-compliance
true_statement: DoD impact levels 1 and 3 were folded into the next level up, which is why the levels in use are IL2, IL4, IL5 and IL6.
false_statement: DoD impact levels 3 and 5 were folded into the next level up, which is why the levels in use are IL1, IL2, IL4 and IL6.
explanation: The scheme skips odd numbers at the low end because former levels 1 and 3 were merged upward. IL5 is very much in use for higher-sensitivity CUI and National Security Systems.
