id: aws-000231
product_area: public-sector-and-compliance
true_statement: An AWS Artifact organization agreement can be accepted only from the management account of an organization with all features enabled.
false_statement: An AWS Artifact organization agreement can be accepted from any member account of an organization that has only consolidated billing enabled.
explanation: Organization agreements cover every current and future member account, so only the management account may accept or terminate them, and the organization needs all features, not just consolidated billing.
