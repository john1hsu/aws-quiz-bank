id: aws-000092
product_area: public-sector-and-compliance
true_statement: Billing and usage reports for an AWS GovCloud (US) account appear only in the standard AWS account it is linked to.
false_statement: Billing and usage reports for an AWS GovCloud (US) account appear only inside the GovCloud account itself, not in any standard AWS account.
explanation: Every GovCloud account is paired with a standard account that handles billing, so its charges and usage show up there. The GovCloud side does not carry its own billing view.
