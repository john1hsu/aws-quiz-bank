true_statement: For NIST SP 800-53 Revision 5, the low, moderate and high baselines are published in SP 800-53B, while assessment procedures are in SP 800-53A.
false_statement: For NIST SP 800-53 Revision 5, the low, moderate and high baselines are published in SP 800-53A, while assessment procedures are in SP 800-53B.
explanation: Revision 5 split the baselines out of the catalog into SP 800-53B, which also has a privacy baseline and tailoring guidance. SP 800-53A is the companion that describes how to assess the controls.
