id: aws-000091
product_area: public-sector-and-compliance
true_statement: AWS GovCloud (US) consists of two isolated Regions, AWS GovCloud (US-West) and AWS GovCloud (US-East).
false_statement: AWS GovCloud (US) consists of a single isolated Region, AWS GovCloud (US-West).
explanation: There are two GovCloud Regions, and AWS recommends designing across both of them. A single-Region GovCloud would leave no in-partition failover option.
