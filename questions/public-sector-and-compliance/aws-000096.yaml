product_area: public-sector-and-compliance
true_statement: Commercial customers get AWS's FedRAMP Partner Package through AWS Artifact, while government employees and contractors request the package from the FedRAMP PMO.
false_statement: Government employees and contractors get AWS's FedRAMP package through AWS Artifact, while commercial customers request the package from the FedRAMP PMO.
explanation: AWS Artifact (or an account manager) is the route for commercial customers and partners. Government users go through the FedRAMP PMO, which also provides the Ongoing Certification Reports.
