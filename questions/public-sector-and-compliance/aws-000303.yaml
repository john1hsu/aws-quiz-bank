id: aws-000303
product_area: public-sector-and-compliance
true_statement: On AWS's Services in Scope page, a listed service's generally available features are in scope for a program unless AWS specifically excludes them (as of 2026-11).
false_statement: On AWS's Services in Scope page, a listed service's generally available features are out of scope for a program unless AWS specifically includes them (as of 2026-11).
explanation: Scope is granted by default to a listed service's GA features, with named carve-outs such as Simple AD under SOC. The false version reverses the default into an opt-in list.
