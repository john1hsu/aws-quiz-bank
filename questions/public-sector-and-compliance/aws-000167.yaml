id: aws-000167
product_area: public-sector-and-compliance
true_statement: On AWS, the US East and US West Regions hold DoD Impact Level 2, while IL4 and IL5 workloads belong in AWS GovCloud (US) (as of 2026-11).
false_statement: On AWS, the US East and US West Regions hold DoD Impact Level 4, while IL5 and IL6 workloads belong in AWS GovCloud (US) (as of 2026-11).
explanation: The commercial US Regions are authorized only at IL2. GovCloud (US) holds IL2, IL4 and IL5, and classified IL6 work goes to the AWS Secret Region instead.
