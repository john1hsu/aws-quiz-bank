id: aws-000524
product_area: public-sector-and-compliance
true_statement: Under ITAR's encryption carve-out, end-to-end encrypted unclassified technical data is not an export only if no third party, such as a cloud provider, can decrypt it.
false_statement: Under ITAR's encryption carve-out, end-to-end encrypted unclassified technical data is not an export even if the cloud provider holds the means to decrypt it.
explanation: The carve-out depends on the customer keeping the decryption means out of any third party's hands, with FIPS-validated or AES-128-equivalent encryption. Provider-held keys break that condition.
