id: aws-000301
product_area: public-sector-and-compliance
true_statement: AWS issues its SOC 1 report quarterly and its SOC 2 and SOC 3 reports every six months, each covering a 12-month period (as of 2026-11).
false_statement: AWS issues its SOC 1 report every six months and its SOC 2 and SOC 3 reports quarterly, each covering a 12-month period (as of 2026-11).
explanation: SOC 1 is the quarterly report, while SOC 2 and SOC 3 come out twice a year; all of them look back over 12 months. The false version swaps the two cadences.
