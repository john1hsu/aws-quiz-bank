id: aws-000674
product_area: public-sector-and-compliance
true_statement: 'There is no special PCI environment or API on AWS: any resource in a service on the PCI tab of Services in Scope sits in a PCI DSS compliant environment.'
false_statement: AWS runs a separate PCI environment with its own API endpoints, and only resources created there sit in a PCI DSS compliant environment.
explanation: PCI scope is decided per service, not by a dedicated partition. The multi-tenant environment was validated by the QSA to keep customers segregated.
