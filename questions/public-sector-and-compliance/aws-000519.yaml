id: aws-000519
product_area: public-sector-and-compliance
true_statement: The AWS Control Tower Region deny control is enabled in the landing zone settings and then applies to every OU, not to selected OUs.
false_statement: The AWS Control Tower Region deny control is enabled on individual OUs, so it can apply to selected OUs rather than every OU.
explanation: Region deny is an elective preventive control switched on at the landing zone level, so it covers all OUs at once. That is why AWS advises checking the approved Region list against every workload before enabling it.
