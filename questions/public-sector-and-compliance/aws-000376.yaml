id: aws-000376
product_area: public-sector-and-compliance
true_statement: AWS's Secret-level Regions are authorized at DoD Cloud Computing SRG Impact Level 6 and under the intelligence directive ICD 503.
false_statement: AWS's Secret-level Regions are authorized at DoD Cloud Computing SRG Impact Level 5 and under the intelligence directive ICD 503.
explanation: IL6 is the DoD level for Secret-classified data, and the Secret Regions hold that authorization. IL5 is unclassified-but-sensitive data, which AWS hosts in GovCloud (US).
