id: aws-000306
product_area: public-sector-and-compliance
true_statement: When a healthcare customer only uses a SaaS product built on AWS, the SaaS partner normally signs the BAA with AWS and the customer signs one with the partner.
false_statement: When a healthcare customer only uses a SaaS product built on AWS, the customer normally signs the BAA directly with AWS and the SaaS partner signs none.
explanation: The partner is the one running AWS accounts that hold PHI, so it holds the BAA with AWS and passes obligations down through its own BAA with the customer. A customer needs its own AWS BAA only for PHI in its own accounts.
