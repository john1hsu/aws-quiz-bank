id: aws-000520
product_area: public-sector-and-compliance
true_statement: AWS Prescriptive Guidance notes that most AWS Control Tower data residency controls are detective, flagging problems rather than blocking them.
false_statement: AWS Prescriptive Guidance notes that most AWS Control Tower data residency controls are preventive, blocking problems rather than flagging them.
explanation: Only a few residency controls are preventive, such as blocking VPC internet access or cross-Region networking; the majority detect issues like public IPs or public endpoints. None of them is enabled by default.
