id: aws-000675
product_area: public-sector-and-compliance
true_statement: Because AWS is not a Shared Hosting Provider under PCI DSS, requirement A1.4 doesn't apply, and customers run their own forensic investigations.
false_statement: Because AWS is a Shared Hosting Provider under PCI DSS, requirement A1.4 applies, and AWS runs forensic investigations for its customers.
explanation: Requirement A1.4 places forensic duties on shared hosting providers, a category AWS doesn't fall into. Investigating an incident in a CDE stays with the customer.
