id: aws-000305
product_area: public-sector-and-compliance
true_statement: A HIPAA BAA accepted in AWS Artifact as an organization agreement covers every existing and future member account, while an account agreement covers a single account.
false_statement: A HIPAA BAA accepted in AWS Artifact as an organization agreement covers only the member accounts present when it was accepted, while an account agreement covers a single account.
explanation: The organization agreement extends automatically to accounts that join later. Only an account agreement is limited to one designated account.
