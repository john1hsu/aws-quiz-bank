id: aws-000598
product_area: public-sector-and-compliance
true_statement: Existing AWS accounts cannot be used in the AWS European Sovereign Cloud; customers create new ESC accounts, and no EU residency is required to sign up.
false_statement: Existing AWS accounts can be enabled for the AWS European Sovereign Cloud like an opt-in Region, and no EU residency is required to sign up.
explanation: ESC is a separate partition, so commercial accounts do not carry over and new ESC accounts do not interoperate with other Regions. It is not an opt-in Region inside the commercial partition.
