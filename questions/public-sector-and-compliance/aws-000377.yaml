id: aws-000377
product_area: public-sector-and-compliance
true_statement: Multi-Region disaster recovery at the Secret classification level became possible only once AWS Secret-West opened in 2025.
false_statement: Multi-Region disaster recovery at the Secret classification level became possible once AWS Top Secret-West opened in 2021.
explanation: Until Secret-West went live, the Secret level had a single Region, so workloads could spread only across its AZs. Top Secret-West added a second Region at the Top Secret level, not the Secret level.
