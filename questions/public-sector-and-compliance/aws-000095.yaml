id: aws-000095
product_area: public-sector-and-compliance
true_statement: Under FedRAMP, each agency still issues its own ATO for the system it builds, using the cloud provider's certification package.
false_statement: Under FedRAMP, the cloud provider's certification serves as the ATO for every agency system built on it, so agencies issue none of their own.
explanation: FedRAMP certifies the provider's offering but does not authorize agency systems. Agencies grant their own ATO under the Risk Management Framework, inheriting controls from the provider where applicable.
