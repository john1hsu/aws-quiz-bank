product_area: public-sector-and-compliance
true_statement: AWS GovCloud (US) is FedRAMP Certified Class D (formerly High baseline), while AWS US East-West is Class C (formerly Moderate baseline) (as of 2026-11).
false_statement: AWS US East-West is FedRAMP Certified Class D (formerly High baseline), while AWS GovCloud (US) is Class C (formerly Moderate baseline) (as of 2026-11).
explanation: GovCloud holds the higher Class D certification suitable for high-impact workloads. The commercial US East and West Regions are certified at Class C, the former Moderate baseline.
