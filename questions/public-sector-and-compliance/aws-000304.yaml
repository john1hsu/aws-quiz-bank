id: aws-000304
product_area: public-sector-and-compliance
true_statement: Under HHS guidance, a cloud provider that stores only encrypted ePHI and holds no decryption key still counts as a business associate that needs a BAA.
false_statement: Under HHS guidance, a cloud provider that stores only encrypted ePHI and holds no decryption key counts as a no-view conduit that needs no BAA.
explanation: HHS treats any provider that stores or processes ePHI as a business associate, even one that cannot read the data. Lacking the key does not remove the BAA requirement.
