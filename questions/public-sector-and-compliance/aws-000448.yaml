id: aws-000448
product_area: public-sector-and-compliance
true_statement: Security Hub CSPM's NIST SP 800-53 Rev 5 standard relies on AWS Config recording, which must be on for the checked resource types before you enable it.
false_statement: Security Hub CSPM's NIST SP 800-53 Rev 5 standard relies on AWS CloudTrail data events, which must be on for the checked resource types before you enable it.
explanation: The standard's automated controls are evaluated from AWS Config data, so recording has to be in place first. Even then they cover only the requirements that can be checked automatically.
