id: aws-000673
product_area: public-sector-and-compliance
true_statement: AWS is assessed as a PCI DSS Level 1 Service Provider, but each customer still has to validate and certify the cardholder data environment it builds on AWS.
false_statement: AWS is assessed as a PCI DSS Level 1 Service Provider, so a cardholder data environment built on AWS is certified through AWS's attestation without separate customer validation.
explanation: AWS's AOC covers the infrastructure layer only. Merchants still validate their own CDE each year through a ROC or SAQ, and their QSA can rely on the AOC for the AWS portion.
