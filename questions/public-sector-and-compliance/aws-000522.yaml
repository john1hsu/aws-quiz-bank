id: aws-000522
product_area: public-sector-and-compliance
true_statement: No formal ITAR certification exists, so AWS supports customers who build ITAR-compliant systems in GovCloud (US) without certifying those systems.
false_statement: AWS holds a formal ITAR certification for GovCloud (US), so systems that customers build there are certified as ITAR compliant.
explanation: ITAR has no certification scheme for cloud providers. AWS points instead to GovCloud's U.S.-persons-only access and its FedRAMP High authorization, while compliance of the workload stays with the customer.
