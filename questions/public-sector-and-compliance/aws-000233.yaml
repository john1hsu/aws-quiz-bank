id: aws-000233
product_area: public-sector-and-compliance
true_statement: AWS Artifact reports such as SOC and ISO attest to AWS's own controls, so customers must still produce their own evidence for the parts of a workload they operate.
false_statement: AWS Artifact reports such as SOC and ISO attest to each customer's workload, so customers need no further evidence for the parts of a workload they operate.
explanation: Artifact provides evidence about AWS's side of the shared responsibility model. Compliance of the customer's own configuration and applications still has to be shown separately.
