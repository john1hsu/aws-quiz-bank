id: aws-000600
product_area: public-sector-and-compliance
true_statement: AWS European Sovereign Cloud prices are set in EUR and its payer account is billed separately, so costs do not roll up with commercial AWS accounts.
false_statement: AWS European Sovereign Cloud prices are set in EUR and its accounts join a commercial AWS Organization, so costs roll up into that consolidated bill.
explanation: ESC needs its own AWS Organization and payer account, contracted with Amazon Web Services EMEA SARL. Its charges never merge with a commercial organization's bill.
