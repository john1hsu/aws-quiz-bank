id: aws-000523
product_area: public-sector-and-compliance
true_statement: Because AWS cannot see what customers upload, it treats all customer data in AWS GovCloud (US) as ITAR data and applies the same controls to all of it.
false_statement: Because AWS cannot see what customers upload, it applies ITAR controls in AWS GovCloud (US) only to data that customers tag as export-controlled.
explanation: With no visibility into content, AWS assumes everything in GovCloud could be ITAR-regulated and handles it uniformly. There is no tag-driven scoping of those controls.
