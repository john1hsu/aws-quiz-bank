id: aws-000378
product_area: public-sector-and-compliance
true_statement: On-premises classified networks connect to AWS's Top Secret cloud over AWS Direct Connect rather than over the internet.
false_statement: On-premises classified networks connect to AWS's Top Secret cloud over AWS Site-to-Site VPN tunnels across the internet.
explanation: The Top Secret cloud is fully isolated physically and from public networks, so access comes through dedicated Direct Connect links. Internet-based VPN paths are not how these Regions are reached.
