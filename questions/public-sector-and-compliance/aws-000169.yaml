id: aws-000169
product_area: public-sector-and-compliance
true_statement: Private connectivity for DoD IL4 and IL5 workloads runs through a DoD CIO-approved Cloud Access Point that the mission owner, not the cloud provider, connects to.
false_statement: Private connectivity for DoD IL4 and IL5 workloads runs through a DoD CIO-approved Cloud Access Point that the cloud provider, not the mission owner, connects to.
explanation: Connecting to a Cloud Access Point is the mission owner's job under the SRG. It is one of several areas, along with OS and application STIGs, that stay with the customer rather than being inherited from AWS.
