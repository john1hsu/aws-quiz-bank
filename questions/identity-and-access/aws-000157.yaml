id: aws-000157
product_area: identity-and-access
true_statement: SCPs restrict the root user of each member account, but they never restrict service-linked roles.
false_statement: SCPs restrict service-linked roles in each member account, but they never restrict the root user.
explanation: An SCP caps every IAM user and role in a member account, the root user included. Service-linked roles, which AWS services use on your behalf, are exempt, so the false statement reverses the two.
