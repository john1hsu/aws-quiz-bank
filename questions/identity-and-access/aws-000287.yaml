id: aws-000287
product_area: identity-and-access
true_statement: By default the global AWS STS endpoint issues version 1 tokens that do not work in opt-in Regions, while Regional STS endpoints issue tokens valid in every Region.
false_statement: By default Regional AWS STS endpoints issue version 1 tokens that do not work in opt-in Regions, while the global STS endpoint issues tokens valid in every Region.
explanation: Tokens from sts.amazonaws.com fail in opt-in Regions such as Hong Kong unless reconfigured. That is one reason AWS recommends calling the Regional endpoint where the workload runs.
