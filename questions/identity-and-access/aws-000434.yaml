id: aws-000434
product_area: identity-and-access
true_statement: An IAM role's maximum session duration setting can range from 1 to 12 hours, while a session lasts at least 15 minutes and defaults to 1 hour.
false_statement: An IAM role's maximum session duration setting can range from 1 to 36 hours, while a session lasts at least 15 minutes and defaults to 1 hour.
explanation: Role sessions can be requested for 15 minutes up to the role's configured maximum, which tops out at 12 hours. Role chaining lowers the ceiling further to one hour.
