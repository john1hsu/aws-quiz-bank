id: aws-000589
product_area: identity-and-access
true_statement: AWS RAM invitations for types such as VPC subnets and transit gateways expire after seven days, while invitations for most other resource types expire after 12 hours.
false_statement: AWS RAM invitations for types such as VPC subnets and transit gateways expire after 12 hours, while invitations for most other resource types expire after seven days.
explanation: A listed set of types, including subnets, transit gateways, Resolver forwarding rules and Capacity Reservations, gets a seven-day window; everything else lapses after 12 hours. Accounts inside the organization need no invitation at all.
