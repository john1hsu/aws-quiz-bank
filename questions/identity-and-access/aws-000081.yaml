id: aws-000081
product_area: identity-and-access
true_statement: An AWS access portal session in IAM Identity Center defaults to 8 hours and can be extended up to 90 days.
false_statement: An AWS access portal session in IAM Identity Center defaults to 1 hour and can be extended up to 12 hours.
explanation: The access portal session runs 8 hours by default with a 90-day maximum. The 1-hour default and 12-hour maximum belong to permission-set sessions instead.
