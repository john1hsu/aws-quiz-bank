id: aws-000155
product_area: identity-and-access
true_statement: For an action to be allowed in a member account, an SCP allowing it must be attached at the root, at each OU in the path and at the account itself.
false_statement: For an action to be allowed in a member account, an SCP allowing it need only be attached at the root, from where it is inherited by every OU and account below.
explanation: 'Allows in SCPs are not inherited downward; every level in the path needs one, which is why FullAWSAccess is attached everywhere by default. Denies are the part that flow down: a Deny anywhere on the path wins.'
