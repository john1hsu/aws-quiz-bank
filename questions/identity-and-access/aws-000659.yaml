true_statement: Amazon Cognito is for the customers of your web and mobile apps, while IAM Identity Center is for employees signing in to AWS accounts and business applications.
false_statement: IAM Identity Center is for the customers of your web and mobile apps, while Amazon Cognito is for employees signing in to AWS accounts and business applications.
explanation: Cognito is AWS's customer identity service, with its own sign-up and sign-in for app users. Workforce access to AWS accounts belongs to IAM Identity Center.
