id: aws-000288
product_area: identity-and-access
true_statement: A cross-account request is allowed only if both the principal's account and the resource's account return allow when AWS evaluates their policies.
false_statement: A cross-account request is allowed if either the principal's account or the resource's account returns allow when AWS evaluates their policies.
explanation: The same-account union does not apply across accounts. AWS evaluates the identity side and the resource side separately, and both must allow with no explicit deny in either.
