id: aws-000369
product_area: identity-and-access
true_statement: A customer managed IAM policy can hold at most 6,144 characters, not counting whitespace, and AWS accepts no requests to raise that limit.
false_statement: A customer managed IAM policy can hold at most 10,240 characters, not counting whitespace, and AWS accepts no requests to raise that limit.
explanation: Managed policies are capped at 6,144 characters. The 10,240 figure is the combined inline-policy limit for a role, a different quota.
