id: aws-000079
product_area: identity-and-access
true_statement: Only an IAM Identity Center organization instance, not an account instance, can manage permissions across multiple AWS accounts.
false_statement: Only an IAM Identity Center account instance, not an organization instance, can manage permissions across multiple AWS accounts.
explanation: The organization instance lives in the Organizations management account and supports every feature, including multi-account permissions. Account instances are tied to one account and Region for isolated application use.
