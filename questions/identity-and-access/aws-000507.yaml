id: aws-000507
product_area: identity-and-access
true_statement: Customer managed resource control policies must use the Deny effect, because Allow is reserved for the AWS managed RCPFullAWSAccess policy.
false_statement: Customer managed resource control policies must use the Allow effect, because Deny is reserved for the AWS managed RCPDenyExternalAccess policy.
explanation: Your own RCPs can only deny, with Principal set to "*" and callers narrowed by conditions. The only Allow RCP is the AWS managed RCPFullAWSAccess, and there is no AWS managed deny policy reserving that effect.
