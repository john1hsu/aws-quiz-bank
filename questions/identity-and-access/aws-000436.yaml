id: aws-000436
product_area: identity-and-access
true_statement: To stop a confused deputy, a cross-account role for a third party checks a per-customer external ID with an sts:ExternalId condition in the role's trust policy.
false_statement: To stop a confused deputy, a cross-account role for a third party checks a per-customer external ID with an sts:ExternalId condition in the role's permissions policy.
explanation: The external ID check belongs in the trust policy, which controls who may assume the role. Permissions policies only decide what the session can do after it has been assumed.
