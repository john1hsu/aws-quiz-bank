id: aws-000505
product_area: identity-and-access
true_statement: To pass session tags when a role is assumed, the role's trust policy must allow the sts:TagSession action.
false_statement: To pass session tags when a role is assumed, the role's permissions policy must allow the sts:TagSession action.
explanation: 'Session tagging is controlled where the assumption itself is authorized: the role''s trust policy has to allow sts:TagSession. The permissions policy governs what the session can do afterwards, not whether tags can be attached.'
