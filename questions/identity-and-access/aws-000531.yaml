id: aws-000531
product_area: identity-and-access
true_statement: Resource control policies never apply to resources in the organization's management account, while delegated administrator member accounts remain subject to them.
false_statement: Resource control policies never apply to resources in delegated administrator member accounts, while the organization's management account remains subject to them.
explanation: The management account's resources sit outside RCP evaluation, but a member account stays bound even when it acts as a delegated administrator. The false version swaps which account is exempt.
