id: aws-000508
product_area: identity-and-access
true_statement: A single resource control policy can be at most 5,120 characters, and whitespace counts toward that limit (as of 2026-11).
false_statement: A single resource control policy can be at most 10,240 characters, and whitespace counts toward that limit (as of 2026-11).
explanation: AWS Organizations caps each RCP at 5,120 characters, counting every character including spaces. The doubled figure is not the limit; the organization can hold up to 2,000 RCPs in total.
