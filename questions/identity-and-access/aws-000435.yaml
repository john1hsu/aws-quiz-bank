id: aws-000435
product_area: identity-and-access
true_statement: Administrators can edit the permissions of an IAM service role, but can only view the permissions of a service-linked role, which the service itself owns.
false_statement: Administrators can edit the permissions of an IAM service-linked role, but can only view the permissions of a service role, which the service itself owns.
explanation: A service role is an ordinary role you create for a service to assume, so you control its policies. A service-linked role is defined and owned by the service, and its resources must be removed before the role can be deleted.
