id: aws-000504
product_area: identity-and-access
true_statement: An AWS STS session can carry at most 50 session tags, with tag keys up to 128 characters and values up to 256 characters (as of 2026-11).
false_statement: An AWS STS session can carry at most 10 session tags, with tag keys up to 128 characters and values up to 256 characters (as of 2026-11).
explanation: The STS limit is 50 session tags per session, alongside 128-character keys and 256-character values. Ten is too low; tags and session policies also count against the session token size.
