id: aws-000658
product_area: identity-and-access
true_statement: Amazon Cognito user pools authenticate users and issue JSON Web Tokens, while identity pools exchange trusted tokens for temporary AWS credentials.
false_statement: Amazon Cognito identity pools authenticate users and issue JSON Web Tokens, while user pools exchange trusted tokens for temporary AWS credentials.
explanation: A user pool is the directory and token issuer that answers who the user is. An identity pool answers which AWS resources they may reach by trading a token for STS credentials.
