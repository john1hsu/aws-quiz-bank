id: aws-000290
product_area: identity-and-access
true_statement: Once resource control policies are enabled, the AWS managed RCPFullAWSAccess policy is attached to every root, OU and account and cannot be detached.
false_statement: Once resource control policies are enabled, no RCP is attached by default, so every action is denied until you attach an allow policy.
explanation: RCPFullAWSAccess supplies a permanent allow, so RCPs restrict access only through the deny statements you add. That differs from SCPs, whose default allow policy can be removed.
