id: aws-000156
product_area: identity-and-access
true_statement: Up to 10 SCPs can be attached directly to a root, OU or account, a hard limit that doubled from 5 in May 2026.
false_statement: Up to 20 SCPs can be attached directly to a root, OU or account, a hard limit that doubled from 10 in May 2026.
explanation: On 2026-05-15 AWS raised the direct-attachment limit from 5 to 10 per target and the SCP size limit from 5,120 to 10,240 characters. Inherited policies do not count toward the attachment limit.
