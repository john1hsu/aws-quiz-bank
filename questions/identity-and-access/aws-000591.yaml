id: aws-000591
product_area: identity-and-access
true_statement: 'AWS RAM resource shares are Regional: a Regional resource is shared only within its own Region, and global resources are shared from US East (N. Virginia).'
false_statement: 'AWS RAM resource shares are global: one share covers a Regional resource in every Region, and global resources are shared from any Region.'
explanation: Each share lives in one Region and can include only that Region's resources. Global resources are the exception and are shared from us-east-1.
