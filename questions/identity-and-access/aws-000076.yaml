id: aws-000076
product_area: identity-and-access
true_statement: Within one account, IAM identity-based and resource-based policies combine as a union, while a permissions boundary intersects with identity-based policies.
false_statement: Within one account, IAM identity-based and resource-based policies combine as an intersection, while a permissions boundary forms a union with identity-based policies.
explanation: In the same account either an identity policy or a resource policy can allow a request. A permissions boundary is a ceiling, so the action must be allowed by both it and the identity policy.
