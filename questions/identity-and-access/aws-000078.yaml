id: aws-000078
product_area: identity-and-access
true_statement: An AWS account can have at most 5,000 IAM users, and that quota cannot be raised.
false_statement: An AWS account can have at most 500 IAM users, and that quota cannot be raised.
explanation: The IAM user limit is a fixed 5,000 per account. Large workforces are meant to federate through an identity provider rather than create IAM users.
