id: aws-000285
product_area: identity-and-access
true_statement: When one IAM role's credentials are used to assume another role, AWS STS caps the new session at 1 hour, whatever the role's maximum session duration.
false_statement: When one IAM role's credentials are used to assume another role, AWS STS caps the new session at 12 hours, whatever the role's maximum session duration.
explanation: Role chaining overrides the configured maximum and limits the chained session to one hour. Twelve hours is the highest maximum a role can be set to for a direct AssumeRole.
