id: aws-000286
product_area: identity-and-access
true_statement: Session policies passed to AWS STS AssumeRole can only narrow a session, because effective permissions are the intersection of the role's policies and the session policies.
false_statement: Session policies passed to AWS STS AssumeRole can widen a session, because effective permissions are the union of the role's policies and the session policies.
explanation: A session policy is a filter applied on top of the role's identity-based policies. It can remove permissions for that session but never grant anything the role lacks.
