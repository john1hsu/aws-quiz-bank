id: aws-000368
product_area: identity-and-access
true_statement: AWS STS calls made with AWS credentials share a default quota of 600 requests per second per account in each Region (as of 2026-11).
false_statement: AWS STS calls made with AWS credentials share a default quota of 600 requests per second per account across all Regions combined (as of 2026-11).
explanation: The STS request quota is counted per account and per Region, so a busy fleet in one Region does not consume another Region's budget. Calls by AWS service principals don't count against it.
