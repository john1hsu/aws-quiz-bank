id: aws-000590
product_area: identity-and-access
true_statement: AWS RAM can share VPC subnets only with accounts in your own organization, while transit gateways and Route 53 Resolver rules can also go to outside accounts.
false_statement: AWS RAM can share transit gateways and Route 53 Resolver rules only with accounts in your own organization, while VPC subnets can also go to outside accounts.
explanation: Subnet sharing is limited to your organization, never to IAM roles or users, and default subnets cannot be shared. Transit gateways and Resolver rules may be shared with external accounts.
