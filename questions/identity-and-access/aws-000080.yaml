id: aws-000080
product_area: identity-and-access
true_statement: IAM Identity Center provisions each assigned permission set into member accounts as an IAM role.
false_statement: IAM Identity Center provisions each assigned permission set into member accounts as an IAM user with its own access keys.
explanation: A permission set is a policy template that becomes an IAM role in each target account. Users pick that role in the AWS access portal and get temporary credentials, not long-term keys.
