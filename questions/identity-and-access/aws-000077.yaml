id: aws-000077
product_area: identity-and-access
true_statement: AWS IAM is eventually consistent, so AWS advises keeping IAM changes out of critical, high-availability code paths.
false_statement: AWS IAM is strongly consistent, so AWS advises making IAM changes inside critical, high-availability code paths when needed.
explanation: IAM changes are committed but take time to replicate, so a just-created role or policy may not work immediately everywhere. Verify propagation before production depends on a change.
