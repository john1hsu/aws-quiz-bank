id: aws-000506
product_area: identity-and-access
true_statement: IAM Identity Center attributes for access control pass user attributes from the identity source into the session, so one permission set can serve many teams.
false_statement: IAM Identity Center attributes for access control copy user attributes onto each AWS resource as tags, so one permission set can serve many teams.
explanation: The feature sends directory attributes into the user's session, where ABAC policies compare them with resource tags. It does not tag resources; a user changing teams in the directory changes access without editing AWS permissions.
