id: aws-000289
product_area: identity-and-access
true_statement: For AWS KMS keys and IAM role trust policies, the resource-based policy itself must allow the principal; an identity-based allow alone is not enough.
false_statement: For AWS KMS keys and IAM role trust policies, an identity-based allow alone is enough; the resource-based policy does not need to allow the principal.
explanation: These are documented exceptions to the usual rule that an allow in either policy type suffices. The key policy or trust policy has to grant the principal directly.
