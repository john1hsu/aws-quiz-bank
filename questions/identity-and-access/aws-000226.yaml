id: aws-000226
product_area: identity-and-access
true_statement: A resource-policy Deny that uses NotPrincipal always denies any principal that has a permissions boundary attached, so AWS recommends ArnNotEquals on aws:PrincipalArn instead.
false_statement: A resource-policy Deny that uses ArnNotEquals on aws:PrincipalArn always denies any principal that has a permissions boundary attached, so AWS recommends NotPrincipal instead.
explanation: The NotPrincipal pattern misfires for principals with boundaries and blocks them outright. A condition on aws:PrincipalArn achieves the intended exception safely.
