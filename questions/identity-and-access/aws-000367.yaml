id: aws-000367
product_area: identity-and-access
true_statement: IAM allows 1,000 roles per account by default, and Service Quotas auto-approves increases up to 10,000 roles (as of 2026-11).
false_statement: IAM allows 1,000 roles per account by default, and Service Quotas auto-approves increases up to 5,000 roles (as of 2026-11).
explanation: AWS raised the auto-approved ceiling for roles from 5,000 to 10,000 in May 2026. The 5,000 figure is the old maximum.
