id: aws-000227
product_area: identity-and-access
true_statement: To delegate role creation safely, a developer's policy allows iam:CreateRole only when the iam:PermissionsBoundary condition key equals the approved boundary's ARN.
false_statement: To delegate role creation safely, a developer's policy allows iam:CreateRole only when the aws:SourceAccount condition key equals the approved boundary's ARN.
explanation: The iam:PermissionsBoundary key checks which boundary is being set on the new role, so a create call without the approved boundary fails. aws:SourceAccount identifies a calling account, not a boundary policy.
