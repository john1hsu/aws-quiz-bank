id: aws-000225
product_area: identity-and-access
true_statement: Within one account, a resource-based policy naming an IAM user's ARN grants access the user's permissions boundary does not limit, while one naming a role's ARN is limited by the role's boundary.
false_statement: Within one account, a resource-based policy naming an IAM role's ARN grants access the role's permissions boundary does not limit, while one naming a user's ARN is limited by the user's boundary.
explanation: Boundaries restrict through an implicit deny, and IAM treats user ARNs and role ARNs differently in resource policies. Access granted to a user ARN bypasses the user's boundary; access granted to a role ARN still has to fit the role's boundary.
