id: aws-000175
product_area: serverless-and-integration
true_statement: By default, a classic EventBridge bus retries delivery to a target for 24 hours and up to 185 times.
false_statement: By default, a classic EventBridge bus retries delivery to a target for 2 hours and up to 18 times.
explanation: EventBridge keeps retrying failed deliveries for a day and up to 185 attempts, but delivery is at-least-once and it does not persist events like a queue, so consumers should be idempotent.
