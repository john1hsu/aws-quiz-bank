id: aws-000240
product_area: serverless-and-integration
true_statement: Amazon SNS retries failed deliveries to AWS-managed endpoints such as SQS and Lambda over 23 days, but to customer-managed endpoints such as SMS and email over only 6 hours.
false_statement: Amazon SNS retries failed deliveries to customer-managed endpoints such as SMS and email over 23 days, but to AWS-managed endpoints such as SQS and Lambda over only 6 hours.
explanation: The default delivery policy is far more persistent for AWS-managed targets (up to 100,015 attempts) than for customer-managed ones (50 attempts). After the policy runs out, the message is dropped unless a dead-letter queue is set.
