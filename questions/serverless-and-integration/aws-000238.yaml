id: aws-000238
product_area: serverless-and-integration
true_statement: API Gateway's default throttle of 10,000 requests per second applies per account per Region and is shared by all of that account's HTTP, REST and WebSocket APIs (as of 2026-11).
false_statement: API Gateway's default throttle of 10,000 requests per second applies to each API separately, so every HTTP, REST or WebSocket API gets its own allowance (as of 2026-11).
explanation: The quota is account-level within a Region, so one busy client can starve every API in the account. REST API usage plans are the way to throttle individual clients.
