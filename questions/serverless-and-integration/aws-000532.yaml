id: aws-000532
product_area: serverless-and-integration
true_statement: An on-demand AWS Lambda Init phase is capped at 10 seconds, while provisioned concurrency or SnapStart functions get 130 seconds or the function timeout, whichever is higher.
false_statement: An on-demand AWS Lambda Init phase is capped at 30 seconds, while provisioned concurrency or SnapStart functions get 130 seconds or the function timeout, whichever is higher.
explanation: On-demand initialization must finish within 10 seconds, after which Lambda retries Init on the first invocation under the function timeout. The longer limit applies only to pre-initialized or snapshot-based setups.
