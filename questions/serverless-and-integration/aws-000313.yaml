id: aws-000313
product_area: serverless-and-integration
true_statement: An Amazon SQS visibility timeout defaults to 30 seconds and can be set anywhere from 0 seconds to 12 hours.
false_statement: An Amazon SQS visibility timeout defaults to 30 seconds and can be set anywhere from 0 seconds to 15 minutes.
explanation: After a receive, SQS hides the message for the visibility timeout, which can stretch to 12 hours for slow consumers. Fifteen minutes is the ceiling for message delay, a different setting.
