true_statement: In AWS's US East example rates, HTTP APIs cost $1.00 per million requests and REST APIs $3.50 per million for their first pricing tier (as of 2026-11).
false_statement: In AWS's US East example rates, REST APIs cost $1.00 per million requests and HTTP APIs $3.50 per million for their first pricing tier (as of 2026-11).
explanation: HTTP APIs are the lower-cost option and REST APIs the feature-rich, pricier one. The false statement swaps the two request prices.
