id: aws-000102
product_area: serverless-and-integration
true_statement: A single AWS Lambda invocation can run for at most 15 minutes, whereas an AWS Fargate task has no hard limit on how long it runs.
false_statement: A single AWS Fargate task can run for at most 15 minutes, whereas an AWS Lambda invocation has no hard limit on how long it runs.
explanation: Lambda caps each invocation at 15 minutes, which is why long-running processes are steered to Fargate. Fargate tasks have no fixed duration cap, so the false statement reverses the two services.
