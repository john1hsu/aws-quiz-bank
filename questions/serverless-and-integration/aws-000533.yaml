id: aws-000533
product_area: serverless-and-integration
true_statement: Since 1 August 2025, AWS Lambda bills Init time for on-demand invocations of ZIP-packaged functions on managed runtimes at the normal duration rate.
false_statement: Since 1 August 2025, AWS Lambda bills Init time only for container-image functions, leaving ZIP-packaged functions on managed runtimes unbilled.
explanation: The August 2025 change brought on-demand ZIP functions on managed runtimes in line with custom runtimes, container images and provisioned concurrency, which already billed Init. AWS expected little bill impact since cold starts are rare.
