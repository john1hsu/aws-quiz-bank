id: aws-000604
product_area: serverless-and-integration
true_statement: For high availability, Amazon MQ for ActiveMQ runs an active/standby broker pair across two AZs, while Amazon MQ for RabbitMQ runs a three-node cluster.
false_statement: For high availability, Amazon MQ for RabbitMQ runs an active/standby broker pair across two AZs, while Amazon MQ for ActiveMQ runs a three-node cluster.
explanation: ActiveMQ brokers get redundancy from a standby broker in a second AZ that shares storage with the active one. RabbitMQ brokers get it from a three-node cluster; the false statement swaps the engines.
