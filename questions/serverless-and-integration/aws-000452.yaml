id: aws-000452
product_area: serverless-and-integration
true_statement: An AWS AppSync request can execute for at most 30 seconds, a fixed limit, so long-running work should be started asynchronously and the resolver should return at once.
false_statement: An AWS AppSync request can execute for at most 15 minutes, a fixed limit, so long-running work should be started asynchronously and the resolver should return at once.
explanation: AppSync caps request execution at 30 seconds and the quota can't be raised. Longer jobs should be handed off, for example to Lambda or EventBridge, instead of blocking the resolver.
