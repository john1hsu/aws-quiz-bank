id: aws-000454
product_area: serverless-and-integration
true_statement: In AppSync Events, a namespace sets the authorization rules and handler code shared by all of its channels.
false_statement: In AppSync Events, each channel sets its own authorization rules and handler code, and a namespace only groups channels by name.
explanation: 'Namespaces are the unit of configuration in AppSync Events: auth modes and onPublish or onSubscribe handlers apply to every channel inside. Clients can subscribe to many of those channels with a wildcard path.'
