id: aws-000606
product_area: serverless-and-integration
true_statement: On Amazon MQ for RabbitMQ 4.x, quorum queues are the only replicated, durable queue type, because classic queue mirroring is no longer supported.
false_statement: On Amazon MQ for RabbitMQ 4.x, mirrored classic queues are the only replicated, durable queue type, because quorum queues are no longer supported.
explanation: RabbitMQ 4.x dropped classic queue mirroring, leaving quorum queues, with a leader and followers in different AZs, as the replicated option. Non-replicated classic queues still work.
