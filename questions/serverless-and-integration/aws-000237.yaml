id: aws-000237
product_area: serverless-and-integration
true_statement: In Amazon API Gateway, native JWT authorizers are an HTTP API feature, while API keys with per-client usage throttling are a REST API feature.
false_statement: In Amazon API Gateway, native JWT authorizers are a REST API feature, while API keys with per-client usage throttling are an HTTP API feature.
explanation: HTTP APIs are the cheaper type with a few features of their own, such as built-in JWT authorizers. API keys and usage plans, along with caching and AWS WAF, are available only on REST APIs.
