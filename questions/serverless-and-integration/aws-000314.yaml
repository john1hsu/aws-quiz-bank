id: aws-000314
product_area: serverless-and-integration
true_statement: An Amazon SQS message can be up to 1 MiB, and the Extended Client Libraries handle payloads up to 2 GB by storing them in Amazon S3 (as of 2026-11).
false_statement: An Amazon SQS message can be up to 256 KiB, and the Extended Client Libraries handle payloads up to 2 GB by storing them in Amazon S3 (as of 2026-11).
explanation: AWS raised the SQS message size limit from 256 KiB to 1 MiB in August 2025. Larger payloads go to S3, with only a reference sent through the queue.
