id: aws-000315
product_area: serverless-and-integration
true_statement: Amazon SQS retains messages for 4 days by default, and the retention period can be set from 60 seconds up to 14 days.
false_statement: Amazon SQS retains messages for 1 day by default, and the retention period can be set from 60 seconds up to 14 days.
explanation: The default retention is 4 days, adjustable between one minute and two weeks. A one-day default would be far shorter than what SQS actually keeps.
