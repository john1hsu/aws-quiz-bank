id: aws-000534
product_area: serverless-and-integration
true_statement: Lambda SnapStart works only on published function versions and aliases, not $LATEST, and cannot be combined with provisioned concurrency.
false_statement: Lambda SnapStart works only on $LATEST, not on published function versions and aliases, and cannot be combined with provisioned concurrency.
explanation: SnapStart snapshots a published version once and resumes new environments from that snapshot, so $LATEST is excluded. It is also mutually exclusive with provisioned concurrency.
