product_area: serverless-and-integration
true_statement: Amazon SQS keeps a message until a consumer deletes it or it expires, while Amazon SNS pushes each publish to subscribers and stores nothing for later retrieval.
false_statement: Amazon SNS keeps a message until a consumer deletes it or it expires, while Amazon SQS pushes each publish to subscribers and stores nothing for later retrieval.
explanation: 'SQS is a pull-based queue that holds work until a consumer is ready. SNS is push-based pub/sub: it delivers a copy to every subscriber immediately and has no store to poll later.'
