id: aws-000101
product_area: serverless-and-integration
true_statement: AWS Step Functions Standard Workflows run exactly-once for up to one year, while Express Workflows run at-least-once for up to five minutes.
false_statement: AWS Step Functions Express Workflows run exactly-once for up to one year, while Standard Workflows run at-least-once for up to five minutes.
explanation: Standard Workflows are the long-running, exactly-once option. Express Workflows trade that guarantee for high volume and are capped at five minutes with at-least-once execution, so the false statement swaps the two types.
