id: aws-000103
product_area: serverless-and-integration
true_statement: Amazon EventBridge does not guarantee event ordering, so AWS points to Amazon SQS FIFO queues when the sequence of messages matters.
false_statement: Amazon SQS FIFO queues do not guarantee message ordering, so AWS points to Amazon EventBridge event buses when the sequence of messages matters.
explanation: EventBridge routes events by content but makes no ordering promise, and it does not persist events. SQS FIFO queues are the ordered option, so the false statement gets the roles backwards.
