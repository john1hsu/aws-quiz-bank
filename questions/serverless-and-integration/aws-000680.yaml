id: aws-000680
product_area: serverless-and-integration
true_statement: An Amazon SWF workflow execution can run for at most one year and record at most 25,000 history events, and both are hard quotas.
false_statement: An Amazon SWF workflow execution can run for at most one year and record at most 25,000 history events, and both can be raised through Service Quotas.
explanation: Execution duration and history size are fixed limits; only account-level API throttles can be raised. AWS advises keeping executions under 10,000 events.
