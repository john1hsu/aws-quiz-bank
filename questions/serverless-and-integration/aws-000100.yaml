id: aws-000100
product_area: serverless-and-integration
true_statement: AWS Lambda payloads are limited to 6 MB each way for synchronous invocations and 1 MB for asynchronous invocations.
false_statement: AWS Lambda payloads are limited to 1 MB each way for synchronous invocations and 6 MB for asynchronous invocations.
explanation: Synchronous calls allow 6 MB request and response payloads, or 200 MB when streamed. Asynchronous events are capped lower, at 1 MB.
