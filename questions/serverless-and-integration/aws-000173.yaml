id: aws-000173
product_area: serverless-and-integration
true_statement: An EventBridge pipe connects one source to one target, while an EventBridge event bus routes events from many sources to many targets.
false_statement: An EventBridge event bus connects one source to one target, while an EventBridge pipe routes events from many sources to many targets.
explanation: Pipes are point-to-point, with optional filtering and enrichment in between. Buses are routers that deliver each event to zero or more targets by rule, and the two are often combined.
