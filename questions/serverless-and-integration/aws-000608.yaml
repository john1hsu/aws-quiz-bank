product_area: serverless-and-integration
true_statement: In the classic fan-out pattern, a message is published once to an SNS topic that several SQS queues subscribe to, giving each consumer its own durable buffer.
false_statement: In the classic fan-out pattern, a message is sent once to an SQS queue that several SNS topics poll, giving each consumer its own durable buffer.
explanation: Fan-out pairs SNS's push to many subscribers with a queue per consumer for buffering. SNS topics don't poll queues; the queues subscribe to the topic.
