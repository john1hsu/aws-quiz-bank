id: aws-000679
product_area: serverless-and-integration
true_statement: In Amazon SWF the orchestration logic lives in a decider program you write, while in AWS Step Functions a JSON state machine defines the flow.
false_statement: In AWS Step Functions the orchestration logic lives in a decider program you write, while in Amazon SWF a JSON state machine defines the flow.
explanation: SWF hands each decision task to your own code, which picks the next steps from the execution history. Step Functions uses a declarative state machine instead, which is one reason AWS recommends it for new work.
