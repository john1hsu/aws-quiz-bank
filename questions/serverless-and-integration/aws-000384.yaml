true_statement: Step Functions Express workflows support only the Request Response integration pattern, while Standard workflows also support .sync jobs and task-token callbacks.
false_statement: Step Functions Standard workflows support only the Request Response integration pattern, while Express workflows also support .sync jobs and task-token callbacks.
explanation: Waiting for a job or a callback suits long-running Standard workflows, which can last up to a year. Express workflows are short and high-volume, so they are limited to Request Response calls.
