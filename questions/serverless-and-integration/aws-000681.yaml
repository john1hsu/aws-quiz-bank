id: aws-000681
product_area: serverless-and-integration
true_statement: Amazon SWF is task-oriented, tracking every task and event and passing data between tasks, while with Amazon SQS you build that bookkeeping yourself.
false_statement: Amazon SQS is task-oriented, tracking every task and event and passing data between tasks, while with Amazon SWF you build that bookkeeping yourself.
explanation: SWF keeps durable execution state, visibility APIs and signaling for each workflow. SQS just moves messages, so tracking progress across steps is up to your application.
