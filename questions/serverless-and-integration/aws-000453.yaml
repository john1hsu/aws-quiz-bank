id: aws-000453
product_area: serverless-and-integration
true_statement: AWS AppSync meters real-time messages in 5 KB units, so delivering one 8 KB message is billed as two operations.
false_statement: AWS AppSync meters real-time messages in 64 KB units, so delivering one 8 KB message is billed as a single operation.
explanation: Real-time updates are counted per 5 KB increment, which makes larger messages cost proportionally more. Requests rejected by authentication or authorization are not billed.
