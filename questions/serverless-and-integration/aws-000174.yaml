id: aws-000174
product_area: serverless-and-integration
true_statement: A rule on a classic EventBridge event bus can have at most 5 targets, and that quota is fixed.
false_statement: A rule on a classic EventBridge event bus can have at most 50 targets, and that quota is fixed.
explanation: Classic buses allow 300 rules per bus by default (adjustable) but only 5 targets per rule, which cannot be raised. Wider fan-out needs more rules or another routing layer.
