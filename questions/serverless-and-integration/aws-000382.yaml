id: aws-000382
product_area: serverless-and-integration
true_statement: AWS Step Functions caps input and output at 256 KiB per task, state or execution, a hard limit, so large payloads are stored in S3 and passed by reference.
false_statement: AWS Step Functions caps input and output at 256 KiB per task, state or execution, a limit you can raise through Service Quotas for large payloads.
explanation: The 256 KiB payload ceiling cannot be increased. The standard workaround is to put the data in S3 and pass its location between states.
