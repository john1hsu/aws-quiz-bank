id: aws-000383
product_area: serverless-and-integration
true_statement: A Step Functions Map state in Inline mode runs up to 40 parallel branches, while Distributed mode runs up to 10,000 as separate child executions.
false_statement: A Step Functions Map state in Inline mode runs up to 10,000 parallel branches, while Distributed mode runs up to 40 as separate child executions.
explanation: Inline Map is limited to 40 concurrent iterations inside the parent execution. Distributed Map scales to 10,000 child executions and is built for large S3 inputs, avoiding the parent's payload and history limits.
