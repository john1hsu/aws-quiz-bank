id: aws-000242
product_area: serverless-and-integration
true_statement: Amazon SNS FIFO topics deliver only to SQS queues, while standard topics support every delivery protocol, including email, SMS and HTTP/S.
false_statement: Amazon SNS standard topics deliver only to SQS queues, while FIFO topics support every delivery protocol, including email, SMS and HTTP/S.
explanation: FIFO topics add ordering and deduplication but limit subscribers to SQS FIFO or standard queues. Standard topics trade those guarantees for support of all endpoint types.
