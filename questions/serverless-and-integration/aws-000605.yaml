id: aws-000605
product_area: serverless-and-integration
true_statement: Amazon MQ bills per broker-instance hour, so an idle broker still costs money, while Amazon SQS charges per request.
false_statement: Amazon MQ bills per message request, so an idle broker costs nothing, while Amazon SQS charges per queue-instance hour.
explanation: With Amazon MQ you pay for the broker instances you run (plus storage and data transfer) whether or not messages flow. SQS has no brokers and charges for the requests you make.
