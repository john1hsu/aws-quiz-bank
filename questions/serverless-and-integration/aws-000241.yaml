id: aws-000241
product_area: serverless-and-integration
true_statement: Amazon SNS bills each 64 KB chunk of published data as one request, so publishing a single 1 MiB message counts as 16 requests.
false_statement: Amazon SNS bills each 256 KB chunk of published data as one request, so publishing a single 1 MiB message counts as 4 requests.
explanation: SNS meters payloads in 64 KB units, so large messages multiply the request charge. A 1 MiB publish therefore costs as much as 16 small ones.
