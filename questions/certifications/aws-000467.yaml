product_area: certifications
true_statement: December 31, 2026 is the last day to sit the ANS-C01 Advanced Networking – Specialty exam, and AWS has not named a successor certification.
false_statement: December 31, 2026 is the last day to sit the ANS-C01 Advanced Networking – Specialty exam, and AWS names an ANS-C02 version as its successor.
explanation: The networking specialty is being retired with no replacement; AWS points networking learners to Skill Builder. Credentials earned before the cut-off stay active for their three-year term.
