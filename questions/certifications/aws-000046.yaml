product_area: certifications
true_statement: Passing any Associate- or Professional-level AWS exam also renews the AWS Certified Cloud Practitioner credential.
false_statement: Passing AWS Certified AI Practitioner also renews the AWS Certified Cloud Practitioner credential.
explanation: Cloud Practitioner can be kept current by passing a higher-level Associate or Professional exam. AI Practitioner sits at the same foundational level and is not listed as a renewal path.
