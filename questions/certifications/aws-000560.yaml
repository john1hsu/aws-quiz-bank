id: aws-000560
product_area: certifications
true_statement: AWS Certified DevOps Engineer – Professional can be maintained for one year through paid AWS Skill Builder, but only while active and within 90 days of expiry.
false_statement: AWS Certified DevOps Engineer – Professional can be maintained for one year through paid AWS Skill Builder, but only while active and within 180 days of expiry.
explanation: The Skill Builder route opens only in the last 90 days before the credential expires and needs a paid subscription. Otherwise you renew by passing the latest exam version.
