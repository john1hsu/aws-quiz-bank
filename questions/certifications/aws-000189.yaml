id: aws-000189
product_area: certifications
true_statement: SAP-C03 took over Solutions Architect – Professional exam delivery on November 17, 2026, the day after the last SAP-C02 sitting.
false_statement: SAP-C03 takes over Solutions Architect – Professional exam delivery on December 1, 2026, the day after the last SAP-C02 sitting.
explanation: AWS set November 16, 2026 as the final day for SAP-C02 and began SAP-C03 delivery on November 17. Credentials earned on SAP-C02 stay valid until their original expiry.
