true_statement: On the SAA-C03 exam, Design Secure Architectures carries 30% of scored content and Design Cost-Optimized Architectures carries 20%.
false_statement: On the SAA-C03 exam, Design Cost-Optimized Architectures carries 30% of scored content and Design Secure Architectures carries 20%.
explanation: Security is the largest SAA-C03 domain at 30%, followed by resilience at 26% and performance at 24%; cost optimization is the smallest at 20%. The false statement swaps the first and last domains.
