id: aws-000130
product_area: certifications
true_statement: Disaster recovery strategies such as pilot light and warm standby are tested under the SAA-C03 domain Design Resilient Architectures.
false_statement: Disaster recovery strategies such as pilot light and warm standby are tested under the SAA-C03 domain Design High-Performing Architectures.
explanation: The resilience domain covers loose coupling, multi-AZ and multi-Region failover, and DR strategies measured against RPO and RTO. The high-performing domain is about choosing storage, compute, database and network services.
