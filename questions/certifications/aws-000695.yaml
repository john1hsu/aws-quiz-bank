id: aws-000695
product_area: certifications
true_statement: AWS Skill Builder Team subscriptions need at least 5 seats, are non-refundable, and can't have their seat count reduced before the end date.
false_statement: AWS Skill Builder Team subscriptions need at least 50 seats, are refundable within 3 days, and can have their seat count reduced at any time.
explanation: Team plans start at five seats and carry no refunds or seat reductions, though up to 20% of seats can be reassigned during the year. The 3-day refund window applies only to Individual subscriptions.
