id: aws-000011
product_area: certifications
true_statement: Earning AWS Certified Machine Learning Engineer – Associate automatically recertifies the AWS Certified AI Practitioner credential.
false_statement: Earning AWS Certified Cloud Practitioner automatically recertifies the AWS Certified AI Practitioner credential.
explanation: Besides retaking the current AIF-C01 exam, the automatic renewal path is the Machine Learning Engineer – Associate certification. Cloud Practitioner is a separate foundational exam and does not renew it.
