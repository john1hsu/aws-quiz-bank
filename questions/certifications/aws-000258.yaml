id: aws-000258
product_area: certifications
true_statement: After failing an AWS Certification exam you must wait 14 calendar days to retry, and after passing you cannot retake that exam for two years.
false_statement: After failing an AWS Certification exam you must wait 30 calendar days to retry, and after passing you cannot retake that exam for one year.
explanation: The retake policy is a 14-day wait after a fail, with no cap on attempts but a full fee each time, and a two-year block on retaking an exam you have passed.
