id: aws-000696
product_area: certifications
true_statement: AWS Builder Labs run guided exercises in a real AWS console inside a sandbox account, so learners don't pay for the resources they use.
false_statement: AWS Builder Labs run guided exercises in the learner's own AWS account, so learners pay for the resources they use at normal rates.
explanation: Builder Labs, part of paid Skill Builder subscriptions, provide a sandbox account for hands-on practice. That's why AWS pitches them as realistic practice without spending money in your own account.
