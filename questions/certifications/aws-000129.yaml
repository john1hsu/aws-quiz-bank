id: aws-000129
product_area: certifications
true_statement: SAA-C03 is scored on a compensatory model, so a candidate needs a scaled 720 overall rather than a passing score in each section.
false_statement: SAA-C03 is scored section by section, so a candidate needs a scaled 720 in each domain rather than just a passing score overall.
explanation: Under the compensatory model only the overall scaled score from 100 to 1,000 decides pass or fail, with 720 needed. Strength in one domain can offset weakness in another, which is why per-section feedback is only a rough guide.
