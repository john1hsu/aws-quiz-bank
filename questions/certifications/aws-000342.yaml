id: aws-000342
product_area: certifications
true_statement: An active AWS Certified Security – Specialty credential can be extended by one year through a paid AWS Skill Builder subscription, starting within 90 days of expiry.
false_statement: An active AWS Certified Security – Specialty credential can be extended by three years through a paid AWS Skill Builder subscription, starting within 90 days of expiry.
explanation: The Skill Builder route maintains the credential for only one more year. A full three-year renewal requires passing the latest version of the exam.
