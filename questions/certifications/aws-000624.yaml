id: aws-000624
product_area: certifications
true_statement: CloudOps Engineer – Associate targets operating and troubleshooting existing workloads, while Solutions Architect – Associate tests designing them.
false_statement: Solutions Architect – Associate targets operating and troubleshooting existing workloads, while CloudOps Engineer – Associate tests designing them.
explanation: The CloudOps certification is the operations-track associate, focused on running what's already built. Designing workloads is the Solutions Architect associate's job, and the CloudOps guide lists architecture design as out of scope.
