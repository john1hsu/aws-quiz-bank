id: aws-000127
product_area: certifications
true_statement: AWS Certified Developer – Associate is renewed for three more years by passing the latest Developer – Associate exam or AWS Certified DevOps Engineer – Professional.
false_statement: AWS Certified Developer – Associate is renewed for three more years by passing the latest Developer – Associate exam or AWS Certified Solutions Architect – Professional.
explanation: The professional exam that recertifies Developer – Associate is DevOps Engineer – Professional, the next step on the developer track. Solutions Architect – Professional is not listed as a renewal path for it.
