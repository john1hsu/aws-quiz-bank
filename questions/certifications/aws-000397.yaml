true_statement: AWS Certified Data Engineer – Associate became available in 2024 as the practical successor to the retired AWS Certified Data Analytics – Specialty.
false_statement: AWS Certified Data Engineer – Associate became available in 2024 as the practical successor to the retired AWS Certified Machine Learning – Specialty.
explanation: The data engineer exam arrived as Data Analytics – Specialty retired in April 2024, taking over analytics and pipeline topics. Machine learning work maps to the ML Engineer – Associate track instead.
