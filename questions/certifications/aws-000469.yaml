id: aws-000469
product_area: certifications
true_statement: AWS Specialty certifications sit outside the Foundational–Associate–Professional hierarchy, so renewing a Professional certification does not renew a Specialty one.
false_statement: AWS Specialty certifications sit inside the Foundational–Associate–Professional hierarchy, so renewing a Professional certification also renews a Specialty one.
explanation: Specialty credentials are renewed on their own, normally by passing the latest version of that exam. A Professional renewal doesn't carry over to them, and the reverse is also true.
