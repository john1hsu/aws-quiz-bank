product_area: certifications
true_statement: AWS renamed SysOps Administrator – Associate to CloudOps Engineer – Associate with SOA-C03, and existing SysOps badges stay valid until they expire.
false_statement: AWS renamed SysOps Administrator – Associate to CloudOps Engineer – Associate with SOA-C03, and existing SysOps badges were converted to the new name at once.
explanation: The CloudOps title goes only to people who pass SOA-C03. Holders of the older SysOps credential keep that badge, unchanged, until it expires.
